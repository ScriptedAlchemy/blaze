[package]
name = "blaze-serve"
description = "blaze's cache server: the packs and unit lists of a distributed build over HTTP/1.1, each pack checked against its name on write"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-core.workspace = true
blaze-wire.workspace = true
anyhow.workspace = true
sha2.workspace = true
# The retained HTTP/1.1 server keeps its transport features explicit.
hyper = { workspace = true, default-features = false, features = ["server", "http1"] }
hyper-util = { workspace = true, default-features = false, features = ["server", "http1", "tokio"] }
futures-util = { workspace = true, default-features = false, features = ["std"] }
http-body-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "io-util", "signal", "sync", "time", "macros"] }
bytes.workspace = true
# Already in the lockfile; configures transport liveness rather than job policy.
socket2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
hegeltest.workspace = true
tempfile.workspace = true
crc32fast.workspace = true

[lints]
workspace = true
