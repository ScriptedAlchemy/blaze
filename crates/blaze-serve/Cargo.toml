[package]
name = "blaze-serve"
description = "blaze's cache server: the packs and unit lists of a distributed build over HTTP/1.1, each pack checked against its name on write"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-own = { workspace = true, features = ["std"] }
blaze-sha256.workspace = true
blaze-sys.workspace = true
blaze-wire.workspace = true

[dev-dependencies]
blaze-own = { workspace = true, features = ["testing"] }
blaze-rng.workspace = true

[lints]
workspace = true
