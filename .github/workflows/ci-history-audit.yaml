name: Retained CI history audit
on:
  push:
    branches: [audit/ci-history-20261031]
    paths: [.github/workflows/ci-history-audit.yaml]
permissions:
  contents: read
  actions: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AUDIT_OUT: ${{ runner.temp }}/ci-history
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate collector and census all workflow runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i 's/utf8-sig/utf-8-sig/g;s/sources|snapshot|workspace|updated/sources|snapshot|updated/' .github/audit/ci_history.py
          python3 -m py_compile .github/audit/ci_history.py
          python3 -I .github/audit/ci_history.py inventory
      - uses: actions/upload-artifact@v7
        with:
          name: ci-history-inventory
          path: ${{ runner.temp }}/ci-history/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Search all retained attempts and diagnostic archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/audit/ci_history.py scan
      - name: Census non-success and rerun job outcomes
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/audit/ci_history.py jobs
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-history-search
          path: ${{ runner.temp }}/ci-history
          retention-days: 7
          if-no-files-found: error
      - name: Archive current reviewed source without credentials
        if: ${{ always() }}
        run: |
          git archive HEAD | gzip > "$RUNNER_TEMP/ci-history-source.tar.gz"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-history-source
          path: ${{ runner.temp }}/ci-history-source.tar.gz
          retention-days: 7
