name: Pinned offline repair toolchain
on:
  push:
    branches: [verify/concurrent-repairs-20261101]
    paths: [.github/workflows/concurrent-local-toolchain.yaml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Install the repository's exact compiler and locked dependency sources
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal -c rustfmt -c rust-src
          rustup default 1.99.0
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/offline"
          root="$(rustc --print sysroot)"
          tar -C "$root" -cf - . | zstd -T2 -3 -o "$RUNNER_TEMP/offline/rust.tar.zst"
          tar -C "$HOME/.cargo" -cf - registry git 2>/dev/null | zstd -T2 -3 -o "$RUNNER_TEMP/offline/cargo.tar.zst" || {
            rm -f "$RUNNER_TEMP/offline/cargo.tar.zst"
            tar -C "$HOME/.cargo" -cf - registry | zstd -T2 -3 -o "$RUNNER_TEMP/offline/cargo.tar.zst"
          }
          rustc -vV > "$RUNNER_TEMP/offline/compiler.txt"
          sha256sum "$RUNNER_TEMP/offline/"*.zst > "$RUNNER_TEMP/offline/SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: concurrent-offline-toolchain
          path: ${{ runner.temp }}/offline
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
