name: Exact manual cache object transfer
on:
  push:
    branches: [transfer/manual-cache-eviction]
    paths: [.github/workflows/manual-cache-object-transfer.yaml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact patch and reconstruct only the tested bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          patch=Path('.github/manual-cache-eviction.patch').read_bytes().replace(b'\n diff --git ',b'\ndiff --git ')
          assert hashlib.sha256(patch).hexdigest()=='c76a3548ee1c619e72632cac99bf0a87df6a5c9a5ea6345081f1a1e07103222a'
          (Path(os.environ['RUNNER_TEMP'])/'manual-cache.patch').write_bytes(patch)
          PY
          git checkout --detach dc059adba8126493b868a9ea2d4343cf49730765
          git apply --check "$RUNNER_TEMP/manual-cache.patch"
          git apply "$RUNNER_TEMP/manual-cache.patch"
          git diff --check
      - name: Store verified blobs only; no commit, branch update or push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          expected={
            'crates/ra-jit/src/remote.rs':'19369545183c2c2fff9d937bb5d50c14b2508985',
            'crates/ra-jit/src/remote/keeper.rs':'8a5b8c9ef0707bbbd2ca5654ef02a5c1785b3a0b',
            'crates/ra-jit/src/remote/keeper/recovery_tests.rs':'c7d0c2f0636438d6bf78d33cd204f51144e0222b',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==set(expected),(actual,set(expected))
          entries=[]
          for path,want in expected.items():
            got=subprocess.check_output(['git','hash-object',path],text=True).strip()
            assert got==want,(path,got,want)
            body={'encoding':'base64','content':base64.b64encode(Path(path).read_bytes()).decode()}
            result=json.loads(subprocess.check_output(['gh','api','--method','POST',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--input','-'],input=json.dumps(body),text=True))
            assert result['sha']==want,(path,result)
            entries.append({'path':path,'mode':'100644','type':'blob','sha':want})
          out=Path(os.environ['RUNNER_TEMP'])/'manual-cache-blobs.json'
          out.write_text(json.dumps(entries,indent=2)+'\n')
          print(out.read_text())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: manual-cache-object-receipt
          path: |
            ${{ runner.temp }}/manual-cache-blobs.json
            ${{ runner.temp }}/manual-cache.patch
          retention-days: 3
          if-no-files-found: error
