          )
          for case_name in "${cases[@]}"; do
            grep -Eq "^test ([[:alnum:]_]+::)*$case_name( - should panic)? \\.\\.\\. ok[[:space:]]*$" "$RUNNER_TEMP/core-evidence/remaining-active-tests.log" \
              || { echo "::error::missing executed active library control: $case_name"; exit 1; }
          done
      - name: keep remaining library failures before the integration tests
        if: ${{ !cancelled() && steps.remaining-active-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: remaining-v2-library-errors
          path: |
            ${{ runner.temp }}/core-evidence/remaining-active-tests.log
            ${{ runner.temp }}/core-evidence/toolchain-pin.txt
            ${{ runner.temp }}/core-evidence/cargo-version.txt
            ${{ runner.temp }}/core-evidence/rustc-version.txt
          if-no-files-found: error
      - name: memo invariant integration controls
        if: ${{ !cancelled() && steps.pinned-cargo.outcome == 'success' }}
        shell: bash
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/core-evidence"
          toolchain="$(cat "$GITHUB_WORKSPACE/harness/toolchain")"
          cargo "+$toolchain" test --release --locked -p blaze-memo --test additions --test resident --test sim --no-fail-fast \
            2>&1 | tee "$RUNNER_TEMP/core-evidence/memo-tests.log"
          for case_name in the_oracle_catches_a_bitwise_copy_dropped_twice_and_a_leak the_oracle_catches_keep_owned_missing_its_drop_list resident_refines_the_reference every_interleaving_answers_as_the_evaluator a_reader_of_a_carried_table_looks_up_only_live_ids; do
            grep -Eq "^test $case_name \\.\\.\\. ok[[:space:]]*$" "$RUNNER_TEMP/core-evidence/memo-tests.log" \
              || { echo "::error::missing executed memo control: $case_name"; exit 1; }
          done
      - name: persisted compiler function-key format controls
        if: ${{ !cancelled() && steps.pinned-cargo.outcome == 'success' }}
        shell: bash
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/core-evidence"
          toolchain="$(cat "$GITHUB_WORKSPACE/harness/toolchain")"
          cargo "+$toolchain" test --release --locked -p blaze-ids --test cached_code \
            2>&1 | tee "$RUNNER_TEMP/core-evidence/fncache-tests.log"
          for case_name in a_previous_format_has_a_different_cached_code_key the_oracle_catches_a_format_left_out_of_the_key every_compilation_input_changes_the_cached_code_key; do
            grep -Eq "^test key::tests::$case_name \\.\\.\\. ok[[:space:]]*$" "$RUNNER_TEMP/core-evidence/fncache-tests.log" \
              || { echo "::error::missing executed function-key control: $case_name"; exit 1; }
          done
      - name: harness pure cores with the pinned Rust toolchain
        if: ${{ !cancelled() && steps.pinned-cargo.outcome == 'success' }}
        shell: bash
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/core-evidence"
          toolchain="$(cat "$GITHUB_WORKSPACE/harness/toolchain")"
          # The adapter's feature closure is locked to the application's exact pins.
          # Metadata does not compile or update the lock. Source modules are read through
          # the repository symlink; none is copied or rewritten.
          harness_snapshot=$(mktemp -d "$RUNNER_TEMP/blaze-harness-core.XXXXXX")
          mkdir -p "$harness_snapshot/.github/fixtures"
          cp -a .github/fixtures/harness-core "$harness_snapshot/.github/fixtures/"
          ln -s "$GITHUB_WORKSPACE/crates" "$harness_snapshot/crates"
          ln -s "$GITHUB_WORKSPACE/Cargo.toml" "$harness_snapshot/Cargo.toml"
          manifest="$harness_snapshot/.github/fixtures/harness-core/Cargo.toml"
          git rev-parse HEAD > "$RUNNER_TEMP/core-evidence/harness-core-source-head.txt"
          metadata_status=0
          timeout --kill-after=10s 120s cargo "+$toolchain" metadata --locked --format-version 1 \
            --manifest-path "$manifest" > "$RUNNER_TEMP/core-evidence/harness-core-metadata.json" \
            2> "$RUNNER_TEMP/core-evidence/harness-core-metadata.log" || metadata_status=$?
          cat "$RUNNER_TEMP/core-evidence/harness-core-metadata.log"
          cp "$(dirname "$manifest")/Cargo.lock" "$RUNNER_TEMP/core-evidence/harness-core.Cargo.lock"
          [ "$metadata_status" -eq 0 ] || exit "$metadata_status"
          python3 - "$(jq -cn --arg seed "$GITHUB_WORKSPACE/crates/harness/Cargo.lock" \
            --arg actual "$RUNNER_TEMP/core-evidence/harness-core.Cargo.lock" '{seed: $seed, actual: $actual}')" <<'PY'
          from dataclasses import dataclass
          import json
          from pathlib import Path
          import sys
          import tomllib

          @dataclass(frozen=True)
          class Input:
              seed: str
              actual: str

          asked = Input(**json.loads(sys.argv[1]))
          seed = tomllib.loads(Path(asked.seed).read_text())
          actual = tomllib.loads(Path(asked.actual).read_text())
          fields = ("name", "version", "source", "checksum")
          identities = {tuple(package.get(field) for field in fields) for package in seed["package"]}
          adapter = ("blaze-harness-core-ci", "0.1.0", None, None)
          identities.add(adapter)
          resolved = [tuple(package.get(field) for field in fields) for package in actual["package"]]
          if actual["version"] != seed["version"] or resolved.count(adapter) != 1:
              raise SystemExit("::error::the harness adapter has no exact root and lock format")
          for package in resolved:
              if package not in identities:
                  raise SystemExit(f"::error::harness adapter dependency is outside the pinned lock: {package}")
          print(f"harness-core: {len(resolved)} exact package identities retained from the application lock")
          PY
          cmp .github/fixtures/harness-core/Cargo.toml "$manifest"
          cmp .github/fixtures/harness-core/lib.rs "$(dirname "$manifest")/lib.rs"
          cmp .github/fixtures/harness-core/Cargo.lock "$(dirname "$manifest")/Cargo.lock"
          timeout --kill-after=10s 600s cargo "+$toolchain" test --release --locked --all-targets \
            --manifest-path "$manifest" \
            2>&1 | tee "$RUNNER_TEMP/core-evidence/harness-core-tests.log"
          cases=(
            ui::tests::a_file_page_is_its_own_file
            ui::tests::an_http_page_is_its_scheme_host_and_port
            ui::tests::other_schemes_and_broken_urls_are_refused
            keys::tests::the_table
            keys::tests::down_up_and_chars
            cdp_ids::tests::two_connections_with_the_same_ids_get_their_own_answers
            cdp_ids::tests::events_orphans_and_forgetting
            cdp_ids::tests::refuses_what_is_not_a_request_and_crossed_answers
            cdp_ids::tests::ids_wrap_and_skip_pending
            cdp_ids::dst::every_cdp_answer_reaches_only_its_asker_once_and_every_live_request_is_answered
            cdp_ids::dst::seeded_plans_pass
            cdp_ids::dst::the_oracle_catches_a_dropped_connections_ids_freed_at_once
            completion::tests::completion_tracks_sessions_through_navigation_and_disappearance
            completion::tests::the_oracle_catches_focus_based_completion
            fileview::tests::the_cited_part_is_marked
            fileview::tests::rendering_escapes_unicode_and_preserves_writer_failures
            intent::tests::a_topic_borrows_the_original_bytes_after_a_unicode_greeting
            memory::tests::sorted_reviews_and_key_scratch_use_the_callers_allocator
            tutor::tests::a_prompt_writes_into_fixed_storage_and_reports_a_full_sink
            run::tests::streamed_answers_match_unicode_lowercase_and_whitespace_normalization
            run::tests::an_order_reuses_its_buffer_when_a_missed_check_returns
          )
          for case_name in "${cases[@]}"; do
            grep -Eq "^test $case_name \\.\\.\\. ok[[:space:]]*$" "$RUNNER_TEMP/core-evidence/harness-core-tests.log" \
              || { echo "::error::missing executed harness-core control: $case_name"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distributed-core-cargo-partial
          path: ${{ runner.temp }}/core-evidence/
          if-no-files-found: warn

  # The gate's build and unit tests on hosted AArch64 (blaze-platform.yaml).
  # What blaze cross-builds is run (ledger row X1, docs/v2/plan/design/toolchain-c.md "Cross
  # compilation"): the probe (harness/v2/cross/probe: hello, threads, a file, TCP loopback, a
  # panic with a backtrace) is built for each Linux glibc triple with nothing of the machine (no
  # cross gcc, no CC_*: `scripts --bin cross` builds under `env -i` with an empty PATH), the
  # AArch64 one is run here and the x86-64 one under qemu-user with Debian's x86-64 glibc to load
  # (libc6-amd64-cross and libgcc-s1-amd64-cross are what it runs against, not what it is built
  # with). Not part of `ci` until it has been green on main: it needs no secret, and its runner
  # label is a new one of the same pool as the job above.
  cross-probe:
    name: cross-built, run (linux x64 under qemu-user, linux arm64)
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: qemu-user and an x86-64 glibc to run against
        uses: ./.github/actions/apt
        with:
          packages: qemu-user-static libc6-amd64-cross libgcc-s1-amd64-cross
      - id: blaze
        uses: ./.github/actions/blaze
        with:
          job: cross-probe
      - run: blaze build --release --locked -p blaze-engine -p blaze-thin
      - name: build the probe for each triple with nothing of the machine, and run it
        run: |
          mkdir -p "$RUNNER_TEMP/cross-bin"
          cp target/release/blaze-thin "$RUNNER_TEMP/cross-bin/blaze"
          cp target/release/blaze-engine "$RUNNER_TEMP/cross-bin/blaze-engine"
          blaze run -q -p scripts --bin cross -- "$(cat <<JSON
          {"command": "check",
           "engine": {"kind": "v2", "blaze": "$RUNNER_TEMP/cross-bin/blaze"},
           "out": "$RUNNER_TEMP/cross.json",
           "triples": ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"],
           "run": {"aarch64-unknown-linux-gnu": [],
                   "x86_64-unknown-linux-gnu": ["qemu-x86_64-static", "-L", "/usr/x86_64-linux-gnu"]}}
          JSON
          )"
      - if: failure()
        uses: ./.github/actions/daemon-log

  # The gate builds and tests on hosted AArch64 (blaze-platform.yaml).
  linux-arm64:
    name: linux arm64
    needs: [changes, scripts, workflows]
    if: needs.changes.outputs.tier != 'none'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: linux-arm64
      os: ubuntu-24.04-arm
      tier: ${{ needs.changes.outputs.tier }}
      smoke: true
      microbench: true

  # The daemon this change builds starts on Linux 6.8: GitHub's hosted ubuntu-22.04 runners
  # boot Ubuntu's linux-azure 6.8 (6.8.0-1070-azure in November 2026), the release's Linux
  # builds run there. linux-azure 6.8.0-1063 and later invert
  # io_uring's check of a provided buffer ring's reserved words (blaze-core's
  # `ReservedCheck`), which stopped every daemon start of v0.20261105.3's release. The
  # binary is the linux-arm64 build's, linked against Ubuntu 24.04's glibc,
  # so it runs in an ubuntu:24.04 container, which shares the host's kernel; Docker's default
  # seccomp profile refuses io_uring, so the container's is off.
  linux-6-8:
    name: daemon starts on Linux 6.8 (hosted ubuntu-22.04-arm)
    needs: [changes, linux-arm64]
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    container:
      image: ubuntu:24.04
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    env:
      # As in `docker run`: the runner's /github/home belongs to its own user.
      HOME: /root
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blaze-linux-arm64
      - name: blaze serve listens, blaze status sees it, blaze stop ends it
        run: |
          tar -xf blaze.tar && uname -r
          ./blaze serve > serve.log 2>&1 & serve=$!
          for _ in $(seq 120); do
            ./blaze status | grep -qvx "no daemon is running" && break
            kill -0 "$serve" 2>/dev/null || { cat serve.log; echo "::error::blaze serve ended before it listened on Linux $(uname -r)"; exit 1; }
            sleep 0.5
          done
          ./blaze status | grep -qvx "no daemon is running" || { cat serve.log; echo "::error::blaze serve did not listen within 60 s on Linux $(uname -r)"; exit 1; }
          ./blaze stop && wait "$serve"

  macos:
    name: macos arm64
    needs: [changes, scripts, workflows]
    if: needs.changes.outputs.tier == 'warm'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: macos-arm64
      os: macos-latest
      tier: warm

  # The released blaze checks the workspace on hosted AArch64. A macOS workspace
  # check remains outstanding; macos above runs builds and tests only on main.
  workspace-check:
    name: blaze check --workspace, linux arm64
    needs: [changes, scripts, workflows]
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      BLAZE_CORES: "2"
      BLAZE_DAEMON_MEMORY_GB: "6"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/blaze
        with:
          job: check
          llvm: true
          reflink: "true"
      - uses: ./.github/actions/script
        with:
          job: check
          memory-gb: ${{ env.BLAZE_DAEMON_MEMORY_GB }}
      # The configured six-GiB budget needs its own accounting scope: the pinned release
      # otherwise subtracts the hosted agent's cached files from that daemon budget.
      # The setup preflight has stopped its owned daemon. This supervisor refuses any
      # other daemon, proves the user scope/cap, and owns serve through all checks below.
      - name: workspace compiler checks in an owned bounded user scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          evidence=$(mktemp -d "$RUNNER_TEMP/workspace-scope.XXXXXX")
          echo "BLAZE_WORKSPACE_SCOPE_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          cat > "$evidence/check.sh" <<'SH'
          set -euo pipefail
          # A shallow checkout needs the base before the optional narrow check.
          # Returning here leaves the complete workspace checks below mandatory.
          changed_packages() {
            if [ -z "$BASE" ] || ! git fetch -q --depth=1 origin "$BASE"; then
              echo "no base to compare with: the workspace check below is the check"; return
            fi
            args=$("$BLAZE_SCRIPTS/changed" "{\"base\": \"$BASE\", \"direct\": true, \"print\": \"args\"}")
            if [ -z "$args" ] || [ "$args" = --workspace ]; then
              echo "nothing narrower than the workspace to check first: ${args:-no package changed}"; return
            fi
            echo "blaze check $args --lib --tests"
            # shellcheck disable=SC2086
            blaze check $args --lib --tests --message-format short --target-dir "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          }
          # TODO(stage 0 with --deny): add `--deny blaze::todo` once the pin takes it.
          echo '::group::blaze check of the packages this change touches'
          changed_packages
          echo '::endgroup::'
          echo '::group::blaze check --workspace'
          blaze check --workspace --message-format short --target-dir "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          echo '::endgroup::'
          echo '::group::blaze check --workspace --all-targets (the test targets compile)'
          blaze check --workspace --all-targets --message-format short --target-dir "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          echo '::endgroup::'
          echo '::group::astlog build and rules'
          blaze build -p astlog --target-dir "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          astlog="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}/debug/astlog"
          [ -x "$astlog" ] || { echo "::error::the build made no executable $astlog"; exit 1; }
          jq -n --arg astlog "$astlog" \
            '{astlog: $astlog, rules: "tools/astlog/rules", paths: ["crates", "tools"], exclude: ["crates/harness"]}' \
            > "$RUNNER_TEMP/astlog.json"
          PYTHONPATH=tools/typed-input/src python3 tools/astlog/scan.py "$RUNNER_TEMP/astlog.json"
          echo '::endgroup::'
          SH
          python3 - "$evidence" <<'PY' | python3 .github/scripts/seed_preflight.py -
          import json, os, pathlib, shutil, sys, uuid
          evidence = pathlib.Path(sys.argv[1])
          print(json.dumps({"blaze": shutil.which("blaze"), "log": str(evidence / "serve.log"),
                            "scope": {"unit": f"blaze-workspace-{uuid.uuid4().hex}.scope",
                                      "memory_gb": os.environ["BLAZE_DAEMON_MEMORY_GB"],
                                      "command": [shutil.which("bash"), "-e", "-o", "pipefail",
                                                  str(evidence / "check.sh")],
                                      "seconds": 4500}}))
          PY
      - name: retain workspace scope and daemon proof
        if: always() && env.BLAZE_WORKSPACE_SCOPE_EVIDENCE != ''
        uses: actions/upload-artifact@v7
        with:
          name: workspace-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BLAZE_WORKSPACE_SCOPE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
      # A timed-out check is cancelled, so failure() alone loses its daemon evidence.
      - if: failure() || cancelled()
        uses: ./.github/actions/daemon-log

  ci:
    name: ci
    needs: [changes, scripts, workflows, lean, distributed-core, linux-6-8, linux-arm64, macos, workspace-check]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: every required check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' > /dev/null \
            || { echo "::error::a required check failed or was cancelled"; exit 1; }
          # Every applicable job must succeed; skipped code-tier checks and absent receipts
          # cannot stand for runtime acceptance. Mac runs only on warm/main.
          echo "$NEEDS" | jq -e '
            .changes.result == "success" and
            .scripts.result == "success" and
            .workflows.result == "success" and
            .lean.result == "success" and
            (.changes.outputs.tier == "none" or
              ((.changes.outputs.tier == "gate" or .changes.outputs.tier == "warm") and
               .["linux-arm64"].result == "success" and
               .["distributed-core"].result == "success" and
               .["linux-6-8"].result == "success" and
               .["workspace-check"].result == "success" and
               (.changes.outputs.tier != "warm" or .macos.result == "success") and
               .["linux-arm64"].outputs.protocol_tests == "true" and
               .["linux-arm64"].outputs.distributed_acceptance == "true" and
               .["linux-arm64"].outputs.forkfixes_acceptance == "true"))
          ' > /dev/null || { echo "::error::required checks or protocol, distributed, or fork migration acceptance are incomplete"; exit 1; }
      # The budget smoke's guards ran and held (harness/v2/guards.py, `held`): a tier that builds
      # blaze has the smoke's result, with an outcome that passed for every bound of every step
      # of both fixtures and for the sandbox's probe. A job that was skipped passes the step
      # above; a smoke that did not run, or dropped a guard, fails this one. A gate run that
      # did not run the smoke is red (docs/harness.md, "The smoke's guards").
      - if: needs.changes.outputs.tier != 'none'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.tier != 'none'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - if: needs.changes.outputs.tier != 'none'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: budgets-smoke-linux-arm64
          path: ${{ runner.temp }}/budgets-smoke
      - name: the budget smoke's guards ran and held
        if: needs.changes.outputs.tier != 'none'
        run: |
          uv run --frozen --no-dev python harness/v2/guards.py "{\"command\": \"held\", \"result\": \"$RUNNER_TEMP/budgets-smoke/budgets-smoke.json\"}"
