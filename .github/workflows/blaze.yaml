name: PR 81 distributed checked data and plan determinism
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  dev:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 80
    env:
      BLAZE_CORES: "2"
      BLAZE_DAEMON_MEMORY_GB: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f11ffb38917399bf6470a2886500d4e2e279b3ce
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: strace bubblewrap
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: production-acceptance
      - uses: ./.github/actions/toolchain-shelf
      - name: Build and seal the exact source binaries
        run: |
          evidence="$RUNNER_TEMP/plan-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 30 2750 cargo +"$(cat pins/toolchain)" build --locked --release --bins -p blaze-cli -p blaze-launcher -p blaze-dist-local -p blaze-serve \
            2>&1 | tee "$evidence/build.log"
          mkdir "$RUNNER_TEMP/source-binaries"
          for binary in blaze blaze-launcher blaze-fact-shim blaze-dist-local blaze-serve; do
            install -m 755 "$CARGO_TARGET_DIR/release/$binary" "$RUNNER_TEMP/source-binaries/$binary"
          done
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"seal\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
      - name: Exercise the unchanged distributed dev fault harness
        run: |
          scratch="$RUNNER_TEMP/blaze-fs/dist-dev"
          input="$RUNNER_TEMP/plan-evidence/dev-input.json"
          bin="$RUNNER_TEMP/source-binaries"
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$bin\",\"services\":true}"
          # shellcheck disable=SC2016
          jq -n --arg bin "$bin" --arg scratch "$scratch" --arg modules "$BLAZE_SCRIPTS/proc_macro_modules" \
            '{blaze:($bin+"/blaze"),dist_local:($bin+"/blaze-dist-local"),serve:($bin+"/blaze-serve"),module_builder:$modules,scratch:$scratch,faults:true,cores:2,timeout:1800,command_timeout:60,args:[],profile:"debug"}' > "$input"
          timeout -k 30 1800 python3 harness/distv2.py "$input" 2>&1 | tee "$RUNNER_TEMP/plan-evidence/dev.log"
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$bin\",\"services\":true}"
      - name: Check fresh and reused head observations in both body orders
        if: '!cancelled()'
        run: |
          timeout -k 30 1200 cargo +"$(cat pins/toolchain)" test --release --locked -p blaze-ladder --lib \
            stretch_store_reused_matches_fresh_forward_and_reversed 2>&1 | tee "$RUNNER_TEMP/plan-evidence/ladder.log"
          grep -Fq 'stretch_store_reused_matches_fresh_forward_and_reversed ... ok' "$RUNNER_TEMP/plan-evidence/ladder.log"
      - name: Retain the unit plans and exact binary receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distributed-checked-data
          path: |
            ${{ runner.temp }}/plan-evidence
            ${{ runner.temp }}/source-binaries/blaze-build.json
            ${{ runner.temp }}/blaze-fs/dist-dev/logs
            ${{ runner.temp }}/blaze-fs/dist-dev/gates
            ${{ runner.temp }}/blaze-fs/dist-dev/*.json
          if-no-files-found: warn
