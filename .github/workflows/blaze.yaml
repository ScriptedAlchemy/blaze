name: PR 81 shared publish staging proof
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact compiler commit containing the regression
        type: string
        required: true
      baseline:
        description: Test-only control containing the original publisher
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Reproduce the staging conflict and execute the repaired bstd suite
        env:
          BASELINE: ${{ inputs.baseline }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/publish-target
        run: |
          timeout 20 git fetch --depth=2 origin "$BASELINE"
          test "$(timeout 10 git rev-parse HEAD^)" = "$(timeout 10 git rev-parse "$BASELINE^")"
          tc=$(timeout 10 cat pins/toolchain)
          test_name=fs::overlapping_publishes_from_two_worlds_keep_their_bytes
          mkdir -p "$RUNNER_TEMP/publish-proof"
          timeout 10 git rev-parse HEAD HEAD^{tree} "$BASELINE" > "$RUNNER_TEMP/publish-proof/revisions"
          timeout 15 git restore --source="$BASELINE" -- crates/blaze-std/src/{fs,io}.rs
          status=0
          timeout -k 15s 720s cargo +"$tc" test --locked -p blaze-std --lib "$test_name" -- --exact \
            > "$RUNNER_TEMP/publish-proof/baseline.log" 2>&1 || status=$?
          timeout 10 tail -45 "$RUNNER_TEMP/publish-proof/baseline.log"
          test "$status" -eq 101
          timeout 10 grep -F 'the second world overwrote the first stage' "$RUNNER_TEMP/publish-proof/baseline.log"
          timeout 15 git restore -- crates/blaze-std/src/{fs,io}.rs
          timeout 10 git diff --exit-code
          timeout -k 15s 720s cargo +"$tc" test --locked -p blaze-std --lib "$test_name" -- --exact \
            2>&1 | tee "$RUNNER_TEMP/publish-proof/focused.log"
          timeout 10 grep -F '1 passed; 0 failed' "$RUNNER_TEMP/publish-proof/focused.log"
          timeout -k 15s 720s cargo +"$tc" test --locked -p blaze-std --lib \
            2>&1 | tee "$RUNNER_TEMP/publish-proof/suite.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-publish-staging-evidence
          path: ${{ runner.temp }}/publish-proof
