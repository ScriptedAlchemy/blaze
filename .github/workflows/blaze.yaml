name: PR 81 compiler fixture regressions
on:
  workflow_dispatch:
    inputs:
      source:
        required: true
        type: string
      suite:
        required: true
        type: choice
        options: [items, front-equal, ladder-lib, test-cache, closure-sigs, closure-fn-pointer, warm-socket, span-pool, serve-abort]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
  BLAZE_CORES: all
jobs:
  fixtures:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - name: Give workspace tests a short same-filesystem home
        run: |
          mkdir "$RUNNER_TEMP/blaze-fs/workspace-home"
          test_home=$(timeout 10 mktemp -d /tmp/bc.XXXXXX)
          timeout 10 sudo mount --bind "$RUNNER_TEMP/blaze-fs/workspace-home" "$test_home"
          printf '%s\n' "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "HOME=$test_home" >> "$GITHUB_ENV"
      - uses: ./.github/actions/script
        if: inputs.suite != 'warm-socket' && inputs.suite != 'span-pool' && inputs.suite != 'serve-abort'
        with:
          job: cargo
      - uses: ./.github/actions/toolchain-shelf
        if: inputs.suite != 'warm-socket' && inputs.suite != 'span-pool' && inputs.suite != 'serve-abort'
      - name: Build and run the selected regression
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          evidence="$RUNNER_TEMP/fixture-evidence"
          mkdir -p "$evidence"
          timeout 15 git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          tc=$(timeout 10 cat pins/toolchain)
          case "$SUITE" in
            items) crate=blaze-ladder; target=front2_items; cargo_target=(--test "$target"); selection=(--test-threads=4) ;;
            front-equal) crate=blaze-ladder; target=front_equal; cargo_target=(--test "$target"); selection=(--test-threads=4) ;;
            ladder-lib) crate=blaze-ladder; target=blaze_ladder; cargo_target=(--lib); selection=(--test-threads=4) ;;
            closure-sigs) crate=blaze-ladder; target=front2_closure_sigs; cargo_target=(--test "$target"); selection=(closure_and_projection_signatures_are_laid_and_checked --exact) ;;
            closure-fn-pointer) crate=blaze-flow-lower; target=blaze_flow_lower; cargo_target=(--lib); selection=(callee_value_tests::explicit_closure_to_fn_pointer_cast_uses_the_checked_coercion_once --exact) ;;
            warm-socket) crate=blaze-core; target=blaze_core; cargo_target=(--lib); selection=(tests::a_warm_send_and_receive_allocates_nothing --exact) ;;
            span-pool) crate=blaze-mem; target=blaze_mem; cargo_target=(--lib); selection=() ;;
            serve-abort) crate=blaze-serve; target=serve; cargo_target=(--test "$target"); selection=() ;;
            test-cache)
              crate=blaze-cli; target=test_command_runs; cargo_target=(--test "$target")
              selection=(pooled_workers_match_serial_bztr_and_purity --exact)
              timeout -k 20 780 cargo +"$tc" build --locked -p blaze-launcher --bins
              ;;
            *) exit 2 ;;
          esac
          timeout -k 20 1760 cargo +"$tc" test --locked -p "$crate" "${cargo_target[@]}" \
            --no-run --message-format=json-render-diagnostics > "$evidence/build.jsonl"
          # shellcheck disable=SC2016
          binary=$(timeout 20 jq -er --arg target "$target" \
            'select(.target.name==$target and .executable!=null).executable' "$evidence/build.jsonl")
          if [[ "$SUITE" == warm-socket ]]; then
            for run in {1..32}; do
              printf 'warm socket run %s\n' "$run" | tee -a "$evidence/test.log"
              BLAZE_ALLOC_TRACE=1 timeout -k 5 20 "$binary" "${selection[@]}" 2>&1 | tee -a "$evidence/test.log"
            done
            test "$(timeout 10 grep -Fc '1 passed; 0 failed' "$evidence/test.log")" -eq 32
            timeout -k 15 240 "$binary" --test-threads=4 2>&1 | tee "$evidence/blaze-core.log"
          elif [[ "$SUITE" == span-pool ]]; then
            for run in {1..12}; do
              printf 'span pool suite run %s\n' "$run" | tee -a "$evidence/test.log"
              timeout -k 10 90 "$binary" 2>&1 | tee -a "$evidence/test.log"
            done
            test "$(timeout 10 grep -Fc 'test result: ok.' "$evidence/test.log")" -eq 12
          elif [[ "$SUITE" == serve-abort ]]; then
            for run in {1..12}; do
              printf 'server integration suite run %s\n' "$run" | tee -a "$evidence/test.log"
              timeout -k 10 90 "$binary" --test-threads=4 2>&1 | tee -a "$evidence/test.log"
            done
            test "$(timeout 10 grep -Fc 'an_aborted_put_removes_its_staged_pack ... ok' "$evidence/test.log")" -eq 12
          else
            timeout -k 20 480 /usr/bin/time -v "$binary" --nocapture "${selection[@]}" 2>&1 | tee "$evidence/test.log"
            if [[ "$SUITE" == closure-* ]]; then
              timeout 10 grep -Fq '1 passed; 0 failed' "$evidence/test.log"
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: focused-compiler-fixtures
          path: |
            ${{ runner.temp }}/fixture-evidence
            ${{ runner.temp }}/toolchain-cut
          if-no-files-found: warn
