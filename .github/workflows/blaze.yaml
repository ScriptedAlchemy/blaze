name: PR 81 system import and store publication controls
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact source commit
        type: string
        required: true
      check:
        description: Validation lane
        type: choice
        options: [imports, cas]
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  imports:
    if: inputs.check == 'imports'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - run: timeout 15 git rev-parse HEAD 'HEAD^{tree}'
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
        with:
          components: llvm-tools
          targets: x86_64-unknown-linux-gnu aarch64-apple-darwin
      - uses: ./.github/actions/script
        with:
          job: workspace
      - name: blaze-sys imports, per target
        run: |
          tc="$(timeout 10 cat pins/toolchain)"
          sysroot="$(timeout 10 rustc +"$tc" --print sysroot)"
          nm="$sysroot/lib/rustlib/aarch64-unknown-linux-gnu/bin/llvm-nm"
          for triple in aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            receipt="$RUNNER_TEMP/sys-imports-$triple.jsonl"
            timeout -k 30 600 cargo +"$tc" build --locked -p blaze-sys --lib --target "$triple" \
              --target-dir "$RUNNER_TEMP/blaze-fs/sys-imports" --message-format=json-render-diagnostics > "$receipt"
            object=$(timeout 10 jq -esr '
              [ .[] | select(.reason == "compiler-artifact" and .target.name == "blaze_sys"
                             and (.target.kind | index("lib") != null))
                    | .filenames[] | select(endswith(".rlib")) ] | unique
              | if length == 1 then .[0] else error("expected one blaze-sys rlib in the Cargo receipt") end
            ' "$receipt")
            builtins=("$sysroot/lib/rustlib/$triple/lib/"libcompiler_builtins-*.rlib)
            if [[ ${#builtins[@]} != 1 || ! -f ${builtins[0]} ]]; then
              printf 'Expected one compiler_builtins rlib for %s in %s\n' "$triple" "$sysroot" >&2
              exit 1
            fi
            printf 'Checking system imports for %s in %s\n' "$triple" "$object"
            # shellcheck disable=SC2016
            input=$(timeout 10 jq -cn --arg triple "$triple" --arg object "$object" \
              --arg builtins "${builtins[0]}" --arg nm "$nm" '
                {command:"check",objects:[$object],builtins:$builtins,nm:$nm}
                + (if $triple == "aarch64-apple-darwin" then
                    {target:"macos",ratchet:"tools/ratchets/blaze-sys-libsystem.txt"}
                  else {target:"linux"} end)')
            timeout -k 30 120 "$BLAZE_SCRIPTS/sys_imports" "$input"
          done
  cas:
    if: inputs.check == 'cas'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Exercise the publication pin against the CAS suite
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cas-target
        run: |
          timeout 15 git rev-parse HEAD 'HEAD^{tree}'
          tc=$(timeout 10 cat pins/toolchain)
          timeout -k 15 900 cargo +"$tc" test --locked -p blaze-cas --lib
