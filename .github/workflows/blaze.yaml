name: PR 81 signed cache over HTTPS
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact signed-origin compiler source
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  signed-origin:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/script
        with:
          job: source-compiler
      - uses: ./.github/actions/toolchain-shelf
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403
          enable-cache: false
      - name: Build the trusted publisher and developer CLI
        timeout-minutes: 75
        run: |
          timeout 15 git rev-parse HEAD 'HEAD^{tree}'
          tc=$(timeout 10 cat pins/toolchain)
          for role in publisher developer; do
            features=()
            if [[ $role == publisher ]]; then features=(--features blaze-cli/publish); fi
            timeout -k 20 2100 cargo +"$tc" build --locked --release --bins -p blaze-cli -p blaze-launcher "${features[@]}"
            dest="$RUNNER_TEMP/$role"
            timeout 10 mkdir "$dest"
            for bin in blaze blaze-launcher blaze-fact-shim; do
              timeout 10 install -m 755 "${CARGO_TARGET_DIR}/release/$bin" "$dest/$bin"
            done
          done
      - name: Publish, verify and consume the signed set
        timeout-minutes: 22
        run: |
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -cn             --arg publisher "$RUNNER_TEMP/publisher/blaze" --arg developer "$RUNNER_TEMP/developer/blaze"             --arg shelf "$HOME/.blaze/v2/toolchain" --arg scratch "$RUNNER_TEMP/blaze-fs/signed-origin"             '{blaze:$publisher,alternate_blaze:$developer,shelf:$shelf,scratch:$scratch,timeout:240}')
          timeout -k 15 1200 uv run --frozen --no-dev python harness/v2/signed_origin.py "$input"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signed-origin-receipt
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/blaze-fs/signed-origin/*.stdout
            ${{ runner.temp }}/blaze-fs/signed-origin/*.stderr
            ${{ runner.temp }}/blaze-fs/signed-origin/https-observations.json
            ${{ runner.temp }}/blaze-fs/signed-origin/result.json
