name: PR 81 distributed native compiler verification
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9355eb59cac365eb28c28b12874efa1a309a1b97
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/llvm-prefix
      - name: compile native planner and CLI integration
        run: |
          timeout -k 30 2400 cargo +"$(cat pins/toolchain)" check --locked -p blaze-cli --bins --message-format short
      - name: execute each native ARM64 relocation control and the exported executable
        if: ${{ !cancelled() }}
        run: |
          tc=$(cat pins/toolchain)
          timeout -k 15 600 cargo +"$tc" test --locked -p blaze-code --lib place_tests:: -- --nocapture | tee "$RUNNER_TEMP/relocs"
          grep -Fq 'single_arm64_sites_keep_the_registers_neighbours_scale_and_branch_link ... ok' "$RUNNER_TEMP/relocs"
          timeout -k 15 900 cargo +"$tc" test --locked -p blaze-export --test arm64_relocations -- --nocapture | tee "$RUNNER_TEMP/exported"
          grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/exported"
      - name: exercise module verification and distributed preparation
        if: ${{ !cancelled() }}
        run: |
          tc=$(cat pins/toolchain)
          timeout -k 15 1800 cargo +"$tc" test --locked -p blaze-cli --bin blaze engine_dist::prepared -- --nocapture | tee "$RUNNER_TEMP/prep"
          grep -Eq '[1-9][0-9]* passed; 0 failed' "$RUNNER_TEMP/prep"
