name: PR 81 isolate later source protocol suites
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact compiler source commit
        type: string
        required: true
      source_run:
        description: Workflow run that sealed the exact source compiler
        type: string
        required: true
      suite:
        description: Protocol packages to exercise
        type: choice
        options: [wire-and-serve, local, serve-abort]
        default: wire-and-serve
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: bash
env:
  BLAZE_CORES: "2"
  BLAZE_TESTS: verify
  RUST_BACKTRACE: "0"
jobs:
  protocol:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.suite == 'local' && '["blaze-dist-local"]' || inputs.suite == 'serve-abort' && '["blaze-serve"]' || '["blaze-wire", "blaze-serve"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: strace bubblewrap
      - name: Enable sandbox user namespaces
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            timeout 10 sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/download-artifact@v8
        with:
          name: source-compiler
          path: ${{ runner.temp }}/source-package
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Verify exact source and execute its protocol tests
        env:
          PACKAGE: ${{ matrix.package }}
          SUITE: ${{ inputs.suite }}
        run: |
          mkdir -p "$RUNNER_TEMP/source-binaries" "$RUNNER_TEMP/source-shelf"
          timeout 45 tar -xzf "$RUNNER_TEMP/source-package/source-binaries.tar.gz" -C "$RUNNER_TEMP/source-binaries"
          timeout 45 tar -xzf "$RUNNER_TEMP/source-package/source-toolchain.tar.gz" -C "$RUNNER_TEMP/source-shelf"
          timeout 90 python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
          # shellcheck disable=SC2016
          timeout 20 jq -n --arg blaze "$RUNNER_TEMP/source-binaries/blaze" --arg cwd "$GITHUB_WORKSPACE" \
            --arg home "$RUNNER_TEMP/blaze-fs/protocol-home" --arg out "$RUNNER_TEMP/package-evidence" \
            --arg shelf "$RUNNER_TEMP/source-shelf/toolchain" --arg package "$PACKAGE" --arg suite "$SUITE" \
            '{blaze:$blaze,cwd:$cwd,home:$home,out:$out,shelf:$shelf,command_seconds:2070,commands:
              (if $suite == "serve-abort" then
                [range(0; 12) | {name:("serve-" + tostring),args:["test","-p","blaze-serve","--","--run-all","--format","pretty"]}]
              else [{name:$package,args:["test","-p",$package,"--view","json","--","--run-all","--format","json"]}] end)}' \
            > "$RUNNER_TEMP/package-input.json"
          status=0
          timeout -k 20 2130 python3 harness/v2/exec_observer.py "$RUNNER_TEMP/package-input.json" || status=$?
          timeout 90 python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.package }}-observed
          path: ${{ runner.temp }}/package-evidence
          if-no-files-found: warn
