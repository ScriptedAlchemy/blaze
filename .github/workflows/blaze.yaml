name: PR 81 pinned Cargo producer directives
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact producer source commit
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  producer:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: bubblewrap
      - name: Enable sandbox user namespaces
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            timeout 10 sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: production-acceptance
      - name: Compile the retained fixture's WASI modules
        run: |
          root="$RUNNER_TEMP/blaze-fs/d52-producer"
          evidence="$RUNNER_TEMP/d52-producer-evidence"
          mkdir -p "$evidence"
          timeout 10 git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout 15 cargo +"$(cat pins/toolchain)" -Vv > "$evidence/cargo.txt"
          timeout 20 python3 - "$root" > "$evidence/request.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "harness")
          import forkfixes
          scratch = Path(sys.argv[1])
          project = scratch / "project"
          project.mkdir(parents=True)
          case = next(case for case in forkfixes.CASES
                      if case["name"] == "a-script-searches-where-its-build-dependencys-script-said")
          forkfixes.write_files(project, forkfixes.initial_files(case))
          forkfixes.write_files(project, forkfixes.steps_for(case)[0].get("files", {}))
          print(json.dumps({"build_scripts":{
              "checkout": str(project), "store": str(scratch / "records"),
              "work": str(scratch / "work"), "tree": str(Path.cwd()),
              "crates": [{"name": name, "version": "0.1.0", "features": []}
                         for name in case["build_scripts"]],
              "unsandboxed_build_scripts": False, "build_seconds": 600,
          }}))
          PY
          sha256sum "$BLAZE_SCRIPTS/proc_macro_modules" > "$evidence/builder.sha256"
          timeout -k 20 650 env -i HOME="$HOME" PATH="$PATH" RUST_BACKTRACE=0 \
            "$BLAZE_SCRIPTS/proc_macro_modules" "$(cat "$evidence/request.json")" \
            2>&1 | tee "$evidence/producer.log"
          grep -Fq 'dep 0.1.0 []: script module' "$evidence/producer.log"
          grep -Fq 'app 0.1.0 []: script module' "$evidence/producer.log"
          grep -R -m 1 '^producer-output-wasi dep 0.1.0 files:' "$root/records/build-script/modules" \
            > "$evidence/binding.txt"
      - name: Inventory Cargo build outputs
        if: always()
        run: |
          root="$RUNNER_TEMP/blaze-fs/d52-producer/work/bs-target"
          if [ -d "$root" ]; then
            timeout 35 find "$root" -type f -printf '%P\t%s\n' | timeout 10 sort > "$RUNNER_TEMP/d52-producer-evidence/cargo-files.txt"
          fi
      - name: Preserve producer inputs and outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d52-producer-evidence
          path: ${{ runner.temp }}/d52-producer-evidence
          if-no-files-found: warn
