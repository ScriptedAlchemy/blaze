name: PR 81 bounded cache transport and read-ahead checks
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact bounded-read candidate
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the native compiler's pinned LLVM
        run: |
          prefix="$RUNNER_TEMP/pinned-llvm"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -cn --arg prefix "$prefix" '{command:"fetch",target:"aarch64-unknown-linux-gnu",dir:$prefix}')
          timeout -k 15 600 python3 .github/scripts/llvm.py "$input"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Test the cache transport and compile both exporter paths
        run: |
          timeout 15 git rev-parse HEAD 'HEAD^{tree}'
          tc=$(timeout 10 cat pins/toolchain)
          timeout -k 20 800 cargo +"$tc" test --locked -p blaze-dist-local --lib
          timeout -k 20 800 cargo +"$tc" check --locked -p blaze-cli --bin blaze --features llvm --message-format short
