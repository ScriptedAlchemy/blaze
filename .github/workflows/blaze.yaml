# blaze: the merge gate. What a pull request and each entry of the merge queue has to pass:
# one build of blaze shared by the tests, distributed acceptance and microbenchmarks on Linux
# AArch64, a build for Linux x86-64 cross-compiled there, and checks of the harness scripts.
# The other harnesses on every platform run in the release train (train.yaml), which releases main when
# it is green and opens an issue when it is not. What runs where, and how long it takes, is in
# docs/harness.md ("CI").
#
#   pull request, merge queue: the unit tests and the build on Linux AArch64,
#       `blaze check --workspace` and `blaze check --workspace --all-targets` (every crate's
#       test targets type-check) with the release on Linux AArch64,
#       real distributed library controls and source-built protocol/fault acceptance,
#       `harness/imports.py` and `rustcsites` (scripts/), actionlint over the workflows. No `blaze fmt --check`: fmt.yaml
#       formats main after each push instead.
#   push to main: the build and the unit tests on Linux AArch64 and macOS, which
#       write the caches every other run reads, and the same `blaze check --workspace`. One runs at a time: the next push waits, and a
#       newer one replaces it, so each run ends and writes the caches as of its commit.
#
# A change runs the build and the unit tests only when it touches a file they read: the crates,
# the vendored crates, astlog (tools/astlog), the workspace's manifest, lock file, cargo
# config, .rustfmt.toml and .clippy.toml, the pinned nightly (harness/toolchain),
# harness/unittests.py, harness/distv2.py and its fixtures/oracles, the flake, the release of blaze that builds blaze
# (.github/blaze-version, site/install.sh), and these workflows and the actions they use; on a push
# to main, also the smoke corpus (harness/smoke.py, harness/smoke/).
# scripts/src/bin/gate_changes.rs has the list and why each path is on it. It names what is
# code, so a new directory is not: any other change (documentation, the site, benches, the
# other harnesses and workflows) runs the script, workflow and Lean checks plus partial
# distributed library feedback, and a list of files that cannot be had counts as code.
# `ci` is the one check that says whether everything that ran passed: it
# is the check branch rules and the merge queue require. The queue tests each pull request
# merged onto main and whatever is ahead of it, and main moves only to what it tested.
#
# Main's #69/#71 policy: GitHub-hosted runners only. Linux remains AArch64; native
# Linux x86-64 coverage is an outstanding gap. The workflows job checks runner labels
# for pull requests and merge-group entries; no private-runner snapshot is restored.
name: blaze
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # A pull request's newer push cancels its run before. Main runs one push at a time: a push
  # while one runs waits, and a newer push replaces the one waiting, never the one running, so
  # each run ends and covers every merge up to its commit. A group of its own per push stacked
  # up a full three-platform run per merge (17 at once on 2026-10-28, each waiting on macOS
  # runners) and none of them got runners in time. A merge-queue entry or a run by hand is
  # still a group of its own. A push groups by its ref: a push to a lane branch shares no group
  # with main (2026-11-05: lane-branch pushes sat in `blaze-main` and kept replacing main's
  # waiting run, so no main run finished all day).
  group: blaze-${{ github.event_name == 'push' && github.ref || format('{0}-{1}', github.event_name, github.event_name == 'pull_request' && github.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all

jobs:
  # Which tier runs: `gate` for a pull request and the merge queue, `warm` for a push to main
  # (or by hand), or `none` for a change that touches no file the tier reads (the pull
  # request's files, the merge queue entry's or the push's against the commit before it;
  # scripts/src/bin/gate_changes.rs). Anything that cannot be told counts as code.
  changes:
    name: changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    outputs:
      tier: ${{ steps.files.outputs.tier }}
    steps:
      # The script key hashes its complete local dependency closure, including vendor sources.
      # Materialize it before keying; an incomplete checkout cannot produce a cache key.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: bootstrap
        uses: ./.github/actions/script
        with:
          job: changes
      # A locked bootstrap failure stays a failure. Ask the exact installed release for its
      # proposed lockfiles in a complete, disposable snapshot, never in the build's checkout.
      - name: diagnose bootstrap lockfiles in an isolated snapshot
        if: failure() && steps.bootstrap.outcome == 'failure'
        timeout-minutes: 4
        run: |
          set -euo pipefail
          blaze_bin=$(command -v blaze)
          snapshot=$(mktemp -d "$RUNNER_TEMP/blaze-lock.XXXXXX")
          trap 'rm -rf "$snapshot"' EXIT
          evidence="$RUNNER_TEMP/blaze-lock-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/commit.txt"
          blaze-engine --version > "$evidence/version.txt"
          timeout 30s git archive HEAD | timeout 30s tar -x -C "$snapshot"
          (cd "$snapshot" && timeout --kill-after=10s 120s "$blaze_bin" lock -p scripts --bins) \
            2>&1 | tee "$evidence/resolve.log"
          cp "$snapshot/Cargo.lock" "$evidence/Cargo.lock"
          if [ -f "$snapshot/blaze.lock" ]; then cp "$snapshot/blaze.lock" "$evidence/blaze.lock"; fi
          diff_status=0
          diff -u Cargo.lock "$evidence/Cargo.lock" > "$evidence/Cargo.lock.diff" || diff_status=$?
          cat "$evidence/Cargo.lock.diff"
          [ "$diff_status" -le 1 ]
      - name: keep bootstrap lockfile diagnosis
        if: failure() && steps.bootstrap.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-lock-diagnosis
          path: ${{ runner.temp }}/blaze-lock-evidence/
          if-no-files-found: warn
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'warm' || 'gate' }}
          # Empty on a run by hand, which then counts as code.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          "$BLAZE_SCRIPTS/gate_changes" \
            "{\"tier\": \"$TIER\", \"repository\": \"$GITHUB_REPOSITORY\", \"base\": \"$BASE\", \"head\": \"$HEAD\"}"

  scripts:
    name: harness imports, rustc sites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - name: script cache key closure and refusal controls
        run: timeout 60s bun .github/actions/script/test-key.mjs
      - uses: ./.github/actions/toolchain
      - name: kernel execution tracing for the observer controls
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends strace
      # The repository's Python workspace (pyproject.toml, uv.lock): its scripts lint and type-check.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (hosted runner is arm64)
          enable-cache: false
      - name: standard library source digest
        run: uv run --frozen python harness/library.py check '{}'
      - run: uv run --frozen ruff check
      - run: uv run --frozen pyright
      # Some scripts ask rustc for the host when imported: after the toolchain is installed. In
      # the workspace's Python, which has its helpers (tools/typed-input) for the scripts that use them.
      - run: uv run --frozen python harness/imports.py
      # This is only the distributed acceptance oracle's planted-bug selfcheck,
      # NOT the real two-daemon execution required for V2 acceptance.
      - name: distributed acceptance oracle negative controls
        run: uv run --frozen python harness/distv2/selfcheck.py
      - name: distributed build identity and CI acceptance regressions
        run: uv run --frozen python -m unittest discover --start-directory .github/scripts --pattern 'test_distributed_ci.py'
      - name: selected Blaze CLI and generated fixture regressions
        run: uv run --frozen python -m unittest discover --start-directory .github/scripts --pattern 'test_blaze_cli.py'
      - name: native Bun preparation regressions
        run: python3 -I .github/scripts/test_bunprep.py
      - name: Blaze benchmark evidence and history regressions
        run: uv run --frozen --no-dev python -I -m unittest discover -s harness -p 'test_bench.py'
      - name: benchmark workflow caller regressions
        run: uv run --frozen --no-dev python -I .github/scripts/test_benchmark_ci.py
      - name: rival compiler selection and evidence regressions
        run: uv run --frozen python .github/scripts/test_rival.py
      - name: release speed evidence regressions
        run: python3 -I .github/scripts/test_promote_speed.py
      - name: release smoke provenance and compiler selection regressions
        run: python3 -I .github/scripts/test_promote_smoke.py
      - name: kernel process observation and loss controls
        run: uv run --frozen python -m unittest discover --start-directory harness/v2 --pattern 'test_exec_observer.py'
      - name: distributed objective adapter regressions
        run: uv run --frozen python harness/v2/test_distributed.py
      - name: bounded seed readiness and shutdown regressions
        run: python3 -I -B .github/scripts/test_seed_preflight.py
      - name: fork migration oracle and CI acceptance regressions
        run: |
          uv run --frozen python -m unittest discover --start-directory harness/forkfixes --pattern 'test_*.py'
          uv run --frozen python -m unittest discover --start-directory .github/scripts --pattern 'test_forkfixes_ci.py'
      # The list of tests that may fail holds together and is as its recorder writes it, and the
      # comparison and the recording do what they say on made-up results.
      - run: uv run --frozen python harness/failures.py selftest
      # A row or a test run counts only with proof that it ran (harness/v2/ran.py): each rule
      # beside the planted bug it refuses, and the count of checks the self-test expects of itself.
      - run: uv run --frozen python harness/v2/ran.py selftest
      # library/DIGEST is the digest of library/ as it is (a stale one stops every fresh home).
      - run: uv run --frozen python harness/library.py check '{}'
      # The agent rules: tools/agents/rules.ts type-checks, and AGENTS.md and the rules in .agents/skills/*/SKILL.md are what it generates.
      - run: bun install --frozen-lockfile --cwd site
      # Use the same bun runtime as the rule generator.
      - run: bun site/node_modules/.bin/tsc -p tools/agents
      - run: bun tools/agents/rules.ts --check
      # The repository's Rust scripts (scripts/, docs/v2/plan/design/scripts.md), built by the
      # release .github/blaze-version names, never by the blaze this tree builds: a tree whose
      # compiler does not build must still be checked (the stage-0 rule). From the Actions cache
      # when their inputs are unchanged (./.github/actions/script). No LLVM: the scripts link none.
      - id: bootstrap
        uses: ./.github/actions/script
        with:
          job: scripts
      # Independent checks still run after another check fails, once their tools exist.
      # Each failure keeps the job failed; a failed bootstrap or cancellation runs none.
      # Each doc says what it is, the current ones hold against the tree, and docs/README.md is
      # their index (scripts/src/bin/docs.rs). And no Python file is added: tools/python-allowed.txt
      # lists the ones left and only shrinks (docs/v2/plan/design/scripts.md).
      - name: documentation contracts and index
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          "$BLAZE_SCRIPTS/docs" selftest
          "$BLAZE_SCRIPTS/docs" check
      # No new place in blaze's code starts rustc, rustdoc or cargo (docs/no-rustc.md,
      # scripts/src/bin/rustcsites.rs).
      - name: compiler invocation sites
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: '"$BLAZE_SCRIPTS/rustcsites"'
      # The objectives ledger's rows are well formed and its table is current (scripts/src/bin/ledger.rs).
      - name: objective ledger controls and index
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          "$BLAZE_SCRIPTS/ledger" selftest
          "$BLAZE_SCRIPTS/ledger" '{"command": "check"}'
      # The budget harness's own parts hold: which rows an input selects, the daemon home's layout
      # against the daemon's rule, the smoke's edit on the fixture (harness/v2/budgets.py). Its
      # smoke, against the blaze a change builds, is blaze-platform.yaml's profile-gate job.
      - name: budget harness controls
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: uv run --frozen python harness/v2/budgets.py selftest
      # The smoke's guards (harness/v2/guards.py): each finding a bound is for, in miniature, is
      # refused by its bound and the fixed state passes; the known list reads; a result with a
      # guard missing is refused. And which packages a change touches (scripts/src/bin/changed.rs).
      - name: guard and changed-package controls
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          uv run --frozen python harness/v2/guards.py selftest
          "$BLAZE_SCRIPTS/changed" selftest
      # Every stated invariant has a control beside it, and docs/v2/plan/invariants.md lists them
      # (scripts/src/bin/invariants.rs).
      - name: invariant controls and index
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          "$BLAZE_SCRIPTS/invariants" selftest
          "$BLAZE_SCRIPTS/invariants" '{"command": "check"}'
      # The Lean proofs, as far as no Lean is needed (harness/v2/lean_gate.py): the list of
      # theorems (lean/theorems.json) names statements that are there, no source says `sorry`,
      # `native_decide`, `axiom` or `partial def`, lean/analysis's manifest is checked in at the
      # pinned Mathlib, and docs/v2/plan/proofs.md is current. The `lean` job builds them.
      - name: Lean source controls
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          uv run --frozen python harness/v2/lean_gate.py selftest
          uv run --frozen python harness/v2/lean_gate.py '{"command": "sources"}'
      # blaze's registry of rustc's lints (crates/blaze-lint-defs/src/rustc.rs) is the one written
      # from rustc's source at the commit library/UPSTREAM pins, unedited: a toolchain bump that
      # does not write it again fails here (scripts/src/bin/lint_table.rs).
      - name: rustc lint table
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          "$BLAZE_SCRIPTS/lint_table" selftest
          "$BLAZE_SCRIPTS/lint_table" '{"command": "check"}'
      # Each hash domain in crates/ is written once outside tests, and is under a cache of
      # docs/v2/plan/design/caches.md with the grain of its key; each hasher that is not BLAKE3
      # has its class there (scripts/src/bin/domains.rs).
      - name: hash domains
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          "$BLAZE_SCRIPTS/domains" '{"root": "."}'
      # What is left of the global heap only goes down (AGENTS.md bump-allocate): per crate,
      # outside tests, the `// alloc:` lines left to convert, the `expect`s of
      # `blaze::implicit_allocator`, the lines naming `Global` and the function signatures that
      # fix the caller's allocator (`blaze::unwritten_allocator`'s rule, read from the text) equal their crate's row of
      # tools/ratchets/alloc-sites.txt, a crate with no row is held to 0, and no
      # row is above the base's (`global` may rise while `// alloc:` lines are left); a crate
      # over its row has its new sites named from the base's diff (scripts/src/bin/allocs.rs). It needs no compiler, where the lints need a blaze that
      # checks the workspace. Against the base itself: the checkout is shallow.
      - name: global-heap allocations only go down
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          "$BLAZE_SCRIPTS/allocs" selftest
          if [ -n "$BASE" ]; then
            git fetch -q --depth=1 origin "$BASE"
            "$BLAZE_SCRIPTS/allocs" "{\"command\": \"check\", \"base\": \"$BASE\"}"
          else
            echo "no base to compare with (a run by hand): each crate is held to its row only"
            "$BLAZE_SCRIPTS/allocs" '{"command": "check"}'
          fi
      # Untyped errors only go down (AGENTS.md errors-name-the-thing): per crate, outside tests,
      # the function signatures whose error is a `String`, a `&str`, a `Box<dyn Error>` or
      # `anyhow`'s (`blaze::untyped_error`'s rule, read from the text), and the type aliases of
      # such a `Result`, equal their crate's row of tools/ratchets/untyped-errors.txt,
      # a crate with no row is held to 0, and no row is above the base's; a crate over its row
      # has its new sites named from the base's diff (scripts/src/bin/untyped.rs). It needs no
      # compiler, where the lint needs a blaze that checks the workspace. Against the base
      # itself: the checkout is shallow.
      - name: untyped errors only go down
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          "$BLAZE_SCRIPTS/untyped" selftest
          if [ -n "$BASE" ]; then
            git fetch -q --depth=1 origin "$BASE"
            "$BLAZE_SCRIPTS/untyped" "{\"command\": \"check\", \"base\": \"$BASE\"}"
          else
            echo "no base to compare with (a run by hand): each crate is held to its row only"
            "$BLAZE_SCRIPTS/untyped" '{"command": "check"}'
          fi
      # Every SCHEMA/LAYOUT/FORMAT/MAGIC/VERSION constant under crates/ has a row of
      # scripts/layouts.txt, and a persisted one whose value changed against the base names its
      # crate's test of the previous layout (rule persisted-state-round-trips;
      # scripts/src/bin/layouts.rs).
      - name: a changed persisted layout has a previous-layout test
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          "$BLAZE_SCRIPTS/layouts" selftest
          if [ -n "$BASE" ]; then
            git fetch -q --depth=1 origin "$BASE"
            "$BLAZE_SCRIPTS/layouts" "{\"command\": \"check\", \"base\": \"$BASE\"}"
          else
            echo "no base to compare with (a run by hand): the list is checked, no value is compared"
            "$BLAZE_SCRIPTS/layouts" '{"command": "check"}'
          fi
      # A change of blaze-profile's schema version lands only once ix.dev/explore reads it
      # (.github/scripts/explore_page.py; release.yaml checks every release too).
      - name: ix.dev/explore reads a new profile schema
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          git fetch -q --depth=1 origin main
          version() { grep -E '^pub const VERSION: u32' "$@"; }
          if [ "$(git show FETCH_HEAD:crates/blaze-profile/src/schema.rs | version)" != "$(version crates/blaze-profile/src/schema.rs)" ]; then
            uv run --frozen python .github/scripts/explore_page.py '{}'
          fi

  # The Lean proofs hold (rule verified-compiler; harness/v2/lean_gate.py, docs/v2/plan/proofs.md):
  # with the Lean lean/lean-toolchain pins, `lake build` of lean/ (core Lean: the semantics of
  # MIR, the proved passes, the models and their proofs) and of lean/analysis (the derivative
  # proofs, on Mathlib's prebuilt files from `lake exe cache get`: Mathlib is never compiled);
  # no declaration uses `sorry`; and each theorem of lean/theorems.json exists and rests on no
  # axiom but `propext`, `Classical.choice` and `Quot.sound` (`#print axioms`). On every change:
  # a proof is about the Rust beside it (the embedded bodies, the rule table), so no list of
  # paths says when it need not run. elan is the release binary, checked by its sha256; it and
  # Mathlib's files are cached by the toolchain and lean/analysis's pins, and lean/'s own build
  # by its sources. About 4 minutes from the caches and about 15 without (not yet measured).
  lean:
    name: lean proofs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            lean/analysis/.lake
          key: lean-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/analysis/lakefile.toml', 'lean/analysis/lake-manifest.json') }}
      - uses: actions/cache@v6
        with:
          path: lean/.lake
          key: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/**/*.lean', 'crates/*/lean/**/*.lean', 'lean/lakefile.toml') }}
          restore-keys: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-
      # The release binary of elan, checked by its sha256, then the toolchain lean/lean-toolchain
      # pins. The gate names that toolchain's `lake` by its path, never PATH.
      - name: elan 4.2.4 and the pinned Lean
        run: |
          pin=$(cat lean/lean-toolchain)
          lake="$HOME/.elan/toolchains/$(echo "$pin" | sed 's|/|--|g; s|:|---|g')/bin/lake"
          if [ ! -x "$lake" ]; then
            case "$RUNNER_ARCH" in
              ARM64) arch=aarch64 sum=05febd124d84ebf994b2e7479922a5650b1e950c17ae3bd1ddd776b65bb72bf9 ;;
              *) echo "::error::no pinned elan for $RUNNER_ARCH"; exit 1 ;;
            esac
            tgz="$RUNNER_TEMP/elan.tar.gz"
            curl -fsSL --retry 3 -o "$tgz" "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-$arch-unknown-linux-gnu.tar.gz"
            echo "$sum  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$RUNNER_TEMP" elan-init
            "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
            "$HOME/.elan/bin/elan" toolchain install "$pin"
          fi
          "$lake" --version
      - run: |
          uv run --frozen python harness/v2/lean_gate.py '{"command": "check"}'

  # Every workflow parses and holds together (actionlint): a workflow whose YAML does not parse
  # fails on push with no jobs and says so nowhere (release.yaml, promote.yaml and yank.yaml after
  # #1691, an unquoted `: ` in a `run:` line). The local actions (.github/actions/*/action.yml) are
  # parsed where a workflow uses them. actionlint's own checks only: its shellcheck and pyflakes
  # passes are off. What it is told to ignore is in .github/actionlint.yaml.
  workflows:
    name: actionlint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools/typed-input
            harness
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: GitHub-hosted runner policy
        env:
          PYTHONPATH: tools/typed-input/src
        run: |
          python3 .github/scripts/check_runner_labels.py '{}'
          python3 -m unittest discover --start-directory .github/scripts --pattern 'test_check_runner_labels.py'
      # The release binary, checked by its sha256 (rhysd/actionlint's checksums.txt).
      - name: actionlint 1.7.12
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            ARM64) arch=arm64 sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "::error::no pinned actionlint for $RUNNER_ARCH"; exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_$arch.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes='

  # Native Linux x86-64 coverage remains outstanding. This job cross-compiles on
  # hosted AArch64 with cross gcc/glibc and qemu-user for the target llvm-config;
  # the resulting binaries are checked as ELF and never run. It remains outside
  # ci's needs until a successful run establishes the cross path.
  # llvm-sys is built twice: for the target (hir-ty-codegen, through blaze-engine) and for the
  # host (a build-dependency of blaze-stencil's build script, which runs here). blaze gives each
  # run of its build script the LLVM llvm.json pins for that run's target (a pinned native input,
  # Cargo.toml's `[workspace.metadata.blaze.native.llvm]`, set over the shell's
  # LLVM_SYS_231_PREFIX), so the job fetches and names none. The C and C++ compilers are named
  # for the target only: cc-rs (and llvm-sys's libstdc++.a, which it asks cc-rs's compiler for)
  # takes CC_<target>/CXX_<target> before plain CC/CXX, so the host copy keeps the runner's own
  # gcc. A plain CXX here would give the host copy x86-64 libstdc++.a and objects.
  linux-x64-cross:
    name: linux x64 (cross-compiled, not run)
    needs: [changes, scripts, workflows]
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      # Keep the complete B0 bootstrap's reader wave below the previous swap-heavy run.
      BLAZE_CORES: "2"
      BLAZE_DAEMON_MEMORY_GB: "6"
      # Read by blaze's daemon when it starts (blaze-link's C driver, cc-rs in build scripts), so
      # set for the whole job. For the target alone: no plain CC or CXX (see above).
      CC_x86_64_unknown_linux_gnu: x86_64-linux-gnu-gcc
      CXX_x86_64_unknown_linux_gnu: x86_64-linux-gnu-g++
      # The x86-64 llvm-config's own libraries, for qemu-user.
      QEMU_LD_PREFIX: /usr/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: x86-64 cross gcc and glibc, qemu-user
        uses: ./.github/actions/apt
        with:
          packages: gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libc6-dev-amd64-cross qemu-user-static binfmt-support
      - name: qemu-user runs x86-64 programs
        run: |
          sudo systemctl restart systemd-binfmt || sudo update-binfmts --enable qemu-x86_64
          test -e /proc/sys/fs/binfmt_misc/qemu-x86_64 || { echo "::error::binfmt_misc has no qemu-x86_64 entry: the x86-64 llvm-config cannot run"; exit 1; }
      - id: blaze
        uses: ./.github/actions/blaze
        with:
          job: cross-x86_64
          reflink: "true"
      - run: blaze build --release --locked -p blaze-engine --target x86_64-unknown-linux-gnu --target-dir "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
        # Retain the query-key panic's stack from this build; harnesses keep their usual
        # RUST_BACKTRACE=0 output contract.
        env:
          RUST_BACKTRACE: '1'
      - name: an x86-64 ELF, not run
        run: |
          for bin in blaze-engine blaze; do
            f="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}/x86_64-unknown-linux-gnu/release/$bin"
            [ -x "$f" ] || { echo "::error::the cross build made no executable $f"; exit 1; }
            file "$f" | tee /dev/stderr | grep -q 'ELF 64-bit LSB .*x86-64' || { echo "::error::$f is not an x86-64 ELF"; exit 1; }
          done
      # Why the daemon ended, when it did (the client does not say).
      - if: failure() || cancelled()
        uses: ./.github/actions/daemon-log

  # Partial library feedback on the pinned Rust toolchain. Upstream parks blaze-global
  # and removes the old memory-admission API; full compiler acceptance remains in Stage 1.
  # Run after workflow validation on every trigger, even if changes or scripts cannot bootstrap.
  distributed-core:
    name: distributed library controls with pinned Cargo (partial)
    needs: [workflows]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      BLAZE_TESTS: verify
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: distributed library models and planted controls with pinned Cargo
        shell: bash
        timeout-minutes: 75
        run: |
          mkdir -p "$RUNNER_TEMP/core-evidence"
          toolchain="$(cat "$GITHUB_WORKSPACE/harness/toolchain")"
          cp "$GITHUB_WORKSPACE/harness/toolchain" "$RUNNER_TEMP/core-evidence/toolchain-pin.txt"
          cargo "+$toolchain" --version --verbose > "$RUNNER_TEMP/core-evidence/cargo-version.txt"
          rustc "+$toolchain" --version --verbose > "$RUNNER_TEMP/core-evidence/rustc-version.txt"
          cargo "+$toolchain" test --release --locked --lib -p blaze-dist -p blaze-dist-local -p blaze-wire -p blaze-serve --no-fail-fast \
            2>&1 | tee "$RUNNER_TEMP/core-evidence/tests.log"
          cases=(
            retirement_preserves_survivors_and_exact_assignment_ownership
            cancellation_cleans_a_promotion_the_worker_has_not_observed
            stale_claimed_helpers_do_not_block_available_replacements
            execution_bindings_retain_cleanup_without_sliding_replay_or_expiry
            every_success_has_one_immutable_full_manifest
            an_accepted_refusal_cannot_publish_success_after_reassignment
            a_late_worker_verdict_cannot_rewrite_an_accepted_manifest
            a_failed_heartbeat_cannot_publish_a_successful_tail
            virtual_clock_and_actor_order_preserve_the_captured_results_authority
            first_publication_cannot_name_missing_or_corrupt_packs
            first_writer_requires_equal_values_for_keys_mirrored_across_packs
            native_partitions_preserve_values_through_publication_faults_and_reopen
            conditional_publication_preserves_comparison_and_whole_file_integrity
            failed_syncs_rename_and_every_crash_boundary_reopen_authorized_whole_lists
            the_oracle_catches_leaving_without_retirement
            the_oracle_catches_release_without_a_pending_stop
            the_oracle_catches_a_stale_retirement_of_the_replacement_lead
            the_oracle_catches_a_stale_acknowledgment_of_a_reused_slot
            the_oracle_catches_an_unowned_retirement
            the_oracle_catches_retired_work_kept_under_its_old_lease
            the_oracle_catches_promotion_erasing_the_continuing_owner
            the_oracle_catches_cleanup_using_only_the_last_observed_attempt
            the_oracle_catches_a_stale_claimed_helper_misclassified_as_unclaimed
            the_oracle_catches_a_missing_verified_execution_binding
            the_oracle_catches_a_sliding_session_ceiling
            the_oracle_catches_a_lost_reply_with_changed_replay_identity
            the_oracle_catches_different_bytes_reusing_a_replay_identity
            the_oracle_catches_an_early_done_plant
            the_oracle_catches_a_late_worker_verdict_plant
            the_oracle_catches_a_dropped_heartbeat_failure
            the_oracle_catches_a_compiler_refusal_reclassified_as_transport_loss
            the_identity_oracle_catches_reissuing_the_captured_result_under_a_new_lease
            the_oracle_catches_removing_cross_pack_comparison
            the_oracle_catches_the_comparison_bypass_plant
            the_oracle_catches_missing_file_sync_with_torn_appends
            the_oracle_catches_acknowledgement_before_directory_sync
            fragmented_replies_preserve_body_boundaries_and_committed_refusals
            committed_reply_bounds_follow_the_native_wire_contract
            an_http_reply_must_end_at_its_declared_body_boundary
            an_interrupted_committed_get_cannot_authorize_local_recompilation
            a_lost_publication_reply_cannot_authorize_local_recompilation
            a_first_writer_conflict_must_compare_the_immutable_manifest
            bounded_packs_keep_every_key_and_refuse_conflicts_across_boundaries
            errors_after_publication_cannot_rebuild_an_immutable_unit
          )
          for case_name in "${cases[@]}"; do
            grep -Eq "^test .*::$case_name \\.\\.\\. ok[[:space:]]*$" "$RUNNER_TEMP/core-evidence/tests.log" \
              || { echo "::error::missing executed library control: $case_name"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distributed-core-cargo-partial
          path: ${{ runner.temp }}/core-evidence/
          if-no-files-found: warn

  # The gate's build and unit tests on hosted AArch64 (blaze-platform.yaml).
  # What blaze cross-builds is run (ledger row X1, docs/v2/plan/design/toolchain-c.md "Cross
  # compilation"): the probe (harness/v2/cross/probe: hello, threads, a file, TCP loopback, a
  # panic with a backtrace) is built for each Linux glibc triple with nothing of the machine (no
  # cross gcc, no CC_*: `scripts --bin cross` builds under `env -i` with an empty PATH), the
  # AArch64 one is run here and the x86-64 one under qemu-user with Debian's x86-64 glibc to load
  # (libc6-amd64-cross and libgcc-s1-amd64-cross are what it runs against, not what it is built
  # with). Not part of `ci` until it has been green on main: it needs no secret, and its runner
  # label is a new one of the same pool as the job above.
  cross-probe:
    name: cross-built, run (linux x64 under qemu-user, linux arm64)
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: qemu-user and an x86-64 glibc to run against
        uses: ./.github/actions/apt
        with:
          packages: qemu-user-static libc6-amd64-cross libgcc-s1-amd64-cross
      - id: blaze
        uses: ./.github/actions/blaze
        with:
          job: cross-probe
      - run: blaze build --release --locked -p blaze-engine -p blaze-thin
      - name: build the probe for each triple with nothing of the machine, and run it
        run: |
          mkdir -p "$RUNNER_TEMP/cross-bin"
          cp target/release/blaze-thin "$RUNNER_TEMP/cross-bin/blaze"
          cp target/release/blaze-engine "$RUNNER_TEMP/cross-bin/blaze-engine"
          blaze run -q -p scripts --bin cross -- "$(cat <<JSON
          {"command": "check",
           "engine": {"kind": "v2", "blaze": "$RUNNER_TEMP/cross-bin/blaze"},
           "out": "$RUNNER_TEMP/cross.json",
           "triples": ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"],
           "run": {"aarch64-unknown-linux-gnu": [],
                   "x86_64-unknown-linux-gnu": ["qemu-x86_64-static", "-L", "/usr/x86_64-linux-gnu"]}}
          JSON
          )"
      - if: failure()
        uses: ./.github/actions/daemon-log

  # The gate builds and tests on hosted AArch64 (blaze-platform.yaml).
  linux-arm64:
    name: linux arm64
    needs: [changes, scripts, workflows]
    if: needs.changes.outputs.tier != 'none'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: linux-arm64
      os: ubuntu-24.04-arm
      tier: ${{ needs.changes.outputs.tier }}
      smoke: true
      microbench: true

  # The daemon this change builds starts on Linux 6.8: GitHub's hosted ubuntu-22.04 runners
  # boot Ubuntu's linux-azure 6.8 (6.8.0-1070-azure in November 2026), the release's Linux
  # builds run there. linux-azure 6.8.0-1063 and later invert
  # io_uring's check of a provided buffer ring's reserved words (blaze-core's
  # `ReservedCheck`), which stopped every daemon start of v0.20261105.3's release. The
  # binary is the linux-arm64 build's, linked against Ubuntu 24.04's glibc,
  # so it runs in an ubuntu:24.04 container, which shares the host's kernel; Docker's default
  # seccomp profile refuses io_uring, so the container's is off.
  linux-6-8:
    name: daemon starts on Linux 6.8 (hosted ubuntu-22.04-arm)
    needs: [changes, linux-arm64]
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    container:
      image: ubuntu:24.04
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    env:
      # As in `docker run`: the runner's /github/home belongs to its own user.
      HOME: /root
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blaze-linux-arm64
      - name: blaze serve listens, blaze status sees it, blaze stop ends it
        run: |
          tar -xf blaze.tar && uname -r
          ./blaze serve > serve.log 2>&1 & serve=$!
          for _ in $(seq 120); do
            ./blaze status | grep -qvx "no daemon is running" && break
            kill -0 "$serve" 2>/dev/null || { cat serve.log; echo "::error::blaze serve ended before it listened on Linux $(uname -r)"; exit 1; }
            sleep 0.5
          done
          ./blaze status | grep -qvx "no daemon is running" || { cat serve.log; echo "::error::blaze serve did not listen within 60 s on Linux $(uname -r)"; exit 1; }
          ./blaze stop && wait "$serve"

  macos:
    name: macos arm64
    needs: [changes, scripts, workflows]
    if: needs.changes.outputs.tier == 'warm'
    uses: ./.github/workflows/blaze-platform.yaml
    # For main's push of blaze's store (the cache-writer environment's secrets).
    secrets: inherit
    with:
      platform: macos-arm64
      os: macos-latest
      tier: warm

  # The released blaze checks the workspace on hosted AArch64. A macOS workspace
  # check remains outstanding; macos above runs builds and tests only on main.
  workspace-check:
    name: blaze check --workspace, linux arm64
    needs: [changes, scripts, workflows]
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      BLAZE_CORES: "2"
      BLAZE_DAEMON_MEMORY_GB: "6"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/blaze
        with:
          job: check
          llvm: true
          reflink: "true"
      - uses: ./.github/actions/script
        with:
          job: check
      # The fast tier: the packages the change touches and those that depend on them, each
      # after what it needs (scripts/src/bin/changed.rs), checked before the workspace, so a change's
      # first compile error comes in minutes and names the earliest cause. What it checks the
      # workspace check below finds checked. Against the base itself: the checkout is shallow.
      - name: blaze check of the packages this change touches
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git fetch -q --depth=1 origin "$BASE"; then
            echo "no base to compare with: the workspace check below is the check"; exit 0
          fi
          args=$("$BLAZE_SCRIPTS/changed" "{\"base\": \"$BASE\", \"direct\": true, \"print\": \"args\"}")
          if [ -z "$args" ] || [ "$args" = --workspace ]; then
            echo "nothing narrower than the workspace to check first: ${args:-no package changed}"; exit 0
          fi
          echo "blaze check $args --lib --tests"
          # TODO(stage 0 with --deny): add `--deny blaze::todo` once .github/blaze-version's release takes it.
          # shellcheck disable=SC2086
          blaze check $args --lib --tests --message-format short --target-dir "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
      - run: blaze check --workspace --message-format short --target-dir "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
      # Every target, the test targets among them: a test that no longer type-checks against
      # the code it tests fails here, in every crate, where the unit tests job compiles the test
      # targets of harness/unittests.py's CRATES alone (2026-11-09: blaze-cas's place_race.rs and
      # hir-ty-mir's tests/consteval/comptime.rs did not compile on main). A step of its own,
      # after the libraries', so the log says which of the two failed; what the first checked
      # is not checked again.
      # TODO(stage 0 with --deny): add `--deny blaze::todo` once .github/blaze-version's release takes it.
      - name: blaze check --workspace --all-targets (the test targets compile)
        run: blaze check --workspace --all-targets --message-format short --target-dir "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
      # astlog's rules (tools/astlog/rules) over the crates and tools, each file on its own: a
      # finding of an error rule fails the job (tools/astlog/README.md#rules-in-blaze).
      - run: blaze build -p astlog --target-dir "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
      - run: |
          astlog="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}/debug/astlog"
          [ -x "$astlog" ] || { echo "::error::the build made no executable $astlog"; exit 1; }
          jq -n --arg astlog "$astlog" \
            '{astlog: $astlog, rules: "tools/astlog/rules", paths: ["crates", "tools"], exclude: ["crates/harness"]}' \
            > "$RUNNER_TEMP/astlog.json"
          PYTHONPATH=tools/typed-input/src python3 tools/astlog/scan.py "$RUNNER_TEMP/astlog.json"
      # A timed-out check is cancelled, so failure() alone loses its daemon evidence.
      - if: failure() || cancelled()
        uses: ./.github/actions/daemon-log

  ci:
    name: ci
    needs: [changes, scripts, workflows, lean, distributed-core, linux-6-8, linux-arm64, macos, workspace-check]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: every required check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' > /dev/null \
            || { echo "::error::a required check failed or was cancelled"; exit 1; }
          # Every applicable job must succeed; skipped code-tier checks and absent receipts
          # cannot stand for runtime acceptance. Mac runs only on warm/main.
          echo "$NEEDS" | jq -e '
            .changes.result == "success" and
            .scripts.result == "success" and
            .workflows.result == "success" and
            .lean.result == "success" and
            (.changes.outputs.tier == "none" or
              ((.changes.outputs.tier == "gate" or .changes.outputs.tier == "warm") and
               .["linux-arm64"].result == "success" and
               .["distributed-core"].result == "success" and
               .["linux-6-8"].result == "success" and
               .["workspace-check"].result == "success" and
               (.changes.outputs.tier != "warm" or .macos.result == "success") and
               .["linux-arm64"].outputs.protocol_tests == "true" and
               .["linux-arm64"].outputs.distributed_acceptance == "true" and
               .["linux-arm64"].outputs.forkfixes_acceptance == "true"))
          ' > /dev/null || { echo "::error::required checks or protocol, distributed, or fork migration acceptance are incomplete"; exit 1; }
      # The budget smoke's guards ran and held (harness/v2/guards.py, `held`): a tier that builds
      # blaze has the smoke's result, with an outcome that passed for every bound of every step
      # of both fixtures and for the sandbox's probe. A job that was skipped passes the step
      # above; a smoke that did not run, or dropped a guard, fails this one. A gate run that
      # did not run the smoke is red (docs/harness.md, "The smoke's guards").
      - if: needs.changes.outputs.tier != 'none'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.tier != 'none'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu (ix runners are arm64)
          enable-cache: false
      - if: needs.changes.outputs.tier != 'none'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: budgets-smoke-linux-arm64
          path: ${{ runner.temp }}/budgets-smoke
      - name: the budget smoke's guards ran and held
        if: needs.changes.outputs.tier != 'none'
        run: |
          uv run --frozen --no-dev python harness/v2/guards.py "{\"command\": \"held\", \"result\": \"$RUNNER_TEMP/budgets-smoke/budgets-smoke.json\"}"
