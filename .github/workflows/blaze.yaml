name: PR 81 export revision fencing controls
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact export revision fencing candidate
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  revision-fencing:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Run the coordinator and exporter scope tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/revision-target
          CARGO_BUILD_JOBS: '2'
        run: |
          out="$RUNNER_TEMP/revision-evidence"
          mkdir -p "$out"
          timeout 15 git rev-parse HEAD 'HEAD^{tree}' | tee "$out/source.txt"
          tc=$(timeout 10 cat pins/toolchain)
          status=0
          timeout -k 20 900 cargo +"$tc" test --locked -p blaze-dist -p blaze-dist-local --lib \
            2>&1 | tee "$out/libraries.log" || status=$?
          if [ "$status" != 0 ]; then
            exit "$status"
          fi
          timeout 10 grep -F 'a_late_old_unit_cannot_supersede_a_new_revision_after_an_inter_unit_gap ... ok' "$out/libraries.log"
          timeout 10 grep -F 'a_pull_request_export_reuses_the_first_deadline_in_its_epoch ... ok' "$out/libraries.log"
          timeout 10 grep -F 'a_superseded_request_cannot_fall_back_to_local_compilation ... ok' "$out/libraries.log"
          timeout -k 20 650 cargo +"$tc" check --locked -p blaze-cli \
            2>&1 | tee "$out/cli-check.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-revision-fencing-evidence
          path: ${{ runner.temp }}/revision-evidence
