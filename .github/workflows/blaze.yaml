name: PR 81 cut the canonical source shelf
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact compiler commit
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  shelf:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/script
        with:
          job: source-compiler
      - name: Cut and verify the canonical shelf
        run: |
          evidence="$RUNNER_TEMP/canonical-shelf"
          mkdir -p "$evidence"
          timeout 10 git rev-parse HEAD HEAD^{tree} > "$evidence/source.txt"
          timeout -k 20 600 cargo +"$(cat pins/toolchain)" fetch --locked --quiet
          shopt -s nullglob
          registries=("${CARGO_HOME:-$HOME/.cargo}"/registry/cache/index.crates.io-*)
          test "${#registries[@]}" -eq 1
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg reg "${registries[0]}" --arg shelf "$RUNNER_TEMP/shelf" '{tree:".",targets:["aarch64-apple-darwin","aarch64-unknown-linux-gnu"],registry:$reg,shelf:$shelf,write_pin:true,check:false,macro_side:true}')
          timeout -k 20 600 "$BLAZE_SCRIPTS/toolchain_cut" "$input" | tee "$evidence/cut.log"
          verify=$(timeout 10 jq -c '.write_pin=false | .check=true' <<< "$input")
          timeout -k 20 600 "$BLAZE_SCRIPTS/toolchain_cut" "$verify" | tee "$evidence/verify.log"
          timeout 10 cp crates/blaze-toolchain/PINNED "$evidence/PINNED"
          timeout 10 git diff --exit-code -- . ':!crates/blaze-toolchain/PINNED'
          timeout 10 cat "$evidence/PINNED"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canonical-shelf-pin
          path: ${{ runner.temp }}/canonical-shelf
