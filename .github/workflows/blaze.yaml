name: PR 81 cdylib cache replay diagnosis
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 174a4f6174dc2f78f25d679fd85ce62d9793aeb9
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: source-compiler
      - uses: ./.github/actions/toolchain-shelf
      - name: Build the exact release CLI and launcher
        run: |
          evidence="$RUNNER_TEMP/cdylib-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 30 2500 cargo +"$(cat pins/toolchain)" build --release --locked --bins -p blaze-cli -p blaze-launcher \
            2>&1 | tee "$evidence/build.log"
          sha256sum "$CARGO_TARGET_DIR"/release/{blaze,blaze-launcher,blaze-fact-shim} > "$evidence/binaries.txt"
      - name: Verify output and replay through the real loader
        run: |
          scratch="$RUNNER_TEMP/blaze-fs/cdylib-forkfixes"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg blaze "$CARGO_TARGET_DIR/release/blaze" --arg scratch "$scratch" --arg source "$GITHUB_WORKSPACE" \
            --arg modules "$BLAZE_SCRIPTS/proc_macro_modules" \
            '{blaze:$blaze,scratch:$scratch,source:$source,module_builder:$modules,only:["cdylib-allocates"],timeout:300,workers:1}')
          timeout -k 20 800 python3 harness/forkfixes.py "$input" 2>&1 | tee "$RUNNER_TEMP/cdylib-evidence/forkfixes.log"
      - name: Preserve source, binary and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cdylib-evidence
          path: |
            ${{ runner.temp }}/cdylib-evidence
            ${{ runner.temp }}/toolchain-cut
            ${{ runner.temp }}/blaze-fs/cdylib-forkfixes/*.json
            ${{ runner.temp }}/blaze-fs/cdylib-forkfixes/evidence
          if-no-files-found: warn
