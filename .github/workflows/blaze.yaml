name: PR 81 pinned LLVM unwind object probe
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: verify source and install the pinned LLVM prefix
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-evidence"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/llvm-evidence/source.txt"
          prefix="$RUNNER_TEMP/pinned-llvm"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg prefix "$prefix" '{command:"fetch",target:"aarch64-unknown-linux-gnu",dir:$prefix}')
          timeout -k 10 900 python3 .github/scripts/llvm.py "$input"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: emit optimized invoke object files for both ARM64 formats
        run: |
          log="$RUNNER_TEMP/llvm-evidence/unwind.txt"
          timeout -k 30 1800 cargo +"$(cat pins/toolchain)" test --locked -p blaze-emit --features llvm --lib llvm_invoke_object_unwind_probe -- --ignored --nocapture 2>&1 | tee "$log"
          grep -Fq 'llvm::emit_tests::llvm_invoke_object_unwind_probe ... ok' "$log"
          for kind in catch cleanup terminate; do
            for format in elf macho; do
              grep -Fq "BLAZE_LLVM_UNWIND_OBJECT $kind-$format " "$log"
            done
          done
      - name: keep the exact source and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pinned-llvm-unwind-evidence
          path: ${{ runner.temp }}/llvm-evidence
          if-no-files-found: error
