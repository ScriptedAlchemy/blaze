name: PR 81 standalone bstd acceptance
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact bstd candidate
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
jobs:
  bstd:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - if: runner.os == 'macOS'
        run: |
          test "$(uname -s -m)" = "Darwin arm64"
          export HOMEBREW_NO_AUTO_UPDATE=1
          python3 -c 'import subprocess; subprocess.run(["brew", "install", "coreutils"], check=True, timeout=360)'
          coreutils=$(python3 -c 'import subprocess; print(subprocess.check_output(["brew", "--prefix", "coreutils"], text=True, timeout=15).strip())')
          echo "$coreutils/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/toolchain
      - name: Run the complete standalone bstd suite
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/bstd-target
        run: |
          timeout 15 git rev-parse HEAD 'HEAD^{tree}'
          tc=$(timeout 10 cat pins/toolchain)
          timeout -k 15 1200 cargo +"$tc" test --locked -p blaze-std --lib 2>&1 | tee "$RUNNER_TEMP/bstd-tests.log"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bstd-${{ matrix.runner }}
          path: ${{ runner.temp }}/bstd-tests.log
