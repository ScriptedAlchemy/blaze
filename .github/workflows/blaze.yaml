# Source CI on GitHub-hosted ARM64. The source CLI and retained distributed protocol
# have separate required receipts; a native library pass grants neither receipt.
name: blaze
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # A pull request's newer push cancels its run before. Main runs one push at a time: a push
  # while one runs waits, and a newer push replaces the one waiting, never the one running, so
  # each run ends and covers every merge up to its commit. A group of its own per push stacked
  # up a full three-platform run per merge (17 at once on 2026-10-28, each waiting on macOS
  # runners) and none of them got runners in time. A merge-queue entry or a run by hand is
  # still a group of its own. A push groups by its ref: a push to a lane branch shares no group
  # with main (2026-11-05: lane-branch pushes sat in `blaze-main` and kept replacing main's
  # waiting run, so no main run finished all day).
  group: blaze-${{ github.event_name == 'push' && github.ref || format('{0}-{1}', github.event_name, github.event_name == 'pull_request' && github.ref || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all
  CARGO_BUILD_JOBS: "2"

jobs:
  # Which tier runs: `gate` for a pull request and the merge queue, `warm` for a push to main
  # (or by hand), or `none` for a change that touches no file the tier reads (the pull
  # request's files, the merge queue entry's or the push's against the commit before it;
  # scripts/src/bin/gate_changes.rs). Anything that cannot be told counts as code.
  changes:
    name: changes
    runs-on: ubuntu-24.04-arm
    # Full-source cache hits reuse the pinned-Cargo scripts. A miss builds that exact closure.
    timeout-minutes: 30
    outputs:
      tier: ${{ steps.files.outputs.tier }}
    steps:
      # The cache key proves the entire local source closure; sparse checkouts are refused.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/script
        with:
          job: changes
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'warm' || 'gate' }}
          # Empty on a run by hand, which then counts as code.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          "$BLAZE_SCRIPTS/gate_changes" \
            "{\"tier\": \"$TIER\", \"repository\": \"$GITHUB_REPOSITORY\", \"base\": \"$BASE\", \"head\": \"$HEAD\"}"

  scripts:
    name: harness imports, rustc sites
    runs-on: ubuntu-24.04-arm
    # The required script checks include cache, lifecycle, source-identity and oracle controls.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      # The repository's Python workspace (pyproject.toml, uv.lock): its scripts lint and type-check.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu
          enable-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: ./.github/actions/apt
        with:
          packages: strace
      # Cargo with pins/toolchain builds the canonical scripts independently of Blaze.
      - uses: ./.github/actions/script
        with:
          job: scripts
      # The gate: every row of tools/gate.txt, the one list `just lint` runs too, through the one
      # runner (scripts/src/bin/gate.rs), which first checks that this job runs no check beside it
      # (each step but this one is a `uses:` or a row of its CI_ONLY_STEPS). The Python and bun
      # checks, the docs, the ledger and the ratchets are its rows, each with its timeout; a ratchet
      # row is held to the base's rows too. Against the base itself: the checkout is shallow.
      - name: the gate (tools/gate.txt, as `just lint`)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch -q --depth=1 origin "$BASE"
            "$BLAZE_SCRIPTS/gate" "{\"command\": \"run\", \"scripts\": \"$BLAZE_SCRIPTS\", \"base\": \"$BASE\"}"
          else
            echo "no base to compare with (a run by hand): each crate is held to its row only"
            "$BLAZE_SCRIPTS/gate" "{\"command\": \"run\", \"scripts\": \"$BLAZE_SCRIPTS\"}"
          fi
      # A change of blaze-profile's schema version lands only once ix.dev/explore reads it
      # (.github/scripts/explore_page.py).
      - name: ix.dev/explore reads a new profile schema
        run: |
          git fetch -q --depth=1 origin main
          version() { grep -E '^pub const VERSION: u32' "$@"; }
          if [ "$(git show FETCH_HEAD:crates/blaze-profile/src/schema.rs | version)" != "$(version crates/blaze-profile/src/schema.rs)" ]; then
            uv run --frozen python .github/scripts/explore_page.py '{}'
          fi

      - name: export canonical gate inventories for review
        if: always() && env.BLAZE_SCRIPTS != ''
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gate-inventory"
          mkdir -p "$out/before" "$out/generated"
          files=(docs/README.md docs/v2/plan/invariants.md docs/v2/plan/objectives.json docs/v2/plan/objectives.md tools/python-allowed.txt tools/ratchets/alloc-sites.txt tools/ratchets/untyped-errors.txt)
          git rev-parse HEAD HEAD^{tree} > "$out/source.txt"
          git status --porcelain --untracked-files=all > "$out/status.txt"
          git diff HEAD --binary > "$out/source.patch"
          for file in "${files[@]}"; do cp --parents --preserve=mode,timestamps "$file" "$out/before/"; done
          restore() {
            for file in "${files[@]}"; do cp --preserve=mode,timestamps "$out/before/$file" "$file"; done
          }
          trap restore EXIT
          failed=0
          timeout -k 10 120 "$BLAZE_SCRIPTS/invariants" '{"command":"claims"}' > "$out/claims.json" 2> "$out/claims.stderr" || failed=1
          timeout -k 10 120 "$BLAZE_SCRIPTS/allocs" '{"command":"findings"}' > "$out/alloc-findings.json" 2> "$out/alloc-findings.stderr" || failed=1
          timeout -k 10 120 "$BLAZE_SCRIPTS/untyped" '{"command":"findings"}' > "$out/untyped-findings.json" 2> "$out/untyped-findings.stderr" || failed=1
          timeout -k 10 120 "$BLAZE_SCRIPTS/docs" write > "$out/docs.log" 2>&1 || failed=1
          timeout -k 10 120 "$BLAZE_SCRIPTS/invariants" '{"command":"write"}' > "$out/invariants.log" 2>&1 || failed=1
          timeout -k 10 120 "$BLAZE_SCRIPTS/ledger" '{"command":"write"}' > "$out/ledger.log" 2>&1 || failed=1
          timeout -k 10 120 "$BLAZE_SCRIPTS/allocs" '{"command":"write"}' > "$out/alloc-counts.log" 2>&1 || failed=1
          timeout -k 10 120 "$BLAZE_SCRIPTS/untyped" '{"command":"write"}' > "$out/untyped-counts.log" 2>&1 || failed=1
          for file in "${files[@]}"; do cp --parents "$file" "$out/generated/"; done
          git diff HEAD --binary > "$out/generated.patch"
          restore
          trap - EXIT
          for file in "${files[@]}"; do cmp "$out/before/$file" "$file"; done
          if [ "$failed" != 0 ]; then
            echo '::error::one or more canonical diagnostic generators failed; original required checks and source are unchanged; inspect gate-inventory logs'
            exit 1
          fi
      - name: keep canonical gate inventories
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-inventory
          path: ${{ runner.temp }}/gate-inventory
          if-no-files-found: warn

  # The Lean proofs hold (rule verified-compiler; harness/v2/lean_gate.py, docs/v2/plan/proofs.md):
  # with the Lean lean/lean-toolchain pins, `lake build` of lean/ (core Lean: the semantics of
  # MIR, the proved passes, the models and their proofs) and of lean/analysis (the derivative
  # proofs, on Mathlib's prebuilt files from `lake exe cache get`: Mathlib is never compiled);
  # no declaration uses `sorry`; and each theorem of lean/theorems.json exists and rests on no
  # axiom but `propext`, `Classical.choice` and `Quot.sound` (`#print axioms`). On every change:
  # a proof is about the Rust beside it (the embedded bodies, the rule table), so no list of
  # paths says when it need not run. elan is the release binary, checked by its sha256; it and
  # Mathlib's files are cached by the toolchain and lean/analysis's pins, and lean/'s own build
  # by its sources. About 4 minutes from the caches and about 15 without (not yet measured).
  lean:
    name: lean proofs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403 # uv-aarch64-unknown-linux-gnu
          enable-cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            lean/analysis/.lake
          key: lean-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/analysis/lakefile.toml', 'lean/analysis/lake-manifest.json') }}
      - uses: actions/cache@v6
        with:
          path: lean/.lake
          key: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/**/*.lean', 'crates/*/lean/**/*.lean', 'lean/lakefile.toml') }}
          restore-keys: lean-core-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-
      # The release binary of elan, checked by its sha256, then the toolchain lean/lean-toolchain
      # pins. The gate names that toolchain's `lake` by its path, never PATH.
      - name: elan 4.2.4 and the pinned Lean
        run: |
          pin=$(cat lean/lean-toolchain)
          lake="$HOME/.elan/toolchains/$(echo "$pin" | sed 's|/|--|g; s|:|---|g')/bin/lake"
          if [ ! -x "$lake" ]; then
            case "$RUNNER_ARCH" in
              ARM64) arch=aarch64 sum=05febd124d84ebf994b2e7479922a5650b1e950c17ae3bd1ddd776b65bb72bf9 ;;
              *) echo "::error::no pinned elan for $RUNNER_ARCH"; exit 1 ;;
            esac
            tgz="$RUNNER_TEMP/elan.tar.gz"
            curl -fsSL --retry 3 -o "$tgz" "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-$arch-unknown-linux-gnu.tar.gz"
            echo "$sum  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$RUNNER_TEMP" elan-init
            "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
            "$HOME/.elan/bin/elan" toolchain install "$pin"
          fi
          "$lake" --version
      - run: |
          uv run --frozen python harness/v2/lean_gate.py '{"command": "check"}'

  # Every workflow parses and holds together (actionlint): a workflow whose YAML does not parse
  # fails on push with no jobs and says so nowhere (three release workflows after #1691, an
  # unquoted `: ` in a `run:` line). The local actions (.github/actions/*/action.yml) are
  # parsed where a workflow uses them. actionlint's own checks only: its shellcheck and pyflakes
  # passes are off. What it is told to ignore is in .github/actionlint.yaml.
  workflows:
    name: actionlint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            tools/typed-input
      # The release binary, checked by its sha256 (rhysd/actionlint's checksums.txt).
      - name: actionlint 1.7.12
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            ARM64) arch=arm64 sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "::error::no pinned actionlint for $RUNNER_ARCH"; exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_$arch.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes='
      - name: GitHub-hosted runner policy
        env:
          PYTHONPATH: tools/typed-input/src
        run: |
          timeout 60 python3 .github/scripts/check_runner_labels.py '{}'
          timeout 60 python3 -m unittest discover -s .github/scripts -p test_check_runner_labels.py


  # The buildable workspace (every crate but those parked, docs/v2/plan/parked.md, and
  # blaze-std, its own world) type-checks with its test targets, and its unit tests pass, with
  # cargo and the pinned nightly (pins/toolchain): cargo builds blaze in the dev loop until
  # blaze builds blaze again (AGENTS.md rule blaze-builds-blaze). No LLVM: no buildable crate
  # links it. Each hosted job starts from its checked-out source and the pinned toolchain.
  cargo:
    name: cargo check and test, linux arm64
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      # llvm-tools and the two other targets for blaze-sys's imports step below: core and
      # compiler_builtins come precompiled with each target, so nothing builds a standard library.
      - uses: ./.github/actions/toolchain
        with:
          components: llvm-tools
          targets: x86_64-unknown-linux-gnu aarch64-apple-darwin
      - name: short same-filesystem home for all workspace tests
        run: |
          mkdir "$RUNNER_TEMP/blaze-fs/workspace-home"
          test_home=$(mktemp -d /tmp/bc.XXXXXX)
          timeout 10 sudo mount --bind "$RUNNER_TEMP/blaze-fs/workspace-home" "$test_home"
          # ci_test puts TMPDIR beneath HOME so its source shelf hardlinks stay on one device.
          # Retained native durability tests require the same verified reflink filesystem.
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "HOME=$test_home" >> "$GITHUB_ENV"
      - uses: ./.github/actions/script
        with:
          job: cargo
      - uses: ./.github/actions/toolchain-shelf
        id: shelf
      # Keep the canonical shelf's profile unchanged. The later workspace test build retains
      # every executable before running any: CI does not need their debug metadata, while
      # optimization, debug assertions and the complete target set stay as declared.
      - name: workspace test builds without debug metadata
        if: ${{ !cancelled() && env.BLAZE_SCRIPTS != '' }}
        run: |
          printf 'CARGO_PROFILE_DEV_DEBUG=0\nCARGO_PROFILE_TEST_DEBUG=0\n' >> "$GITHUB_ENV"
          evidence="$RUNNER_TEMP/workspace-storage-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          git status --short >> "$evidence/source.txt"
          git diff HEAD --binary > "$evidence/source.patch"
      - name: storage before workspace compiler tests
        if: ${{ !cancelled() && env.BLAZE_SCRIPTS != '' }}
        run: |
          input=$(timeout 10 jq -cn \
            --arg volume "$RUNNER_TEMP/blaze-fs" --arg target "$CARGO_TARGET_DIR" \
            --arg home "$HOME" --arg cargo_home "${CARGO_HOME:-$HOME/.cargo}" \
            --arg output "$RUNNER_TEMP/workspace-storage-evidence" \
            '{volume:$volume,target:$target,home:$home,cargo_home:$cargo_home,output:$output,phase:"before-tests"}')
          timeout -k 10 90 "$BLAZE_SCRIPTS/ci_storage" "$input"
      # Exercise the actual native-image loader before the full workspace's test-binary
      # build. Constructors, TLS and refusal cleanup need execution receipts, not only an
      # all-target type check. The full workspace checks below remain required.
      - name: native launcher, constructors, TLS and cleanup
        if: ${{ !cancelled() && env.BLAZE_SCRIPTS != '' }}
        run: |
          evidence="$RUNNER_TEMP/native-launcher-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          git status --short >> "$evidence/source.txt"
          git diff HEAD --binary > "$evidence/source.patch"
          export BLAZE_NO_DAEMON=1 RUST_TEST_THREADS=4 TMPDIR="$HOME"
          if timeout -k 30 1200 cargo +"$(cat pins/toolchain)" test --locked -p blaze-launch-rt --lib --test native_lib --test native_load --no-fail-fast -- --nocapture 2>&1 | tee "$evidence/tests.log"; then
            result=0
          else
            result=$?
          fi
          printf '%s\n' "$result" > "$evidence/exit-code.txt"
          exit "$result"
      - name: keep native launcher execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-launcher-evidence
          path: ${{ runner.temp }}/native-launcher-evidence
          if-no-files-found: warn
      # This instance-selection regression must execute even when the complete workspace's
      # later test-binary build finds another blocker. A filter matching no test is a failure.
      - name: owner field-bound instance selection
        if: ${{ !cancelled() && env.BLAZE_SCRIPTS != '' }}
        run: |
          evidence="$RUNNER_TEMP/owner-field-bound-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          git status --short >> "$evidence/source.txt"
          git diff HEAD --binary > "$evidence/source.patch"
          export BLAZE_NO_DAEMON=1 TMPDIR="$HOME"
          case_name='suite::instance_holes::owner_field_bounds_select_only_the_matching_impl'
          if timeout -k 30 1200 cargo +"$(cat pins/toolchain)" test --locked -p blaze-typeck --lib "$case_name" -- --exact --nocapture 2>&1 | tee "$evidence/tests.log"; then
            result=0
          else
            result=$?
          fi
          if [ "$result" -eq 0 ] && ! grep -Fxq "test $case_name ... ok" "$evidence/tests.log"; then
            echo '::error::owner field-bound regression did not execute and pass'
            result=1
          fi
          printf '%s\n' "$result" > "$evidence/exit-code.txt"
          exit "$result"
      - name: keep owner field-bound execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-field-bound-evidence
          path: ${{ runner.temp }}/owner-field-bound-evidence
          if-no-files-found: warn
      - name: source C ABI integer pairs through both emitters
        if: ${{ !cancelled() && env.BLAZE_SCRIPTS != '' }}
        run: |
          evidence="$RUNNER_TEMP/cabi-integer-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          git status --short >> "$evidence/source.txt"
          git diff HEAD --binary > "$evidence/source.patch"
          export BLAZE_NO_DAEMON=1 TMPDIR="$HOME"
          result=0
          if timeout -k 30 1200 cargo +"$(cat pins/toolchain)" test --locked -p blaze-build --lib cabi -- --nocapture 2>&1 | tee "$evidence/tests.log"; then
            :
          else
            result=$?
          fi
          case_name='sota::isel::abi_tests::i128_placement_uses_the_target_pair_rule_and_spills_whole'
          if timeout -k 30 600 cargo +"$(cat pins/toolchain)" test --locked -p blaze-emit --lib "$case_name" -- --exact --nocapture 2>&1 | tee -a "$evidence/tests.log"; then
            :
          else
            code=$?
            if [ "$result" -eq 0 ]; then result=$code; fi
          fi
          while IFS= read -r case_name; do
            if ! grep -Fxq "test $case_name ... ok" "$evidence/tests.log"; then
              echo "::error::C ABI control did not execute and pass: $case_name"
              if [ "$result" -eq 0 ]; then result=1; fi
            fi
          done <<'CASES'
          cabi::tests::classes_follow_the_fundamental_types_and_homogeneous_aggregates
          cabi::tests::sixteen_byte_alignment_rounds_to_an_even_register
          cabi::tests::i128_pairs_fit_or_spill_whole_and_return_in_x0_x1
          tests::cabi_i128::c_i128_signatures_keep_wide_scalars
          tests::cabi_i128::native::c_i128_register_pairs_match_host_abi
          tests::cabi_i128::native::c_i128_last_register_pair_matches_host_abi
          tests::cabi_i128::native::c_i128_spilled_pair_matches_host_abi
          tests::cabi_i128::native::c_i128_aligned_stack_pair_matches_host_abi
          sota::isel::abi_tests::i128_placement_uses_the_target_pair_rule_and_spills_whole
          CASES
          printf '%s\n' "$result" > "$evidence/exit-code.txt"
          exit "$result"
      - name: keep source C ABI execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cabi-integer-evidence
          path: ${{ runner.temp }}/cabi-integer-evidence
          if-no-files-found: warn
      - name: cargo check --workspace --exclude blaze-std --all-targets
        if: ${{ !cancelled() && env.BLAZE_SCRIPTS != '' }}
        run: timeout -k 30 3600 cargo +"$(cat pins/toolchain)" check --locked --workspace --exclude blaze-std --all-targets --message-format short
      - name: cargo test --workspace --exclude blaze-std
        if: ${{ !cancelled() && env.BLAZE_SCRIPTS != '' }}
        run: |
          input=$(timeout 10 jq -cn --arg evidence "$RUNNER_TEMP/workspace-storage-evidence" \
            '{exclude:["blaze-std"],evidence:$evidence}')
          timeout -k 30 5400 "$BLAZE_SCRIPTS/ci_test" "$input"
      - name: storage after workspace compiler tests
        if: ${{ always() && env.BLAZE_SCRIPTS != '' }}
        run: |
          input=$(timeout 10 jq -cn \
            --arg volume "$RUNNER_TEMP/blaze-fs" --arg target "$CARGO_TARGET_DIR" \
            --arg home "$HOME" --arg cargo_home "${CARGO_HOME:-$HOME/.cargo}" \
            --arg output "$RUNNER_TEMP/workspace-storage-evidence" \
            '{volume:$volume,target:$target,home:$home,cargo_home:$cargo_home,output:$output,phase:"after-tests"}')
          timeout -k 10 90 "$BLAZE_SCRIPTS/ci_storage" "$input"
      - name: keep workspace storage and partial build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-storage-evidence
          path: ${{ runner.temp }}/workspace-storage-evidence
          if-no-files-found: warn
      # D180: blaze-sys's compiled objects reference no C-library symbol on Linux (both
      # architectures), and on macOS only the libSystem symbols of
      # tools/ratchets/blaze-sys-libsystem.txt (scripts/src/bin/sys_imports.rs). Its lib alone,
      # no_std: an rlib per target (nothing links, so the Mac target builds here too).
      - name: blaze-sys imports, per target
        run: |
          tc="$(cat pins/toolchain)"
          sysroot="$(rustc +"$tc" --print sysroot)"
          nm="$sysroot/lib/rustlib/aarch64-unknown-linux-gnu/bin/llvm-nm"
          for triple in aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            timeout -k 30 600 cargo +"$tc" build --locked -p blaze-sys --lib --target "$triple" --target-dir target/sys-imports
            builtins=$(echo "$sysroot/lib/rustlib/$triple/lib/"libcompiler_builtins-*.rlib)
            case "$triple" in
              *-linux-*) extra='' ; os=linux ;;
              *) extra=', "ratchet": "tools/ratchets/blaze-sys-libsystem.txt"' ; os=macos ;;
            esac
            timeout -k 30 120 "$BLAZE_SCRIPTS/sys_imports" "{\"command\": \"check\", \"target\": \"$os\", \"objects\": [\"target/sys-imports/$triple/debug/libblaze_sys.rlib\"], \"builtins\": \"$builtins\", \"nm\": \"$nm\"$extra}"
          done
      - name: keep workspace shelf verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-toolchain-evidence
          path: ${{ runner.temp }}/toolchain-cut
          if-no-files-found: warn


  distributed-core:
    name: distributed library controls with pinned Cargo (partial)
    needs: [workflows]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      BLAZE_TESTS: verify
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      # This Cargo job has no later swap allocation. Keep its existing memory/swap
      # policy; the canonical filesystem action budgets the backing disk after it.
      - name: runner memory before reflink allocation
        shell: bash
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/core-evidence"
          timeout 10s swapon --show --bytes | tee "$RUNNER_TEMP/core-evidence/runner-swap.txt"
          timeout 10s free -b | tee "$RUNNER_TEMP/core-evidence/runner-memory.txt"
      - uses: ./.github/actions/reflink
      - name: short native test paths on the verified reflink filesystem
        shell: bash
        timeout-minutes: 1
        run: |
          test_temp="$RUNNER_TEMP/blaze-fs/tmp"
          mkdir "$test_temp"
          short_temp=$(mktemp -d /tmp/bz.XXXXXX)
          timeout 10s sudo mount --bind "$test_temp" "$short_temp"
          store_device=$(stat -Lc %d "$BLAZE_HOME/v2/store")
          target_device=$(stat -Lc %d "$CARGO_TARGET_DIR")
          temp_device=$(stat -Lc %d "$short_temp")
          [ "$temp_device" = "$store_device" ] && [ "$temp_device" = "$target_device" ] \
            || { echo '::error::native test temporary files, store and target must share the verified reflink device'; exit 1; }
          printf 'TMPDIR=%s\nstore_device=%s\ntarget_device=%s\ntemp_device=%s\n' \
            "$short_temp" "$store_device" "$target_device" "$temp_device" \
            | tee "$RUNNER_TEMP/core-evidence/native-filesystem.txt"
          timeout 10s findmnt -T "$short_temp"
          echo "TMPDIR=$short_temp" >> "$GITHUB_ENV"
      - uses: ./.github/actions/toolchain
        id: pinned-cargo
      - name: distributed library models and planted controls with pinned Cargo
        id: retained-tests
        shell: bash
        timeout-minutes: 75
        run: |
          mkdir -p "$RUNNER_TEMP/core-evidence"
          toolchain="$(cat "$GITHUB_WORKSPACE/pins/toolchain")"
          cp "$GITHUB_WORKSPACE/pins/toolchain" "$RUNNER_TEMP/core-evidence/toolchain-pin.txt"
          cargo "+$toolchain" --version --verbose > "$RUNNER_TEMP/core-evidence/cargo-version.txt"
          rustc "+$toolchain" --version --verbose > "$RUNNER_TEMP/core-evidence/rustc-version.txt"
          timeout -k 30 4200 cargo "+$toolchain" test --release --locked --all-targets -p blaze-dist -p blaze-dist-local -p blaze-wire -p blaze-serve --no-fail-fast \
            2>&1 | tee "$RUNNER_TEMP/core-evidence/tests.log"
          while IFS= read -r case_name; do
            grep -Eq "^test ([[:alnum:]_]+::)*$case_name \\.\\.\\. ok[[:space:]]*$" "$RUNNER_TEMP/core-evidence/tests.log" \
              || { echo "::error::missing executed library control: $case_name"; exit 1; }
          done < .github/distributed-controls.txt
      - name: distributed library binaries and integration targets compile
        id: retained-all-targets
        if: ${{ !cancelled() && steps.pinned-cargo.outcome == 'success' }}
        shell: bash
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/core-evidence"
          toolchain="$(cat "$GITHUB_WORKSPACE/pins/toolchain")"
          timeout -k 30 1100 cargo "+$toolchain" check --release --locked --keep-going --all-targets -p blaze-dist -p blaze-dist-local -p blaze-wire -p blaze-serve \
            2>&1 | tee "$RUNNER_TEMP/core-evidence/all-targets.log"
      - name: keep all retained library evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distributed-core-evidence
          path: ${{ runner.temp }}/core-evidence
          if-no-files-found: warn

  source-compiler:
    name: source CLI, real hello and exact build identity
    needs: [changes, workflows]
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      source_smoke: ${{ steps.smoke.outputs.accepted }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/script
        with:
          job: source-compiler
      - name: build the source CLI and retained services
        run: |
          mkdir -p "$RUNNER_TEMP/source-evidence"
          tc="$(cat pins/toolchain)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-evidence/source.txt"
          cp pins/toolchain "$RUNNER_TEMP/source-evidence/toolchain-pin.txt"
          timeout -k 30 5400 cargo +"$tc" build --release --locked --bins -p blaze-cli -p blaze-launcher -p blaze-dist-local -p blaze-serve \
            2>&1 | tee "$RUNNER_TEMP/source-evidence/build.log"
          mkdir "$RUNNER_TEMP/source-binaries"
          for binary in blaze blaze-launcher blaze-fact-shim blaze-dist-local blaze-serve; do
            install -m 755 "$CARGO_TARGET_DIR/release/$binary" "$RUNNER_TEMP/source-binaries/$binary"
          done
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"seal\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
      - uses: ./.github/actions/toolchain-shelf
      - name: cold warm edited and exported hello with the source CLI
        id: smoke
        timeout-minutes: 45
        run: |
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
          timeout -k 30 2400 python3 harness/blaze_cli.py "{\"blaze\":\"$RUNNER_TEMP/source-binaries/blaze\",\"scratch\":\"$RUNNER_TEMP/blaze-fs/source-smoke\",\"shelf\":\"$HOME/.blaze/v2/toolchain\",\"timeout\":900}" \
            2>&1 | tee "$RUNNER_TEMP/source-evidence/smoke.log"
          grep -Fxq 'source CLI: every check passed' "$RUNNER_TEMP/source-evidence/smoke.log"
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
          echo 'accepted=true' >> "$GITHUB_OUTPUT"
      - name: package the exact source binaries and toolchain
        run: |
          tar -czf "$RUNNER_TEMP/source-binaries.tar.gz" -C "$RUNNER_TEMP/source-binaries" .
          tar -czf "$RUNNER_TEMP/source-toolchain.tar.gz" -C "$HOME/.blaze/v2" toolchain
      - uses: actions/upload-artifact@v7
        with:
          name: source-compiler
          path: |
            ${{ runner.temp }}/source-binaries.tar.gz
            ${{ runner.temp }}/source-toolchain.tar.gz
          if-no-files-found: error
      - name: keep source compiler and shelf evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-compiler-evidence
          path: |
            ${{ runner.temp }}/source-evidence
            ${{ runner.temp }}/toolchain-cut
            ${{ runner.temp }}/source-binaries/blaze-build.json
            ${{ runner.temp }}/blaze-fs/source-smoke/*.json
          if-no-files-found: warn
      - name: retain canonical shelf bytes when the committed pin is stale
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: source-toolchain-diagnosis
          path: ~/.blaze/v2/toolchain
          include-hidden-files: true
          if-no-files-found: warn

  production-acceptance:
    name: source compiler distributed and migration acceptance
    needs: [changes, workflows, source-compiler]
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env:
      BLAZE_CORES: "2"
      BLAZE_DAEMON_MEMORY_GB: "2"
      BLAZE_TESTS: verify
    outputs:
      distributed_acceptance: ${{ steps.distributed.outputs.accepted }}
      forkfixes_acceptance: ${{ steps.forkfixes.outputs.accepted }}
      protocol_tests: ${{ steps.protocol.outputs.accepted }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: strace bubblewrap
      # D52's explicit bootstrap prerequisite, outside the source compiler. Modules are
      # rebuilt by source revision and still run inside Blaze's wasm sandbox.
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: production-acceptance
      - name: user namespaces for source test sandboxes
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            timeout 10 sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/download-artifact@v8
        with:
          name: source-compiler
          path: ${{ runner.temp }}/source-package
      - name: verify the source compiler handoff
        run: |
          mkdir "$RUNNER_TEMP/source-binaries"
          tar -xzf "$RUNNER_TEMP/source-package/source-binaries.tar.gz" -C "$RUNNER_TEMP/source-binaries"
          mkdir -p "$HOME/.blaze/v2" "$RUNNER_TEMP/dist-evidence"
          tar -xzf "$RUNNER_TEMP/source-package/source-toolchain.tar.gz" -C "$HOME/.blaze/v2"
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
      # The real source CLI must implement the retained worker protocol. distv2 probes it,
      # preserves the exact reply and names the missing bridge before any acceptance credit.
      # Version metadata, a hello or Cargo's native protocol tests cannot satisfy this gate.
      - name: full distributed worker and fault acceptance
        timeout-minutes: 240
        run: |
          for profile in dev release; do
            jq -n --arg bin "$RUNNER_TEMP/source-binaries" --arg scratch "$RUNNER_TEMP/blaze-fs/dist-$profile" --arg profile "$profile" --arg modules "$BLAZE_SCRIPTS/proc_macro_modules" \
              '{blaze:($bin+"/blaze"),dist_local:($bin+"/blaze-dist-local"),serve:($bin+"/blaze-serve"),module_builder:$modules,scratch:$scratch,faults:true,cores:2,daemon_memory_gb:2,timeout:1800,command_timeout:60,stall_bound:300,args:(if $profile=="release" then ["--release"] else [] end),profile:(if $profile=="release" then "release" else "debug" end),release_fold:($profile=="release")}' \
              > "$RUNNER_TEMP/dist-evidence/$profile-input.json"
            python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
            status=0
            timeout -k 30 7200 python3 harness/distv2.py "$RUNNER_TEMP/dist-evidence/$profile-input.json" \
              2>&1 | tee "$RUNNER_TEMP/dist-evidence/$profile.log" || status=$?
            python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
            [ "$status" = 0 ] || exit "$status"
          done
      - name: both complete fault runs used unchanged binaries and source
        id: distributed
        run: |
          for profile in dev release; do
            grep -Fxq 'distv2: every check passed' "$RUNNER_TEMP/dist-evidence/$profile.log" \
              || { echo "::error::missing full $profile distributed fault acceptance"; exit 1; }
          done
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
          echo 'accepted=true' >> "$GITHUB_OUTPUT"
      - name: every retained compiler migration fixture
        id: forkfixes
        timeout-minutes: 60
        run: |
          scratch="$RUNNER_TEMP/blaze-fs/forkfixes"
          timeout -k 30 3300 python3 harness/forkfixes.py "{\"blaze\":\"$RUNNER_TEMP/source-binaries/blaze\",\"scratch\":\"$scratch\",\"source\":\"$GITHUB_WORKSPACE\",\"timeout\":900,\"stall_bound\":300}" \
            2>&1 | tee "$RUNNER_TEMP/dist-evidence/forkfixes.log"
          python3 .github/scripts/forkfixes_acceptance.py "{\"scratch\":\"$scratch\"}"
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
          echo 'accepted=true' >> "$GITHUB_OUTPUT"
      - name: source protocol tests and complete execution observation
        timeout-minutes: 60
        run: |
          jq -n --arg blaze "$RUNNER_TEMP/source-binaries/blaze" --arg cwd "$GITHUB_WORKSPACE" --arg home "$RUNNER_TEMP/blaze-fs/protocol-home" --arg out "$RUNNER_TEMP/dist-evidence/exec" --arg shelf "$HOME/.blaze/v2/toolchain" \
            '{blaze:$blaze,cwd:$cwd,home:$home,out:$out,shelf:$shelf,command_seconds:3300,commands:(["blaze-dist","blaze-dist-local","blaze-wire","blaze-serve"] | map({name:.,args:["test","-p",.,"--view","json","--","--run-all","--format","json"]}))}' \
            > "$RUNNER_TEMP/dist-evidence/exec-input.json"
          timeout -k 30 3500 python3 harness/v2/exec_observer.py "$RUNNER_TEMP/dist-evidence/exec-input.json"
      - name: complete source protocol receipt with unchanged executables
        id: protocol
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["RUNNER_TEMP"]) / "dist-evidence/exec"
          result = json.loads((out / "result.json").read_text())
          supervisor = json.loads((out / "supervisor.json").read_text())
          packages = ["blaze-dist", "blaze-dist-local", "blaze-wire", "blaze-serve"]
          scope = "linux-command-descendants-through-exit"
          commands = supervisor.get("commands")
          if (result.get("schema") != 2 or result.get("passed") is not True or result.get("returncode") != 0
                  or result.get("scope") != scope or result.get("command_status") != 0
                  or result.get("environment", {}).get("BLAZE_NO_DAEMON") != "1"
                  or supervisor.get("schema") != 2 or supervisor.get("scope") != scope
                  or supervisor.get("complete") is not True or "stop" in supervisor
                  or not isinstance(commands, list) or len(commands) != len(packages)
                  or any(not isinstance(row, dict) or set(row) != {"name","pid","returncode","timed_out"}
                         or row["name"] != name or type(row["pid"]) is not int or row["pid"] <= 0
                         or row["returncode"] != 0 or row["timed_out"] is not False
                         for row, name in zip(commands, packages))
                  or result.get("commands") != commands):
              raise SystemExit("missing complete source protocol launch, exit and descendant evidence")
          passed = []
          for package in packages:
              rows = [json.loads(line) for line in (out / (package + ".log")).read_text().splitlines() if line.strip()]
              summaries = [row for row in rows if row.get("event") == "summary"]
              tests = [row for row in rows if row.get("event") == "test"]
              if len(summaries) != 1:
                  raise SystemExit(f"{package}: no one source test summary")
              summary = summaries[0]
              ran = summary.get("ran")
              if (summary.get("result") != "ok" or type(ran) is not int or ran <= 0
                      or summary.get("passed") != ran or len(tests) != ran
                      or any(summary.get(key, 0) != 0 for key in ("failed","reused","filtered_out","flaky","not_built"))
                      or any(row.get("outcome") != "passed" or row.get("ran_because") != "run_all"
                             or row.get("failure") is not None or row.get("basis") is not None for row in tests)):
                  raise SystemExit(f"{package}: source tests did not all execute and pass")
              passed.extend(row["path"] for row in tests)
          required = Path(".github/distributed-controls.txt").read_text().splitlines()
          missing = [name for name in required if not any(path == name or path.endswith("::" + name) for path in passed)]
          if not required or missing:
              raise SystemExit(f"missing executed source protocol controls: {missing}")
          PY
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
          echo 'accepted=true' >> "$GITHUB_OUTPUT"
      - name: keep production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-acceptance-evidence
          path: |
            ${{ runner.temp }}/dist-evidence
            ${{ runner.temp }}/source-binaries/blaze-build.json
            ${{ runner.temp }}/blaze-fs/dist-*/provenance.json
            ${{ runner.temp }}/blaze-fs/dist-*/source.patch
            ${{ runner.temp }}/blaze-fs/dist-*/logs
            ${{ runner.temp }}/blaze-fs/dist-*/final-artifacts.json
            ${{ runner.temp }}/blaze-fs/forkfixes/*.json
            ${{ runner.temp }}/blaze-fs/forkfixes/logs
          if-no-files-found: warn

  ci:
    name: ci
    needs: [changes, scripts, workflows, lean, cargo, distributed-core, source-compiler, production-acceptance]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: every required check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          tier = needs.get("changes", {}).get("outputs", {}).get("tier")
          if tier not in ("none", "gate", "warm"):
              raise SystemExit(f"unknown acceptance tier: {tier!r}")
          required = ["changes", "scripts", "workflows", "lean", "distributed-core"]
          if tier != "none":
              required += ["cargo", "source-compiler", "production-acceptance"]
          missing = [job for job in required if needs.get(job, {}).get("result") != "success"]
          failed = [job for job, value in needs.items() if value.get("result") in ("failure", "cancelled")]
          if missing or failed:
              raise SystemExit(f"required jobs did not succeed: {missing}; failures/cancellations: {failed}")
          if tier != "none":
              receipts = [("source-compiler", "source_smoke"),
                          ("production-acceptance", "distributed_acceptance"),
                          ("production-acceptance", "forkfixes_acceptance"),
                          ("production-acceptance", "protocol_tests")]
              missing = [f"{job}.{name}" for job, name in receipts
                         if needs[job].get("outputs", {}).get(name) != "true"]
              if missing:
                  raise SystemExit(f"required acceptance evidence is absent: {missing}")
          print(f"tier {tier}: every required check and acceptance receipt passed")
          PY
