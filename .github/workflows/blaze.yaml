name: PR 81 native release planner and grant receipts
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
jobs:
  release-planner:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c7f657a2357eac165ca525267671516f4720789d
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Test native release planning and actual grant telemetry
        run: |
          evidence="$RUNNER_TEMP/release-plan-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          prefix="$RUNNER_TEMP/pinned-llvm"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg prefix "$prefix" '{command:"fetch",target:"aarch64-unknown-linux-gnu",dir:$prefix}')
          timeout -k 15 600 python3 .github/scripts/llvm.py "$input"
          export LLVM_SYS_231_PREFIX="$prefix"
          tc="$(cat pins/toolchain)"
          timeout -k 20 1800 cargo +"$tc" test --locked --no-run -p blaze-ladder -p blaze-dist-local --lib \
            --features blaze-ladder/llvm --message-format=json-render-diagnostics > "$evidence/cargo.jsonl" 2> >(tee "$evidence/compile.stderr" >&2)
          test_bin() {
            # shellcheck disable=SC2016
            jq -ser --arg target "$1" '[.[] | select(.target.name == $target and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else error("expected one test binary") end' "$evidence/cargo.jsonl"
          }
          timeout -k 10 180 "$(test_bin blaze_ladder)" backend_plan --nocapture 2>&1 | tee "$evidence/plan.log"
          timeout -k 10 120 "$(test_bin blaze_dist_local)" agent::grant_events --nocapture 2>&1 | tee "$evidence/grant.log"
          grep -Fq 'backend_evidence_names_only_outputs_of_the_issued_lease ... ok' "$evidence/grant.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$evidence/plan.log"
      - name: Preserve exact planner and emission receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-plan-evidence
          path: ${{ runner.temp }}/release-plan-evidence
          if-no-files-found: warn
