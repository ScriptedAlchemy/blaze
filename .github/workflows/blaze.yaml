name: PR 81 fast-tier cold replay and native release
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact compiler commit
        type: string
        required: true
      profile:
        description: Distributed profiles to exercise
        type: choice
        options: [both, release]
        default: both
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  distributed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 105
    env:
      BLAZE_CORES: "2"
      BLAZE_DAEMON_MEMORY_GB: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: strace bubblewrap clang
      - name: Enable sandbox user namespaces
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            timeout 10 sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: production-acceptance
      - uses: ./.github/actions/toolchain-shelf
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: 4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403
          enable-cache: false
      - name: Install the pinned LLVM
        run: |
          prefix="$RUNNER_TEMP/pinned-llvm"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg prefix "$prefix" '{command:"fetch",target:"aarch64-unknown-linux-gnu",dir:$prefix}')
          timeout -k 15 600 python3 .github/scripts/llvm.py "$input"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Check the source CLI in both feature configurations
        id: source_check
        if: ${{ inputs.profile == 'both' }}
        run: |
          evidence="$RUNNER_TEMP/plan-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          tc="$(cat pins/toolchain)"
          status=0
          timeout -k 30 1400 cargo +"$tc" check --locked --release --keep-going -p blaze-cli --bin blaze \
            2>&1 | tee "$evidence/check-default.log" || status=$?
          timeout -k 30 1400 cargo +"$tc" check --locked --release --keep-going -p blaze-cli --bin blaze --features llvm \
            2>&1 | tee "$evidence/check-llvm.log" || status=$?
          exit "$status"
      - name: Verify the generated LLVM declarations
        run: |
          evidence="$RUNNER_TEMP/plan-evidence"
          mkdir -p "$evidence"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg prefix "$LLVM_SYS_231_PREFIX" --arg clang "$(command -v clang)" '{prefix:$prefix,clang:$clang,check:true}')
          timeout -k 10 120 "$BLAZE_SCRIPTS/llvm_abi" "$input" 2>&1 | tee "$evidence/llvm-generator.log"
      - name: Build and seal the exact source binaries
        id: binaries
        run: |
          evidence="$RUNNER_TEMP/plan-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 30 2750 cargo +"$(cat pins/toolchain)" build --locked --release --bins -p blaze-cli -p blaze-launcher -p blaze-dist-local -p blaze-serve \
            --features blaze-cli/llvm \
            2>&1 | tee "$evidence/build.log"
          mkdir "$RUNNER_TEMP/source-binaries"
          for binary in blaze blaze-launcher blaze-fact-shim blaze-dist-local blaze-serve; do
            install -m 755 "$CARGO_TARGET_DIR/release/$binary" "$RUNNER_TEMP/source-binaries/$binary"
          done
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"seal\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
      - name: Execute the native release record regressions
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          evidence="$RUNNER_TEMP/plan-evidence"
          tc="$(cat pins/toolchain)"
          timeout -k 20 600 cargo +"$tc" test --locked --release -p blaze-code --lib \
            -- place_tests::relro_end_addresses_place_across_a_page_boundary --exact \
            2>&1 | tee "$evidence/relro-address.log"
          grep -Fq 'place_tests::relro_end_addresses_place_across_a_page_boundary ... ok' "$evidence/relro-address.log"
          timeout -k 30 1200 cargo +"$tc" test --locked --release -p blaze-emit --features llvm --lib \
            release_record 2>&1 | tee "$evidence/llvm-records.log"
          grep -Fq 'release_record_stores_a_splat_to_every_lane ... ok' "$evidence/llvm-records.log"
          timeout -k 20 600 cargo +"$tc" test --locked --release -p blaze-llvm-abi --features native --test release \
            2>&1 | tee "$evidence/llvm-abi.log"
          grep -Fq 'release_pipeline_emits_both_arm64_object_formats ... ok' "$evidence/llvm-abi.log"
      - name: Record disk capacity before the release-only fault run
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' && inputs.profile == 'release' }}
        run: |
          evidence="$RUNNER_TEMP/plan-evidence/disk.log"
          timeout 10 df -h "$RUNNER_TEMP" "$RUNNER_TEMP/blaze-fs" | tee "$evidence"
      - name: Exercise the unchanged distributed fault harness
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        env:
          QUALIFICATION_PROFILE: ${{ inputs.profile }}
        run: |
          bin="$RUNNER_TEMP/source-binaries"
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$bin\",\"services\":true}"
          failed=0
          profiles=(release)
          if [ "$QUALIFICATION_PROFILE" = both ]; then
            profiles=(debug release)
          fi
          for profile in "${profiles[@]}"; do
            scratch="$RUNNER_TEMP/blaze-fs/dist-$profile"
            input="$RUNNER_TEMP/plan-evidence/$profile-input.json"
            # shellcheck disable=SC2016
            jq -n --arg bin "$bin" --arg scratch "$scratch" --arg modules "$BLAZE_SCRIPTS/proc_macro_modules" --arg profile "$profile" \
              '{blaze:($bin+"/blaze"),dist_local:($bin+"/blaze-dist-local"),serve:($bin+"/blaze-serve"),module_builder:$modules,scratch:$scratch,faults:true,cores:2,timeout:1800,command_timeout:120,args:(if $profile=="release" then ["--release"] else [] end),profile:$profile,release_fold:($profile=="release")}' > "$input"
            timeout -k 30 1800 uv run --frozen --no-dev python harness/distv2.py "$input" 2>&1 | tee "$RUNNER_TEMP/plan-evidence/$profile.log" || failed=$?
            python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$bin\",\"services\":true}"
          done
          exit "$failed"
      - name: Verify focused compiler regressions
        if: ${{ !cancelled() && inputs.profile == 'both' && steps.source_check.outcome == 'success' }}
        run: |
          evidence="$RUNNER_TEMP/plan-evidence"
          tc="$(cat pins/toolchain)"
          status=0
          timeout -k 30 1200 cargo +"$tc" test --release --locked -p blaze-ladder --lib \
            an_absent_member_is_observed_before_and_after_importing_its_trait \
            2>&1 | tee "$evidence/member-observation.log" || status=$?
          timeout -k 30 1200 cargo +"$tc" test --release --locked -p blaze-ladder --test front2_bounds \
            bounds_through_front2 -- --exact --nocapture \
            2>&1 | tee "$evidence/gat-bounds.log" || status=$?
          timeout -k 30 1200 cargo +"$tc" test --release --locked -p blaze-ladder --test front2_body_const_paths \
            a_gat_const_arg_on_a_type_param_self_or_qualified_type_lowers -- --exact --nocapture \
            2>&1 | tee "$evidence/gat-const-paths.log" || status=$?
          for name in signature_regions_come_from_the_head_record a_frozen_head_carries_the_store_s_side_tables a_store_filed_from_frozen_heads_alone_lowers_nothing; do
            timeout -k 30 1200 cargo +"$tc" test --release --locked -p blaze-ladder --lib "$name" \
              2>&1 | tee "$evidence/$name.log" || status=$?
          done
          grep -Fq 'an_absent_member_is_observed_before_and_after_importing_its_trait ... ok' "$evidence/member-observation.log" || status=1
          grep -Fq 'bounds_through_front2 ... ok' "$evidence/gat-bounds.log" || status=1
          grep -Fq 'a_gat_const_arg_on_a_type_param_self_or_qualified_type_lowers ... ok' "$evidence/gat-const-paths.log" || status=1
          for name in signature_regions_come_from_the_head_record a_frozen_head_carries_the_store_s_side_tables a_store_filed_from_frozen_heads_alone_lowers_nothing; do
            grep -Fq "$name ... ok" "$evidence/$name.log" || status=1
          done
          exit "$status"
      - name: Retain the unit plans and exact binary receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-release-and-dev
          path: |
            ${{ runner.temp }}/plan-evidence
            ${{ runner.temp }}/source-binaries/blaze-build.json
            ${{ runner.temp }}/blaze-fs/dist-*/logs
            ${{ runner.temp }}/blaze-fs/dist-*/gates
            ${{ runner.temp }}/blaze-fs/dist-*/*.json
          if-no-files-found: warn
