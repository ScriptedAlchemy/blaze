name: PR 81 store pointer relocation proof
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact compiler commit containing the regression
        type: string
        required: true
      baseline:
        description: Parent commit containing the original store implementation
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  cas:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Reproduce the conflict and execute the repaired store suite
        env:
          BASELINE: ${{ inputs.baseline }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cas-target
        run: |
          test "$(timeout 10 git rev-parse HEAD^)" = "$BASELINE"
          tc=$(timeout 10 cat pins/toolchain)
          test_name=plain::phase_commit_tests::publication_preserves_the_newest_pointer_moved_by_compaction
          mkdir -p "$RUNNER_TEMP/cas-proof"
          timeout 10 git rev-parse HEAD HEAD^{tree} "$BASELINE" > "$RUNNER_TEMP/cas-proof/revisions"
          timeout 15 git restore --source="$BASELINE" -- crates/blaze-cas/src/plain/core.rs
          status=0
          timeout -k 15s 720s cargo +"$tc" test --locked -p blaze-cas --lib "$test_name" -- --exact \
            > "$RUNNER_TEMP/cas-proof/baseline.log" 2>&1 || status=$?
          timeout 10 tail -45 "$RUNNER_TEMP/cas-proof/baseline.log"
          test "$status" -eq 101
          timeout 10 grep -F 'closing commit must keep the relocated pointer: Err(SweptUnder' "$RUNNER_TEMP/cas-proof/baseline.log"
          timeout 15 git restore -- crates/blaze-cas/src/plain/core.rs
          timeout 10 git diff --exit-code
          timeout -k 15s 720s cargo +"$tc" test --locked -p blaze-cas --lib "$test_name" -- --exact \
            2>&1 | tee "$RUNNER_TEMP/cas-proof/focused.log"
          timeout 10 grep -F '1 passed; 0 failed' "$RUNNER_TEMP/cas-proof/focused.log"
          timeout -k 15s 720s cargo +"$tc" test --locked -p blaze-cas --lib \
            2>&1 | tee "$RUNNER_TEMP/cas-proof/suite.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cas-pointer-relocation-evidence
          path: ${{ runner.temp }}/cas-proof
