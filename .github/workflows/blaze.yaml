name: PR 81 nested WASI build dependency migration
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact migration source commit
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  scripts-and-ladder:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: bubblewrap
      - name: Enable sandbox user namespaces
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            timeout 10 sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: production-acceptance
      - uses: ./.github/actions/toolchain-shelf
        id: shelf
      - name: Build the exact release CLI and launcher
        run: |
          evidence="$RUNNER_TEMP/selection-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 30 2500 cargo +"$(cat pins/toolchain)" build --release --locked --bins -p blaze-cli -p blaze-launcher \
            2>&1 | tee "$evidence/build.log"
          sha256sum "$CARGO_TARGET_DIR"/release/{blaze,blaze-launcher,blaze-fact-shim} > "$evidence/binaries.txt"
      - name: Install the pinned C toolchain for the native-archive fixture
        uses: ./.github/actions/linux-c-shelf
      - name: Run the retained build-dependency fixture
        run: |
          scratch="$RUNNER_TEMP/blaze-fs/selected-module-forkfixes"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg blaze "$CARGO_TARGET_DIR/release/blaze" --arg scratch "$scratch" --arg source "$GITHUB_WORKSPACE" \
            --arg modules "$BLAZE_SCRIPTS/proc_macro_modules" \
            '{blaze:$blaze,scratch:$scratch,source:$source,module_builder:$modules,timeout:600,workers:2,only:["a-script-searches-where-its-build-dependencys-script-said"]}')
          timeout -k 20 1600 python3 harness/forkfixes.py "$input" 2>&1 | tee "$RUNNER_TEMP/selection-evidence/forkfixes.log"
          grep -Fq 'fork migration: 1/1 cases passed' "$RUNNER_TEMP/selection-evidence/forkfixes.log"
      - name: Verify the generated-file and search-directory receipt
        if: ${{ !cancelled() && steps.shelf.outcome == 'success' }}
        run: |
          evidence="$RUNNER_TEMP/selection-evidence"
          tc="$(cat pins/toolchain)"
          timeout -k 20 900 cargo +"$tc" test --release --locked -p blaze-proc-macro --lib \
            a_wasi_producer_receipt_serves_the_compiled_path_and_search_list \
            2>&1 | tee "$evidence/producer-grant.log"
          grep -Fq 'a_wasi_producer_receipt_serves_the_compiled_path_and_search_list ... ok' "$evidence/producer-grant.log"
      - name: Verify GAT bounds and associated const arguments
        if: ${{ !cancelled() && steps.shelf.outcome == 'success' }}
        run: |
          evidence="$RUNNER_TEMP/selection-evidence"
          tc="$(cat pins/toolchain)"
          timeout -k 30 1200 cargo +"$tc" test --release --locked -p blaze-ladder --test front2_bounds \
            bounds_through_front2 -- --exact --nocapture 2>&1 | tee "$evidence/gat-bounds.log"
          grep -Fq 'bounds_through_front2 ... ok' "$evidence/gat-bounds.log"
      - name: Run the Linux workspace regression controls
        if: ${{ !cancelled() && steps.shelf.outcome == 'success' }}
        run: |
          evidence="$RUNNER_TEMP/selection-evidence"
          tc="$(cat pins/toolchain)"
          status=0
          timeout -k 30 1200 cargo +"$tc" test --release --locked -p blaze-cli --test build_scripts \
            2>&1 | tee "$evidence/cli-build-scripts.log" || status=1
          timeout -k 30 1200 cargo +"$tc" test --release --locked -p blaze-ladder --lib \
            an_absent_member_is_observed_before_and_after_importing_its_trait \
            2>&1 | tee "$evidence/member-observation.log" || status=1
          timeout -k 30 1200 cargo +"$tc" test --release --locked -p scripts --bin proc_macro_modules \
            a_std_only_unit_does_not_remove_the_checkout_compile_receipt \
            2>&1 | tee "$evidence/std-dependency-graph.log" || status=1
          if timeout -k 30 1200 cargo +"$tc" test --release --locked -p blaze-ladder \
            --test front2_body_scope_surface --no-run --message-format=json > "$evidence/body-scope-build.jsonl"; then
            binary=$(timeout 10 jq -er 'select(.target.name=="front2_body_scope_surface" and .executable!=null).executable' \
              "$evidence/body-scope-build.jsonl")
            timeout -k 20 600 /usr/bin/time -v "$binary" --nocapture --test-threads=4 \
              2>&1 | tee "$evidence/body-scope.log" || status=1
          else
            status=1
          fi
          grep -Fq 'an_absent_member_is_observed_before_and_after_importing_its_trait ... ok' "$evidence/member-observation.log" || status=1
          grep -Fq 'a_std_only_unit_does_not_remove_the_checkout_compile_receipt ... ok' "$evidence/std-dependency-graph.log" || status=1
          exit "$status"
      - name: Preserve source, binary and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selection-evidence
          path: |
            ${{ runner.temp }}/selection-evidence
            ${{ runner.temp }}/toolchain-cut
            ${{ runner.temp }}/blaze-fs/selected-module-forkfixes/*.json
            ${{ runner.temp }}/blaze-fs/selected-module-forkfixes/evidence
          if-no-files-found: warn
