name: PR 81 upstream merge verification
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e49f8e395bfc16617c43a05fba4901e8fbdab2f6
      - uses: ./.github/actions/toolchain
      - name: typecheck compiler, runtime and workspace tests
        run: timeout -k 20 2400 cargo +"$(cat pins/toolchain)" check --locked --workspace --all-targets --keep-going --message-format=short
  shelf:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e49f8e395bfc16617c43a05fba4901e8fbdab2f6
      - uses: ./.github/actions/toolchain
      - name: compile source cutter and gate
        run: timeout -k 20 1200 cargo +"$(cat pins/toolchain)" build --locked -p scripts --bin toolchain_cut --bin gate
      - name: generate and independently verify source shelf
        run: |
          set -euo pipefail
          timeout -k 20 600 cargo +"$(cat pins/toolchain)" fetch --locked -q
          registries=("${CARGO_HOME:-$HOME/.cargo}"/registry/cache/index.crates.io-*)
          test "${#registries[@]}" -eq 1
          input=$(jq -nc --arg reg "${registries[0]}" --arg shelf "$RUNNER_TEMP/shelf" '{tree:".",targets:["aarch64-apple-darwin","aarch64-unknown-linux-gnu"],registry:$reg,shelf:$shelf,write_pin:true,check:false,macro_side:true}')
          timeout -k 20 900 target/debug/toolchain_cut "$input"
          timeout -k 20 900 target/debug/toolchain_cut "$(jq -c '.write_pin=false | .check=true' <<< "$input")"
          cat crates/blaze-toolchain/PINNED
          timeout 90 target/debug/gate selftest
      - uses: actions/upload-artifact@v7
        with:
          name: canonical-pin
          path: crates/blaze-toolchain/PINNED
  tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e49f8e395bfc16617c43a05fba4901e8fbdab2f6
      - uses: ./.github/actions/toolchain
      - name: exercise the CSR invariants
        run: timeout -k 15 600 cargo +"$(cat pins/toolchain)" test --locked -p blaze-own --lib csr::tests::
      - name: exercise reserve publication and crash recovery
        run: timeout -k 15 1200 cargo +"$(cat pins/toolchain)" test --locked -p blaze-std --lib fs::reserve::tests::
