name: PR 81 compiler fixture regressions
on:
  workflow_dispatch:
    inputs:
      source:
        required: true
        type: string
      suite:
        required: true
        type: choice
        options: [items, front-equal, test-cache]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
  BLAZE_CORES: all
jobs:
  fixtures:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - name: Give workspace tests a short same-filesystem home
        run: |
          mkdir "$RUNNER_TEMP/blaze-fs/workspace-home"
          test_home=$(timeout 10 mktemp -d /tmp/bc.XXXXXX)
          timeout 10 sudo mount --bind "$RUNNER_TEMP/blaze-fs/workspace-home" "$test_home"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "HOME=$test_home" >> "$GITHUB_ENV"
      - uses: ./.github/actions/script
        with:
          job: cargo
      - uses: ./.github/actions/toolchain-shelf
      - name: Build and run the selected regression
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          evidence="$RUNNER_TEMP/fixture-evidence"
          mkdir -p "$evidence"
          timeout 15 git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          tc=$(timeout 10 cat pins/toolchain)
          case "$SUITE" in
            items) crate=blaze-ladder; target=front2_items; selection=(--test-threads=4) ;;
            front-equal) crate=blaze-ladder; target=front_equal; selection=(--test-threads=4) ;;
            test-cache) crate=blaze-cli; target=test_command_runs; selection=(pooled_workers_match_serial_bztr_and_purity --exact) ;;
            *) exit 2 ;;
          esac
          timeout -k 20 1760 cargo +"$tc" test --locked -p "$crate" --test "$target" \
            --no-run --message-format=json > "$evidence/build.jsonl"
          binary=$(timeout 20 jq -er --arg target "$target" \
            'select(.target.name==$target and .executable!=null).executable' "$evidence/build.jsonl")
          timeout -k 20 480 /usr/bin/time -v "$binary" --nocapture "${selection[@]}" 2>&1 | tee "$evidence/test.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: focused-compiler-fixtures
          path: |
            ${{ runner.temp }}/fixture-evidence
            ${{ runner.temp }}/toolchain-cut
          if-no-files-found: warn
