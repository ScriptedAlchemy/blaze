name: PR 81 focused Linux verification
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  ci-runner:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fde961c3cc44a6a8aa142f6ab9c312867eb309ce
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: verify the runner and partial-inventory recovery
        run: |
          timeout -k 15 900 cargo +"$(cat pins/toolchain)" test --locked -p scripts --bin ci_test -- --nocapture
          timeout -k 15 240 cargo +"$(cat pins/toolchain)" run --locked -p scripts --bin ci_test -- selftest
  linux-compiler:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 43ee81853f4c5ffb2a02f789a7ff84ba9de659b6
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/llvm-prefix
      - name: test the ARM64 library in the real host loader
        run: timeout -k 15 600 cargo +"$(cat pins/toolchain)" test --locked -p blaze-export --test native_so -- --nocapture
      - name: test pinned native toolchain planning
        if: ${{ !cancelled() }}
        run: timeout -k 15 600 cargo +"$(cat pins/toolchain)" test --locked -p blaze-build-script --lib toolchain::tests -- --nocapture
      - name: compile and run the compiler regression controls
        if: ${{ !cancelled() }}
        run: |
          tc=$(cat pins/toolchain)
          set -o pipefail
          run_control() {
            local package=$1 test=$2
            timeout -k 20 2100 cargo +"$tc" test --locked -p "$package" --lib "$test" -- --exact --nocapture | tee "$RUNNER_TEMP/$package.txt"
            grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/$package.txt"
          }
          run_control blaze-typeck suite::dyn_objects::an_inferred_numeric_local_unsizes_only_to_a_trait_it_implements
      - name: compile the Linux CLI and run its JSON diagnostic control
        if: ${{ !cancelled() }}
        run: |
          tc=$(cat pins/toolchain)
          timeout -k 20 2400 cargo +"$tc" test --locked -p blaze-cli --bin blaze tests::engine_borrow_forms_tests::json_reports_the_type_and_borrow_checkers_codes -- --exact --nocapture | tee "$RUNNER_TEMP/blaze-cli.txt"
          grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/blaze-cli.txt"
