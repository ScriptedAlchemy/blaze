name: PR 81 ARM64 dev export latency
on:
  workflow_dispatch:
    inputs:
      treatment:
        description: Exact treatment commit with the dev_latency harness
        type: string
        required: true
      baseline:
        description: Exact baseline compiler commit, or empty for a single candidate
        type: string
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  BLAZE_TESTS: verify
  RUST_BACKTRACE: "0"
jobs:
  dev-latency:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.treatment }}
          persist-credentials: false
      - uses: actions/checkout@v7
        if: inputs.baseline != ''
        with:
          ref: ${{ inputs.baseline }}
          path: target-baseline
          persist-credentials: false
      - name: Verify clean source snapshots and shared toolchain pins
        timeout-minutes: 2
        env:
          TREATMENT: ${{ inputs.treatment }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          out="$RUNNER_TEMP/latency-evidence"
          timeout 10s mkdir -p "$out"
          verify_source() {
            local dir=$1 sha=$2
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
            test "$(timeout 10s git -C "$dir" rev-parse HEAD)" = "$sha"
            test -z "$(timeout 10s git -C "$dir" status --porcelain --untracked-files=all)"
            timeout 10s git -C "$dir" rev-parse HEAD 'HEAD^{tree}'
          }
          verify_source . "$TREATMENT" | tee "$out/harness-source.txt"
          if [[ -n "$BASELINE" ]]; then
            verify_source target-baseline "$BASELINE" | tee "$out/baseline-source.txt"
            for pin in pins/toolchain pins/llvm.json crates/blaze-toolchain/PINNED; do
              timeout 10s cmp "$pin" "target-baseline/$pin"
            done
          fi
          timeout 10s sha256sum pins/toolchain pins/llvm.json crates/blaze-toolchain/PINNED \
            | tee "$out/shared-pins.sha256"

      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: bubblewrap
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: source-compiler
      - uses: ./.github/actions/toolchain-shelf
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned LLVM as in the production source compiler job
        timeout-minutes: 12
        run: |
          prefix="$RUNNER_TEMP/pinned-llvm"
          # shellcheck disable=SC2016
          input=$(timeout 10s jq -nc --arg prefix "$prefix" '{command:"fetch",target:"aarch64-unknown-linux-gnu",dir:$prefix}')
          timeout -k 15s 600s python3 .github/scripts/llvm.py "$input"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Build and seal exact source compiler, launcher and services for each arm
        timeout-minutes: 185
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          out="$RUNNER_TEMP/latency-evidence"
          arms=(treatment)
          [[ -z "$BASELINE" ]] || arms=(baseline treatment)
          for arm in "${arms[@]}"; do
            source="$GITHUB_WORKSPACE"
            if [[ "$arm" == baseline ]]; then source="$source/target-baseline"; fi
            bin="$RUNNER_TEMP/$arm-binaries"
            export CARGO_TARGET_DIR="$RUNNER_TEMP/blaze-fs/cargo-$arm"
            timeout 10s mkdir -p "$bin" "$CARGO_TARGET_DIR"
            (
              cd "$source"
              tc=$(timeout 10s cat pins/toolchain)
              timeout -k 30s 5400s cargo +"$tc" build --release --locked --bins \
                -p blaze-cli -p blaze-launcher -p blaze-dist-local -p blaze-serve --features blaze-cli/llvm
            ) 2>&1 | tee "$out/$arm-build.log"
            if [[ "$arm" == treatment ]]; then
              tc=$(timeout 10s cat "$source/pins/toolchain")
              case_name=a_second_walk_with_the_same_maker_reuses_all_verified_read_answers
              timeout -k 15s 900s cargo +"$tc" test --locked --release -p blaze-ladder --test d106_records "$case_name" -- --exact \
                2>&1 | tee "$out/known-read-answers-test.log"
              timeout 10s grep -F "test $case_name ... ok" "$out/known-read-answers-test.log"
            fi
            for binary in blaze blaze-launcher blaze-fact-shim blaze-dist-local blaze-serve; do
              timeout 45s install -m 755 "$CARGO_TARGET_DIR/release/$binary" "$bin/$binary"
            done
            # shellcheck disable=SC2016
            input=$(timeout 10s jq -nc --arg bin "$bin" '{command:"seal",binaries:$bin,services:true}')
            timeout 120s python3 "$source/.github/scripts/dist_build_identity.py" "$input" | tee "$out/$arm-seal.log"
            timeout 10s cp "$bin/blaze-build.json" "$out/$arm-blaze-build.json"
            timeout 120s rm -rf -- "$CARGO_TARGET_DIR"
          done
          timeout 10s sha256sum "$BLAZE_SCRIPTS/proc_macro_modules" "$BLAZE_SCRIPTS/KEY" \
            | tee "$out/d52.sha256"

      - name: Measure seeded dev exports with equal CPU budgets on this runner
        timeout-minutes: 85
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          out="$RUNNER_TEMP/latency-evidence"
          arms=(treatment)
          [[ -z "$BASELINE" ]] || arms=(baseline treatment)
          timeout 10s uname -a | tee "$out/kernel.txt"
          timeout 10s lscpu | tee "$out/cpu.txt"
          timeout 10s findmnt -T "$RUNNER_TEMP/blaze-fs" | tee "$out/filesystem.txt"
          first_failure=0
          for arm in "${arms[@]}"; do
            source="$GITHUB_WORKSPACE"
            if [[ "$arm" == baseline ]]; then source="$source/target-baseline"; fi
            bin="$RUNNER_TEMP/$arm-binaries"
            scratch="$RUNNER_TEMP/blaze-fs/latency-$arm"
            # shellcheck disable=SC2016
            verify=$(timeout 10s jq -nc --arg bin "$bin" '{command:"verify",binaries:$bin,services:true}')
            timeout 120s python3 "$source/.github/scripts/dist_build_identity.py" "$verify" | tee "$out/$arm-verify-before.log"
            # shellcheck disable=SC2016
            timeout 10s jq -n --arg bin "$bin" --arg scratch "$scratch" --arg modules "$BLAZE_SCRIPTS/proc_macro_modules" \
              '{blaze:($bin+"/blaze"),dist_local:($bin+"/blaze-dist-local"),serve:($bin+"/blaze-serve"),
                module_builder:$modules,scratch:$scratch,dev_latency:true,faults:false,repetitions:2,
                cores:2,timeout:900,command_timeout:60,env:{XDG_CACHE_HOME:($scratch+"/machine-cache")}}' \
              > "$out/$arm-input.json"
            status=0
            timeout -k 30s 2350s python3 harness/distv2.py "$out/$arm-input.json" \
              2>&1 | tee "$out/$arm-harness.log" || status=$?
            timeout 120s python3 "$source/.github/scripts/dist_build_identity.py" "$verify" | tee "$out/$arm-verify-after.log"
            if [[ "$status" != 0 && "$first_failure" == 0 ]]; then first_failure=$status; fi
          done
          timeout 10s sha256sum -c "$out/d52.sha256"
          exit "$first_failure"

      - name: Match measured binaries, fixture and CPU affinity to the source receipts
        timeout-minutes: 2
        env:
          BASELINE: ${{ inputs.baseline }}
          TREATMENT: ${{ inputs.treatment }}
        run: |
          timeout 60s python3 - <<'PY' | tee "$RUNNER_TEMP/latency-evidence/verified.json"
          import hashlib
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          out = temp / "latency-evidence"
          refs = {name.lower(): os.environ[name] for name in ("BASELINE", "TREATMENT") if os.environ[name]}
          harness_commit, harness_tree = (out / "harness-source.txt").read_text().splitlines()
          assert harness_commit == refs["treatment"], "harness checkout differs from treatment"
          d52, _ = (out / "d52.sha256").read_text().splitlines()
          d52 = d52.split()[0]
          verified = {}
          reference = None
          for arm, commit in refs.items():
              source = json.loads((out / f"{arm}-blaze-build.json").read_text())
              assert source["source"]["commit"] == commit, (arm, source["source"])
              scratch = temp / "blaze-fs" / f"latency-{arm}"
              report = json.loads((scratch / "dev-latency.json").read_text())
              cpus = report["cpus"]
              assert len(set(cpus)) == 2, (arm, cpus)
              rounds = sorted(scratch.glob("run-*/provenance.json"))
              assert len(rounds) == 2, (arm, rounds)
              fixtures = set()
              for path in rounds:
                  record = json.loads(path.read_text())
                  assert (record["commit"], record["tree"]) == (harness_commit, harness_tree), path
                  assert record["patch_sha256"] == hashlib.sha256(b"").hexdigest(), path
                  for field, binary in {"blaze": "blaze", "dist_local": "blaze-dist-local", "serve": "blaze-serve"}.items():
                      assert record["binaries"][field]["sha256"] == source["binaries"][binary], (path, field)
                  assert record["binaries"]["module_builder"]["sha256"] == d52, path
                  fixtures.add(record["fixture_sha256"])
              assert len(fixtures) == 1, (arm, fixtures)
              fixture = fixtures.pop()
              comparison = (cpus, fixture)
              if reference is not None:
                  assert comparison == reference, (arm, comparison, reference)
              reference = comparison
              verified[arm] = {"compiler": source, "cpus": cpus, "fixture_sha256": fixture}
          print(json.dumps({"harness": {"commit": harness_commit, "tree": harness_tree},
                            "d52_sha256": d52, "arms": verified}, indent=2))
          PY

      - name: Retain build, latency, bootstrap and profile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-latency-evidence
          path: |
            ${{ runner.temp }}/latency-evidence
            ${{ runner.temp }}/toolchain-cut
            ${{ runner.temp }}/blaze-fs/latency-*/dev-latency.json
            ${{ runner.temp }}/blaze-fs/latency-*/run-*/provenance.json
            ${{ runner.temp }}/blaze-fs/latency-*/run-*/source.patch
            ${{ runner.temp }}/blaze-fs/latency-*/run-*/logs
            ${{ runner.temp }}/blaze-fs/latency-*/run-*/**/.blaze/v2/start.txt
            ${{ runner.temp }}/blaze-fs/latency-*/run-*/**/.blaze/v2/profile.txt
            ${{ runner.temp }}/blaze-fs/latency-*/**/*.parquet
          include-hidden-files: true
          if-no-files-found: warn
