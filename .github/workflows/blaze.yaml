name: PR 81 exact D52 checkout module proofs
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
jobs:
  receipts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a901314f2b014d910359733223530a9dd379b2ce
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - name: Verify module identity and exact executable reopen
        run: |
          evidence="$RUNNER_TEMP/d52-module-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 20 1500 cargo +"$(cat pins/toolchain)" test --locked --lib -p blaze-build-script -p blaze-proc-macro --no-fail-fast \
            2>&1 | tee "$evidence/module-tests.log"
          grep -Fq 'checkout_module_reads_exact_revision_and_round_trips_proof ... ok' "$evidence/module-tests.log"
          grep -Fq 'exact_script_module_reopens_the_selected_executable_bytes ... ok' "$evidence/module-tests.log"
      - name: Verify the real module producer writes the same identity
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/d52-module-evidence"
          timeout -k 20 1200 cargo +"$(cat pins/toolchain)" test --locked -p scripts --bin proc_macro_modules \
            2>&1 | tee "$RUNNER_TEMP/d52-module-evidence/d52-tests.log"
      - name: Retain D52 identity tests and exact source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d52-module-evidence
          path: ${{ runner.temp }}/d52-module-evidence
          if-no-files-found: warn
