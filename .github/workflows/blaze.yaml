name: PR 81 distributed native compiler verification
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 567e2e2dcfd999428cc333e465bf43282c62ceeb
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/llvm-prefix
      - name: compile native planner and CLI integration
        run: |
          timeout -k 30 2400 cargo +"$(cat pins/toolchain)" check --locked -p blaze-cli --bins --message-format short
      - name: compile and execute LLVM-emitted code
        if: ${{ !cancelled() }}
        run: |
          timeout -k 30 1500 cargo +"$(cat pins/toolchain)" test --locked -p blaze-emit --lib llvm::emit_tests -- --nocapture | tee "$RUNNER_TEMP/emit.txt"
          grep -Fq 'llvm::emit_tests::release_record_runs ... ok' "$RUNNER_TEMP/emit.txt"
      - name: verify imported and folded module planning
        if: ${{ !cancelled() }}
        run: |
          timeout -k 30 900 cargo +"$(cat pins/toolchain)" test --locked -p blaze-emit --lib llvm:: -- --nocapture
      - name: execute exported Rust cdylibs with glibc
        if: ${{ !cancelled() }}
        run: |
          timeout -k 20 600 cargo +"$(cat pins/toolchain)" test --locked -p blaze-export --test native_dylib rust_cdylib:: -- --nocapture | tee "$RUNNER_TEMP/dlopen.txt"
          grep -Fq 'rust_cdylib::cdylib_loader_rebases_data_binds_allocator_and_initializes_rust_tls ... ok' "$RUNNER_TEMP/dlopen.txt"
