name: PR 81 distributed native compiler verification
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 133b0e415a166127cdda1c1ed88a8bef33fa3e2e
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/llvm-prefix
      - name: a_boxed_dyn_future_yields_only_its_output_region
        if: ${{ !cancelled() }}
        run: |
          timeout -k 20 2100 cargo +"$(cat pins/toolchain)" test --locked -p blaze-flow-lower --lib a_boxed_dyn_future_yields_only_its_output_region -- --nocapture | tee "$RUNNER_TEMP/test.log"
          grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/test.log"
      - name: assoc_item_bounds_prove_alias_trait_clauses
        if: ${{ !cancelled() }}
        run: |
          timeout -k 20 2100 cargo +"$(cat pins/toolchain)" test --locked -p blaze-borrow --lib assoc_item_bounds_prove_alias_trait_clauses -- --nocapture | tee "$RUNNER_TEMP/test.log"
          grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/test.log"
      - name: a_where_clause_reads_traits_nested_in_its_projection_term
        if: ${{ !cancelled() }}
        run: |
          timeout -k 20 2100 cargo +"$(cat pins/toolchain)" test --locked -p blaze-ladder --lib a_where_clause_reads_traits_nested_in_its_projection_term -- --nocapture | tee "$RUNNER_TEMP/test.log"
          grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/test.log"
      - name: front2_marker_and_enum_ownership
        if: ${{ !cancelled() }}
        run: |
          timeout -k 20 2100 cargo +"$(cat pins/toolchain)" test --locked -p blaze-ladder --test front2_marker_and_enum_ownership  -- --nocapture | tee "$RUNNER_TEMP/test.log"
          grep -Fq '2 passed; 0 failed' "$RUNNER_TEMP/test.log"
      - name: marker_cast_materializes_one_table_then_preserves_the_wide_metadata
        if: ${{ !cancelled() }}
        run: |
          timeout -k 20 2100 cargo +"$(cat pins/toolchain)" test --locked -p blaze-body-build --lib marker_cast_materializes_one_table_then_preserves_the_wide_metadata -- --nocapture | tee "$RUNNER_TEMP/test.log"
          grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/test.log"
      - name: single_arm64_sites_keep_the_registers_neighbours_scale_and_branch_link
        if: ${{ !cancelled() }}
        run: |
          timeout -k 20 2100 cargo +"$(cat pins/toolchain)" test --locked -p blaze-code --lib single_arm64_sites_keep_the_registers_neighbours_scale_and_branch_link -- --nocapture | tee "$RUNNER_TEMP/test.log"
          grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/test.log"
      - name: arm64_relocations
        if: ${{ !cancelled() }}
        run: |
          timeout -k 20 2100 cargo +"$(cat pins/toolchain)" test --locked -p blaze-export --test arm64_relocations  -- --nocapture | tee "$RUNNER_TEMP/test.log"
          grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/test.log"
      - name: memory_licm_keeps_load_after_invoke_that_writes_its_slot
        if: ${{ !cancelled() }}
        run: |
          timeout -k 20 2100 cargo +"$(cat pins/toolchain)" test --locked -p blaze-lir --lib memory_licm_keeps_load_after_invoke_that_writes_its_slot -- --nocapture | tee "$RUNNER_TEMP/test.log"
          grep -Fq '1 passed; 0 failed' "$RUNNER_TEMP/test.log"
