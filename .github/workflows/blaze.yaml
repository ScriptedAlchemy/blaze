name: PR 81 stack placement and retained compiler regressions
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  arithmetic:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b6d6806be79edd5f085a6692dd01136bc1220332
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - name: verify stack layout and the generated initializer's task anchor
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          evidence="$RUNNER_TEMP/regression-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          tc="$(cat pins/toolchain)"
          timeout -k 20 1200 cargo +"$tc" test --locked --lib -p blaze-emit -p blaze-build -p blaze-scope --no-run \
            --message-format=json-render-diagnostics > "$evidence/cargo.jsonl" 2> >(tee "$evidence/compile.stderr" >&2)
          test_bin() {
            # shellcheck disable=SC2016
            jq -ser --arg target "$1" '[.[] | select(.target.name == $target and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else error("expected one test binary") end' "$evidence/cargo.jsonl"
          }
          emitter="$(test_bin blaze_emit)"
          scope="$(test_bin blaze_scope)"
          build="$(test_bin blaze_build)"
          timeout -k 10 120 "$emitter" slot_ --test-threads=4 2>&1 | tee "$evidence/slot.log"
          grep -Fq 'slot_placement_finds_the_first_aligned_gap ... ok' "$evidence/slot.log"
          grep -Fq 'slot_coloring_reuses_dead_and_disjoint_slots_and_preserves_live_distinctness ... ok' "$evidence/slot.log"
          timeout -k 10 120 "$scope" a_proc_macro_crate_lists_its_macros_in_one_unnamed_static 2>&1 | tee "$evidence/scope.log"
          grep -Fq 'a_proc_macro_crate_lists_its_macros_in_one_unnamed_static ... ok' "$evidence/scope.log"
          timeout -k 10 600 "$build" tests::arith_panics --test-threads=4 2>&1 | tee "$evidence/arithmetic.log"
          grep -Fq 'arithmetic_past_the_2048th_value_ends_as_the_reference_defines ... ok' "$evidence/arithmetic.log"
          grep -Fq 'the_control_no_check_on_rem_is_caught ... ok' "$evidence/arithmetic.log"
      - name: keep exact stack-layout test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: placement-and-initializer-evidence
          path: ${{ runner.temp }}/regression-evidence
          if-no-files-found: warn
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b6d6806be79edd5f085a6692dd01136bc1220332
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: source-compiler
      - uses: ./.github/actions/toolchain-shelf
      - name: build the exact release CLI and launcher
        run: |
          mkdir -p "$RUNNER_TEMP/async-evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/async-evidence/source.txt"
          timeout -k 30 3000 cargo +"$(cat pins/toolchain)" build --release --locked --bins -p blaze-cli -p blaze-launcher \
            2>&1 | tee "$RUNNER_TEMP/async-evidence/build.log"
          sha256sum "$CARGO_TARGET_DIR"/release/{blaze,blaze-launcher,blaze-fact-shim} > "$RUNNER_TEMP/async-evidence/binaries.txt"
      - name: run both unchanged migration regressions
        run: |
          scratch="$RUNNER_TEMP/blaze-fs/async-forkfixes"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg blaze "$CARGO_TARGET_DIR/release/blaze" --arg scratch "$scratch" --arg source "$GITHUB_WORKSPACE" \
            --arg modules "$BLAZE_SCRIPTS/proc_macro_modules" \
            '{blaze:$blaze,scratch:$scratch,source:$source,module_builder:$modules,only:["attribute-impl-in-function","an-async-fn-and-polling-it-again"],timeout:300,workers:2}')
          timeout -k 20 600 python3 harness/forkfixes.py "$input" 2>&1 | tee "$RUNNER_TEMP/async-evidence/forkfixes.log"
      - name: keep the exact source and fixture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finished-coroutine-panic-evidence
          path: |
            ${{ runner.temp }}/async-evidence
            ${{ runner.temp }}/toolchain-cut
            ${{ runner.temp }}/blaze-fs/async-forkfixes/*.json
            ${{ runner.temp }}/blaze-fs/async-forkfixes/evidence
          if-no-files-found: warn
