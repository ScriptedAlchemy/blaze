name: PR 81 LLVM fatal unwind gaps
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a646dadad39623078fbdfb0e5af95f1ddb33bcf4
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: install pinned LLVM and verify the six native unwind cases
        run: |
          evidence="$RUNNER_TEMP/cfi-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          prefix="$RUNNER_TEMP/pinned-llvm"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg prefix "$prefix" '{command:"fetch",target:"aarch64-unknown-linux-gnu",dir:$prefix}')
          timeout -k 10 900 python3 .github/scripts/llvm.py "$input"
          export LLVM_SYS_231_PREFIX="$prefix"
          timeout -k 20 1400 cargo +"$(cat pins/toolchain)" test --locked -p blaze-emit --features llvm --lib llvm::emit_tests -- --nocapture \
            2>&1 | tee "$evidence/emit.log"
          grep -Fq 'native_objects_import_llvm_unwind_for_each_landing ... ok' "$evidence/emit.log"
          grep -Fq 'folded_body_and_each_member_thunk_execute_their_own_constants ... ok' "$evidence/emit.log"
          grep -Fq 'native_cleanup_calls_leave_gaps_without_losing_resume ... ok' "$evidence/emit.log"
      - name: verify unwind records and both export formats
        if: ${{ !cancelled() }}
        run: |
          evidence="$RUNNER_TEMP/cfi-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          tc="$(cat pins/toolchain)"
          timeout -k 20 1200 cargo +"$tc" test --locked --lib \
            -p blaze-code -p blaze-tier -p blaze-export -p blaze-launch-rt -- --test-threads=4 \
            2>&1 | tee "$evidence/records-and-runtime.log"
          for test in machine_cfi_preserves_llvm_rows_and_explicit_lsda export_machine_cfi_preserves_program_extent_and_shares_cie \
            machine_cfi_participates_in_optimized_folding machine_cfi_survives_the_direct_and_tier_forms; do
            grep -Fq "$test ... ok" "$evidence/records-and-runtime.log"
          done
          timeout -k 20 900 cargo +"$tc" test --locked -p blaze-export --test arm64_relocations \
            2>&1 | tee "$evidence/relocations.log"
      - name: keep the exact source and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: machine-cfi-record-evidence
          path: ${{ runner.temp }}/cfi-evidence
          if-no-files-found: warn
