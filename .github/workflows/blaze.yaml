name: PR 81 standalone host build-script producer rows
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
jobs:
  host-scripts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ed5a379314c455d31d91bb7b8c20199607fbda3f
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - name: Verify producer world record encoding and schema refusal
        run: |
          evidence="$RUNNER_TEMP/script-planner"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 15 850 cargo +"$(cat pins/toolchain)" test --locked -p blaze-world --lib \
            2>&1 | tee "$evidence/world.log"
          grep -Fq 'an_old_crate_list_is_refused_by_name ... ok' "$evidence/world.log"
      - name: Verify a producer with no checked crate row
        if: ${{ !cancelled() }}
        run: |
          evidence="$RUNNER_TEMP/script-planner"
          mkdir -p "$evidence"
          timeout -k 30 1800 cargo +"$(cat pins/toolchain)" test --locked -p blaze-cli --bin blaze scripts_plan_a_host_only_producer_without_a_checked_crate \
            2>&1 | tee "$evidence/cli.log"
          grep -Fq 'scripts_plan_a_host_only_producer_without_a_checked_crate ... ok' "$evidence/cli.log"
      - name: Retain exact source and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: script-planner-evidence
          path: ${{ runner.temp }}/script-planner
          if-no-files-found: warn
