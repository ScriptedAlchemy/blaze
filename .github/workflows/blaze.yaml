name: PR 81 combined native source toolchain shelf
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  shelf:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b8f7df7262cb28fec7665e06f0f3d122d1651995
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/script
        with:
          job: source-compiler
      - name: Cut and verify the canonical shelf
        run: |
          evidence="$RUNNER_TEMP/canonical-shelf"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 20 600 cargo +"$(cat pins/toolchain)" fetch --locked --quiet
          shopt -s nullglob
          registries=("${CARGO_HOME:-$HOME/.cargo}"/registry/cache/index.crates.io-*)
          test "${#registries[@]}" -eq 1
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg reg "${registries[0]}" --arg shelf "$RUNNER_TEMP/shelf" '{tree:".",targets:["aarch64-apple-darwin","aarch64-unknown-linux-gnu"],registry:$reg,shelf:$shelf,write_pin:true,check:false,macro_side:true}')
          timeout -k 20 600 "$BLAZE_SCRIPTS/toolchain_cut" "$input" | tee "$evidence/cut.log"
          timeout -k 20 600 "$BLAZE_SCRIPTS/toolchain_cut" "$(jq -c '.write_pin=false | .check=true' <<< "$input")" | tee "$evidence/verify.log"
          cp crates/blaze-toolchain/PINNED "$evidence/PINNED"
          git diff --exit-code -- . ':!crates/blaze-toolchain/PINNED'
          cat "$evidence/PINNED"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: combined-canonical-shelf
          path: ${{ runner.temp }}/canonical-shelf
          if-no-files-found: warn
