            -p blaze-core -p blaze-cas -p blaze-hashcons -p blaze-http -p blaze-kernel \
            -p blaze-launch-rt -p blaze-profile -p blaze-solo -p blaze-vfs -p const-ast \
            -p blaze-pack -p blaze-unitkey -p blaze-record -p blaze-manifest -p syntax \
