name: PR 81 distributed plan observations and stack placement
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  dev:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 80
    env:
      BLAZE_CORES: "2"
      BLAZE_DAEMON_MEMORY_GB: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 44123cf2a5dce6f81d7607f723c7d1bbfb333436
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: strace bubblewrap
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: production-acceptance
      - uses: ./.github/actions/toolchain-shelf
      - name: Build and seal the exact source binaries
        run: |
          evidence="$RUNNER_TEMP/plan-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 30 2750 cargo +"$(cat pins/toolchain)" build --locked --release --bins -p blaze-cli -p blaze-launcher -p blaze-dist-local -p blaze-serve \
            2>&1 | tee "$evidence/build.log"
          mkdir "$RUNNER_TEMP/source-binaries"
          for binary in blaze blaze-launcher blaze-fact-shim blaze-dist-local blaze-serve; do
            install -m 755 "$CARGO_TARGET_DIR/release/$binary" "$RUNNER_TEMP/source-binaries/$binary"
          done
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"seal\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
      - name: Compare every planned proof observation with the real worker harness
        run: |
          scratch="$RUNNER_TEMP/blaze-fs/dist-dev"
          input="$RUNNER_TEMP/plan-evidence/dev-input.json"
          bin="$RUNNER_TEMP/source-binaries"
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$bin\",\"services\":true}"
          # shellcheck disable=SC2016
          jq -n --arg bin "$bin" --arg scratch "$scratch" --arg modules "$BLAZE_SCRIPTS/proc_macro_modules" \
            '{blaze:($bin+"/blaze"),dist_local:($bin+"/blaze-dist-local"),serve:($bin+"/blaze-serve"),module_builder:$modules,scratch:$scratch,faults:true,cores:2,timeout:1800,command_timeout:60,args:[],profile:"debug"}' > "$input"
          timeout -k 30 1800 python3 harness/distv2.py "$input" 2>&1 | tee "$RUNNER_TEMP/plan-evidence/dev.log"
          python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$bin\",\"services\":true}"
      - name: Retain each proof observation and the exact binary receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distributed-proof-observations
          path: |
            ${{ runner.temp }}/plan-evidence
            ${{ runner.temp }}/source-binaries/blaze-build.json
            ${{ runner.temp }}/blaze-fs/dist-dev/logs
            ${{ runner.temp }}/blaze-fs/dist-dev/gates
            ${{ runner.temp }}/blaze-fs/dist-dev/*.json
          if-no-files-found: warn
  arithmetic:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 44123cf2a5dce6f81d7607f723c7d1bbfb333436
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: gdb
      - uses: ./.github/actions/toolchain
      - name: Verify the far arithmetic stack cell and capture an unfinished stack
        env:
          CARGO_PROFILE_TEST_DEBUG: "1"
        run: |
          evidence="$RUNNER_TEMP/arithmetic-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 25 1800 cargo +"$(cat pins/toolchain)" test --locked --lib -p blaze-build --no-run \
            --message-format=json-render-diagnostics > "$evidence/cargo.jsonl" 2> >(tee "$evidence/compile.stderr" >&2)
          # shellcheck disable=SC2016
          binary=$(timeout 10 jq -ser '[.[] | select(.target.name == "blaze_build" and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else error("expected one test binary") end' "$evidence/cargo.jsonl")
          timeout -k 10 600 "$binary" tests::arith_panics --test-threads=4 > "$evidence/arithmetic.log" 2>&1 &
          test_driver=$!
          (
            sleep 530
            if kill -0 "$test_driver" 2>/dev/null; then
              test_pid=$(timeout 5 ps -o pid= --ppid "$test_driver" | awk 'NR == 1 { print $1 }')
              if [ -n "$test_pid" ]; then
                child_pid=$(timeout 5 ps -o pid= --ppid "$test_pid" | awk 'NR == 1 { print $1 }')
                for pid in "$test_pid" ${child_pid:+"$child_pid"}; do
                  timeout -k 2 12 sudo -n gdb -batch -nx -iex 'set auto-load off' -iex 'set debuginfod enabled off' \
                    -iex 'set print frame-arguments none' -p "$pid" -ex 'thread apply all bt 24' 2>&1 | tee "$evidence/stack-$pid.txt"
                done
              fi
            fi
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          status=0
          wait "$test_driver" || status=$?
          timeout 5 cat "$evidence/arithmetic.log"
          test "$status" -eq 0
          grep -Fq 'arithmetic_past_the_2048th_value_ends_as_the_reference_defines ... ok' "$evidence/arithmetic.log"
          grep -Fq 'the_control_no_check_on_rem_is_caught ... ok' "$evidence/arithmetic.log"
      - name: Retain arithmetic results and stack captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: far-arithmetic-evidence
          path: ${{ runner.temp }}/arithmetic-evidence
          if-no-files-found: warn
