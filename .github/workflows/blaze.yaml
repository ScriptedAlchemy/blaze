name: PR 81 CAS same-name root retarget control
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact CAS simulator snapshot
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  root-retarget:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Reproduce the retained-root compaction race in the CAS simulator
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cas-target
          CARGO_BUILD_JOBS: '2'
        run: |
          timeout 15 git rev-parse HEAD 'HEAD^{tree}'
          tc=$(timeout 10 cat pins/toolchain)
          timeout -k 15 800 cargo +"$tc" test --locked -p blaze-cas --lib \
            plain::tests::publication_keeps_a_reused_key_after_the_old_root_is_retargeted -- --exact --nocapture
          timeout -k 15 800 cargo +"$tc" test --locked -p blaze-cas --lib
