name: PR 81 pinned LLVM record verification
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6e4caa7822e64de0f443bc5818e94bedc3b7e6f0
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: verify source and install the pinned LLVM prefix
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-evidence"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/llvm-evidence/source.txt"
          prefix="$RUNNER_TEMP/pinned-llvm"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg prefix "$prefix" '{command:"fetch",target:"aarch64-unknown-linux-gnu",dir:$prefix}')
          timeout -k 10 900 python3 .github/scripts/llvm.py "$input"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: compile and execute LLVM records and fold thunks
        id: emitter
        run: |
          log="$RUNNER_TEMP/llvm-evidence/emit.txt"
          timeout -k 30 1800 cargo +"$(cat pins/toolchain)" test --locked -p blaze-emit --features llvm --lib llvm:: -- --nocapture 2>&1 | tee "$log"
          grep -Fq 'llvm::emit_tests::release_record_runs ... ok' "$log"
          grep -Fq 'llvm::emit_tests::native_call_and_tail_branch_execute_with_the_original_return_address ... ok' "$log"
          grep -Fq 'llvm::emit_tests::folded_body_and_each_member_thunk_execute_their_own_constants ... ok' "$log"
          grep -Fq 'llvm::emit_tests::optimized_import_keeps_its_trap_source_when_the_roots_trap_is_deleted ... ok' "$log"
      - name: execute exported ARM64 relocations
        if: ${{ !cancelled() && steps.emitter.outcome == 'success' }}
        run: |
          log="$RUNNER_TEMP/llvm-evidence/export.txt"
          timeout -k 20 900 cargo +"$(cat pins/toolchain)" test --locked -p blaze-export --test arm64_relocations -- --nocapture 2>&1 | tee "$log"
          grep -Fq 'native_exports_call_an_indirect_veneer_and_read_a_scaled_constant ... ok' "$log"
      - name: keep the exact source and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pinned-llvm-record-evidence
          path: ${{ runner.temp }}/llvm-evidence
          if-no-files-found: error
