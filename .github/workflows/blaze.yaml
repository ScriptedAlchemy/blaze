name: PR 81 source-qualified WASI producer receipts
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
jobs:
  receipts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 26d61f62d151ef76b6c28457d492e1ffb1e6196b
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - name: Verify separate compiler and search receipts
        run: |
          evidence="$RUNNER_TEMP/d52-module-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 20 1200 cargo +"$(cat pins/toolchain)" test --locked --lib -p blaze-build-script producer_outputs \
            2>&1 | tee "$evidence/module-tests.log"
          grep -Fq 'bind_the_compiled_view_and_search_view_separately ... ok' "$evidence/module-tests.log"
      - name: Verify the producer receipt against Cargo's inputs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/d52-module-evidence"
          timeout -k 20 1200 cargo +"$(cat pins/toolchain)" test --locked -p scripts --bin proc_macro_modules \
            producer_capture::tests \
            2>&1 | tee "$RUNNER_TEMP/d52-module-evidence/d52-tests.log"
          grep -Fq 'the_producer_receipt_uses_cargos_reached_library_and_real_outputs ... ok' "$RUNNER_TEMP/d52-module-evidence/d52-tests.log"
          grep -Fq 'only_an_admitted_producer_search_can_be_rewritten ... ok' "$RUNNER_TEMP/d52-module-evidence/d52-tests.log"
      - name: Verify producer lookup and read-only grants across source revisions
        if: ${{ !cancelled() }}
        run: |
          evidence="$RUNNER_TEMP/d52-module-evidence"
          tc="$(cat pins/toolchain)"
          timeout -k 20 1200 cargo +"$tc" test --locked -p blaze-proc-macro --lib producer \
            2>&1 | tee "$evidence/producer-selection.log"
          grep -Fq 'a_standalone_producer_selects_the_checkout_revision_with_identical_wasm ... ok' "$evidence/producer-selection.log"
          grep -Fq 'a_wasi_producer_receipt_serves_the_compiled_path_and_search_list ... ok' "$evidence/producer-selection.log"
      - name: Retain D52 identity tests and exact source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d52-module-evidence
          path: ${{ runner.temp }}/d52-module-evidence
          if-no-files-found: warn
