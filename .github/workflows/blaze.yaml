name: PR 81 combined migration and ladder verification
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "0"
jobs:
  scripts-and-ladder:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 82fc9d04157ea373c0490a2894aae57b78a78217
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
        with:
          components: rust-src
          targets: wasm32-wasip1
      - uses: ./.github/actions/script
        with:
          job: production-acceptance
      - uses: ./.github/actions/toolchain-shelf
        id: shelf
      - name: Build the exact release CLI and launcher
        run: |
          evidence="$RUNNER_TEMP/selection-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          timeout -k 30 2500 cargo +"$(cat pins/toolchain)" build --release --locked --bins -p blaze-cli -p blaze-launcher \
            2>&1 | tee "$evidence/build.log"
          sha256sum "$CARGO_TARGET_DIR"/release/{blaze,blaze-launcher,blaze-fact-shim} > "$evidence/binaries.txt"
      - name: Install the pinned C toolchain for the native-archive fixture
        uses: ./.github/actions/linux-c-shelf
      - name: Run the retained migration harness on the new script handoff
        run: |
          scratch="$RUNNER_TEMP/blaze-fs/selected-module-forkfixes"
          # shellcheck disable=SC2016
          input=$(timeout 10 jq -nc --arg blaze "$CARGO_TARGET_DIR/release/blaze" --arg scratch "$scratch" --arg source "$GITHUB_WORKSPACE" \
            --arg modules "$BLAZE_SCRIPTS/proc_macro_modules" \
            '{blaze:$blaze,scratch:$scratch,source:$source,module_builder:$modules,timeout:600,workers:2}')
          timeout -k 20 1600 python3 harness/forkfixes.py "$input" 2>&1 | tee "$RUNNER_TEMP/selection-evidence/forkfixes.log"
      - name: Run both original whole-toolchain ladder suites
        if: ${{ !cancelled() && steps.shelf.outcome == 'success' }}
        run: |
          evidence="$RUNNER_TEMP/selection-evidence"
          mkdir -p "$evidence"
          export RUST_BACKTRACE=1
          timeout -k 30 1200 cargo +"$(cat pins/toolchain)" test --release --locked -p blaze-ladder \
            --test front2_body_scope_impls --test front2_futures_transitive --no-fail-fast \
            2>&1 | tee "$evidence/ladder.log"
      - name: Test recorded alias regions and exact module selection
        if: ${{ !cancelled() && steps.shelf.outcome == 'success' }}
        run: |
          evidence="$RUNNER_TEMP/selection-evidence"
          tc="$(cat pins/toolchain)"
          status=0
          for test_name in signature_regions_come_from_the_head_record a_frozen_head_carries_the_store_s_side_tables; do
            timeout -k 20 950 cargo +"$tc" test --release --locked -p blaze-ladder --lib "$test_name" \
              2>&1 | tee "$evidence/$test_name.log" || status=$?
          done
          timeout -k 20 900 cargo +"$tc" test --release --locked -p blaze-proc-macro --lib \
            checkout_script_lookup_selects_only_the_current_compiler_reads \
            2>&1 | tee "$evidence/checkout-script-lookup.log" || status=$?
          exit "$status"
      - name: Preserve source, binary and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selection-evidence
          path: |
            ${{ runner.temp }}/selection-evidence
            ${{ runner.temp }}/toolchain-cut
            ${{ runner.temp }}/blaze-fs/selected-module-forkfixes/*.json
            ${{ runner.temp }}/blaze-fs/selected-module-forkfixes/evidence
          if-no-files-found: warn
