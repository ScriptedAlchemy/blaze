            the_oracle_catches_a_root_leaving_out_its_sealed_set
            the_oracle_catches_a_collector_ignoring_a_kept_roots_listing
            the_oracle_catches_a_sync_opening_a_sealed_file_for_write
            the_oracle_catches_a_content_hash_omitting_part_of_the_value
            the_oracle_catches_an_ack_told_at_sent
            the_oracle_catches_a_read_left_out
            the_oracle_catches_a_hit_admitted_without_postings
            the_oracle_catches_a_posting_written_at_the_next_carry
            the_oracle_catches_an_absence_left_out_of_the_change_set
            the_oracle_catches_a_root_kept_without_its_repair
            the_oracle_catches_a_session_opened_without_its_postings
            the_oracle_catches_a_parent_repaired_before_its_child
            the_oracle_catches_a_session_that_outlives_its_pin
            the_oracle_catches_a_parent_recording_its_childs_reads_but_one
            the_oracle_catches_a_cutoff_by_the_childs_identity_alone
