name: PR 81 native unwind record verification
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6fa04b9cf361b6e6ecf1698cc59991db3a4ffc0f
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - name: verify unwind records and both export formats
        run: |
          evidence="$RUNNER_TEMP/cfi-evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          tc="$(cat pins/toolchain)"
          timeout -k 20 1200 cargo +"$tc" test --locked --lib \
            -p blaze-code -p blaze-tier -p blaze-export -p blaze-launch-rt -- --test-threads=4 \
            2>&1 | tee "$evidence/records-and-runtime.log"
          for test in machine_cfi_preserves_llvm_rows_and_explicit_lsda export_machine_cfi_preserves_program_extent_and_shares_cie \
            machine_cfi_participates_in_optimized_folding machine_cfi_survives_the_direct_and_tier_forms; do
            grep -Fq "$test ... ok" "$evidence/records-and-runtime.log"
          done
          timeout -k 20 900 cargo +"$tc" test --locked -p blaze-export --test arm64_relocations \
            2>&1 | tee "$evidence/relocations.log"
      - name: verify CLI source-position materialization
        if: ${{ !cancelled() }}
        run: |
          evidence="$RUNNER_TEMP/cfi-evidence"
          mkdir -p "$evidence"
          timeout -k 30 2100 cargo +"$(cat pins/toolchain)" test --locked -p blaze-cli --bin blaze \
            materialize_positionless_patches_line_and_column_slots \
            2>&1 | tee "$evidence/position.log"
          grep -Fq 'materialize_positionless_patches_line_and_column_slots ... ok' "$evidence/position.log"
      - name: keep the exact source and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: machine-cfi-record-evidence
          path: ${{ runner.temp }}/cfi-evidence
          if-no-files-found: warn
