name: PR 81 focused protocol execution diagnosis
on:
  workflow_dispatch:
    inputs:
      source:
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  BLAZE_CORES: "2"
  BLAZE_TESTS: verify
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "0"
jobs:
  protocol:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/apt
        with:
          packages: strace bubblewrap
      - name: Enable sandbox user namespaces
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            timeout 10 sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/script
        with:
          job: source-compiler
      - uses: ./.github/actions/toolchain-shelf
      - name: Build exact compiler and launcher
        run: |
          evidence="$RUNNER_TEMP/diagnostics"
          mkdir -p "$evidence"
          timeout 15 git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          tc=$(timeout 10 cat pins/toolchain)
          timeout -k 20 1200 cargo +"$tc" build --locked --bins -p blaze-cli -p blaze-launcher 2>&1 | tee "$evidence/build.log"
          timeout 30 sha256sum "$CARGO_TARGET_DIR/debug"/{blaze,blaze-launcher,blaze-fact-shim} > "$evidence/binaries.txt"
      - name: Observe the exact affected protocol cases
        run: |
          evidence="$RUNNER_TEMP/diagnostics"
          status=0
          for entry in missing:absent_invalid_and_expired_connections_are_named_refusals \
            frames:fragmented_coalesced_and_malformed_frames_are_real_socket_boundaries \
            version:versions_content_session_and_terminal_bindings_fail_closed \
            coordinator:the_coordinator_owns_and_removes_its_actual_socket \
            result:the_real_driver_submits_a_gated_result_with_valid_and_expired_lease_controls; do
            name=${entry%%:*}
            test=${entry#*:}
            timeout 20 jq -n --arg blaze "$CARGO_TARGET_DIR/debug/blaze" --arg cwd "$GITHUB_WORKSPACE" \
              --arg home "$RUNNER_TEMP/blaze-fs/protocol-home-$name" --arg out "$evidence/$name" --arg test "$test" \
              --arg shelf "$HOME/.blaze/v2/toolchain" --arg name "$name" \
              '{blaze:$blaze,cwd:$cwd,home:$home,out:$out,shelf:$shelf,command_seconds:235,commands:[{name:$name,args:["test","-p","blaze-dist-local","--view","json","--","--run-all","--format","json",$test]}]}' \
              > "$evidence/$name.json"
            timeout -k 15 265 python3 harness/v2/exec_observer.py "$evidence/$name.json" || status=$?
            timeout 10 jq -rc 'select(.event=="failed" or .event=="not_run" or .event=="summary")' "$evidence/$name/$name.log" || status=$?
          done
          timeout 30 sha256sum --check "$evidence/binaries.txt"
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: focused-protocol-execution
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: warn
