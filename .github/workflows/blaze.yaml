name: Three local ARM clients and final placement control
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact compiler and harness commit under test
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Keep the validation driver
        run: timeout 10s cp .github/scripts/single-host-proof.py "$RUNNER_TEMP/driver.py"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/locked-memory
      - uses: ./.github/actions/reflink
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/script
        with:
          job: source-compiler
      - uses: ./.github/actions/toolchain-shelf
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and seal the developer compiler and services
        timeout-minutes: 60
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          bin="$RUNNER_TEMP/bin"
          test "$(timeout 10s git rev-parse HEAD)" = "$SOURCE"
          timeout 10s mkdir -p "$bin" "$RUNNER_TEMP/evidence"
          tc=$(timeout 10s cat pins/toolchain)
          timeout -k 15s 3300s cargo +"$tc" build -j 2 --locked --release --bins -p blaze-cli -p blaze-launcher -p blaze-dist-local -p blaze-serve \
            2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          for name in blaze blaze-launcher blaze-fact-shim blaze-dist-local blaze-serve; do
            timeout 15s install -m 755 "$CARGO_TARGET_DIR/release/$name" "$bin/$name"
          done
          # shellcheck disable=SC2016
          request=$(timeout 5s jq -nc --arg bin "$bin" '{command:"seal",binaries:$bin,services:true}')
          timeout 60s python3 .github/scripts/dist_build_identity.py "$request"
      - name: Verify link-time folding and placement observation
        timeout-minutes: 10
        run: |
          tc=$(timeout 10s cat pins/toolchain)
          timeout -k 15s 540s cargo +"$tc" test -j 2 --locked --release -p blaze-export --lib equal_records_are_placed_once | tee "$RUNNER_TEMP/evidence/placement.log"
          timeout 5s grep -E '^test .*equal_records_are_placed_once \.\.\. ok' "$RUNNER_TEMP/evidence/placement.log"
      - name: Three clients contribute physical records to one executable
        timeout-minutes: 28
        run: |
          # shellcheck disable=SC2016
          input=$(timeout 10s jq -nc --arg checkout "$GITHUB_WORKSPACE" --arg bin "$RUNNER_TEMP/bin" --arg scratch "$RUNNER_TEMP/blaze-fs/three-client" \
            '{checkout:$checkout,blaze:($bin+"/blaze"),dist_local:($bin+"/blaze-dist-local"),serve:($bin+"/blaze-serve"),scratch:$scratch,blobs:"127.0.0.1:19481",cores:1,timeout:720}')
          timeout -k 15s 1580s python3 "$RUNNER_TEMP/driver.py" "$input" 2>&1 | tee "$RUNNER_TEMP/evidence/control.log"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: single-host-placement-evidence
          path: |
            ${{ runner.temp }}/bin/blaze-build.json
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/blaze-fs/three-client/*.json*
            ${{ runner.temp }}/blaze-fs/three-client/**/*.json*
            ${{ runner.temp }}/blaze-fs/three-client/**/*.log
          if-no-files-found: warn
