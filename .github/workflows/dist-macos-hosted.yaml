# The hosted macOS half of a full dist tier the private pool shares out. When the fork's owner
# pushes to an integration branch with PRIVATE_DIST_MACOS_CI on, pr.yaml leaves macOS to the
# controller of the private pool (ScriptedAlchemy/ci-runner-orchestrator), and the required
# `Private dist macOS CI` status carries its verdict. The controller puts each of the six C2
# lanes on the private Mac or on hosted macOS: half and half while the Mac has nothing queued,
# all hosted while it has, and a placement that has not started within its deadline, or that
# GitHub cancelled for want of a runner, moves once to the other side. The lanes it puts here run
# through this workflow, which it alone dispatches, on the source run's exact commit.
#
# It never routes anything itself, starts no other run, and is not a check of pr.yaml's: the
# controller reads its conclusion and folds it into the status, so a failed lane here fails the
# status as one on the Mac would.
name: dist macOS (hosted placement)
run-name: hosted-dist-macos:${{ github.repository }}:${{ inputs.run_id }}:${{ inputs.attempt }}:${{ inputs.placement }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: the pr.yaml run whose macOS share this is
        required: true
        type: string
      attempt:
        description: that run's attempt
        required: true
        type: string
      sha:
        description: that run's commit
        required: true
        type: string
      tier:
        description: fast (bundle and platform checks) or full (and the lanes)
        type: choice
        options: [full, fast]
        default: full
      lanes:
        description: 'a JSON list of the C2 lanes to run here, as blaze-dist-review.yaml takes them'
        required: true
        type: string
      placement:
        description: the controller's name for this placement
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: dist-macos-hosted-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ inputs.placement }}
  cancel-in-progress: false

jobs:
  macos:
    # The owner alone: the controller dispatches with the owner's token, and nobody else's run
    # may speak for the private status.
    if: >-
      github.actor_id == '25274700' && github.triggering_actor == 'ScriptedAlchemy' &&
      github.event_name == 'workflow_dispatch'
    uses: ScriptedAlchemy/blaze/.github/workflows/dist-macos.yaml@585dd0e0fcfa854fc132f584aebf673b0431c02f
    with:
      source-repository: ${{ github.repository }}
      source-ref: ${{ inputs.sha }}
      os: macos-15
      tier: ${{ inputs.tier }}
      lanes: ${{ inputs.lanes }}
