name: Holder lease and heartbeat regressions
on:
  pull_request:
    paths:
      - crates/blaze-dist/src/**
      - crates/blaze-dist/tests/**
      - crates/blaze-dist/Cargo.toml
      - crates/blaze-dist-local/src/**
      - crates/blaze-dist-local/tests/**
      - crates/blaze-dist-local/Cargo.toml
      - crates/blaze-wire/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/holder-leases.yaml
  push:
    branches: [dist/main]
    paths:
      - crates/blaze-dist/src/**
      - crates/blaze-dist/tests/**
      - crates/blaze-dist/Cargo.toml
      - crates/blaze-dist-local/src/**
      - crates/blaze-dist-local/tests/**
      - crates/blaze-dist-local/Cargo.toml
      - crates/blaze-wire/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: holder-leases-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  holder:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal -c rustfmt
          rustup default 1.99.0
      - name: Exercise the actual holder protocol
        run: |
          cargo test --locked -p blaze-dist --test holder --test holder_boundary --test work
          cargo test --locked -p blaze-dist-local --lib driver::tests
      - name: Format
        run: cargo fmt --all -- --check
