name: pgo

# Trains profiles with the target's owned compiler and opens a reviewed pin PR.
# Training artifacts are content addressed; protected main is never directly pushed.
# When crates or the toolchain change, stale profiles cannot be reused safely.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Cargo.lock, "**/Cargo.toml", harness/toolchain]

concurrency:
  group: pgo
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  train:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-26 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.0 --profile minimal --component llvm-tools,rust-src && rustup default 1.99.0
      - run: python3 .github/scripts/build_release.py --target ${{ matrix.target }} --train "$RUNNER_TEMP/pgo"
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
      - uses: actions/upload-artifact@v7
        with:
          name: pgo-${{ matrix.target }}
          path: ${{ runner.temp }}/pgo
          if-no-files-found: error

  pin:
    name: pin
    needs: train
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Use the existing bot credential when available, so reviewed PGO PRs
          # trigger their own required CI. Never use it to bypass main's queue.
          token: ${{ secrets.RA_JIT_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: pgo-*
          path: ${{ runner.temp }}/pgo
      - name: Verify source is still the tip of main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo 'Main advanced during PGO training; refuse stale profile publication' >&2
            exit 1
          }
      # Validate all target manifests, content digests and source SHAs BEFORE
      # touching the shared release. An invalid artifact must never clobber a
      # currently pinned profile or leave a partial publication behind.
      - name: Verify and prepare complete training pins
        run: |
          python3 .github/scripts/build_release.py --pin "$RUNNER_TEMP"/pgo/*
          python3 .github/scripts/pin_pgo_release.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --artifacts "$RUNNER_TEMP/pgo"
      - name: Upload validated profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pgo-profiles --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create pgo-profiles --repo "$GITHUB_REPOSITORY" --prerelease --title "PGO profiles" \
              --notes "The profiles ra-jit's builds are optimized with, one file per toolchain, target and content (pgo/profiles.json pins them by sha256). Not a release of ra-jit."
          gh release upload pgo-profiles --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/pgo/*/*.profdata --clobber
      - name: Publish reviewed pin PR
        env:
          GH_TOKEN: ${{ secrets.RA_JIT_BOT_TOKEN || github.token }}
        run: python3 .github/scripts/publish_pgo_pin.py
