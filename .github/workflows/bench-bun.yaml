# Optional benchmark platforms run on standard GitHub-hosted images.
# Select platforms with BENCH_RUNNERS; results retain their actual host metadata.
name: bench-bun
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write the README even when every number is within noise"
        type: boolean
        default: false

concurrency:
  group: bench-readme
  cancel-in-progress: false

# The workflow's own token only reads; the jobs on the benchmark machines get nothing more, and
# the publish job, on a GitHub-hosted runner, takes the write it commits with.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all

jobs:
  platforms:
    name: selected benchmark platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          BENCH_RUNNERS: ${{ vars.BENCH_RUNNERS }}
          BENCH_RUNNER: ${{ vars.BENCH_RUNNER }}
        run: python3 harness/benchplatforms.py matrix

  bench:
    name: bench (bun, ${{ matrix.name }})
    needs: platforms
    if: >-
      needs.platforms.outputs.any == 'true' &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.label }}
    permissions:
      contents: read
    timeout-minutes: 360
    env:
      BENCH_MACHINE: GitHub-hosted ${{ matrix.name }} (${{ matrix.label }})
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/blaze
        with:
          job: bench-bun
          llvm: 'true'
          reflink: ${{ runner.os == 'Linux' && 'true' || 'false' }}
      - uses: ./.github/actions/nix
      - name: Build blaze
        run: |
          bench_root=/tmp
          if [ "$RUNNER_OS" = Linux ]; then bench_root="$RUNNER_TEMP/blaze-fs"; fi
          export BENCH_HOME="$bench_root/bb-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$BENCH_HOME"
          echo "BENCH_HOME=$BENCH_HOME" >> "$GITHUB_ENV"
          echo "TMPDIR=$bench_root" >> "$GITHUB_ENV"
          stage0="$(command -v blaze)"
          CARGO_TARGET_DIR="$BENCH_HOME/compiler" nix develop .#bench -c "$stage0" build -p blaze-engine --release --locked
          "$stage0" stop
      # Edits: bun's own build of its C and C++ goes to BLAZE_PROJECTS/bun-native once per
      # revision (bunprep.py); the measured trees are copies of it.
      - name: Bench
        id: bench
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          jq -n --arg blaze "$BENCH_HOME/compiler/release/blaze-engine" --arg work "$BENCH_HOME/work" \
            --arg sources "$BENCH_HOME/projects" --arg out "$RUNNER_TEMP/results/bench-bun.json" \
            --arg commit "$GITHUB_SHA" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg machine "$BENCH_MACHINE" \
            '{action:"run",blaze:$blaze,work:$work,sources:$sources,out:$out,commit:$commit,run_url:$run_url,
              projects:["bun"],backends:["cranelift","llvm"],runs:3,machine:$machine}' > "$RUNNER_TEMP/bench-input.json"
          nix develop .#bench-bun -c env -u CARGO_INCREMENTAL -u RUSTC_WRAPPER python3 harness/bench.py "$RUNNER_TEMP/bench-input.json" \
            || { status=$?; [ "$status" = 3 ] || exit "$status"; echo "wrong=true" >> "$GITHUB_OUTPUT"; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-bun-${{ matrix.slug }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
      - name: Fail on a wrong result
        if: steps.bench.outputs.wrong == 'true'
        run: |
          echo "::error::Bun failed a Blaze build or its program-output oracle: see the Bench step"
          exit 1

  publish:
    name: README
    needs: [platforms, bench]
    if: >-
      always() && needs.platforms.outputs.any == 'true' &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The ruleset on main refuses a push from the workflow's own token: this one is allowed
          # past it (docs/harness.md, "CI").
          token: ${{ secrets.BLAZE_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-bun-*
          path: ${{ runner.temp }}/results
      - name: README
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          for result in "$RUNNER_TEMP"/results/bench-bun-*/bench-bun.json; do
            [ -f "$result" ] || continue
            jq -n --arg result "$result" --argjson force "$FORCE" \
              '{action:"publish",result:$result,name:"bun",force:$force}' | python3 harness/benchreport.py - \
              || echo "::warning::$result was not published"
          done
      - name: Commit to main
        run: |
          git add README.md docs/benchmarks.md docs/benchmarks/
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "bench: bun's numbers for ${GITHUB_SHA::10} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::the bench commit does not apply to main"; exit 1; }
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
