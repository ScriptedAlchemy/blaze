# The build bundle (docs/reports/CI-fork.md): a commit's ra-jit, built once for one platform,
# which every check of the run consumes instead of building its own. Called by pr.yaml.
#
#   release ra-jit with both owned backends (cranelift and llvm)
#   the owned macro runtime, bootstrapped by blaze with every compiler and Cargo call blocked
#   every set of .github/ci/test-sets.json for the platform: test executables with the processes
#   `cargo test` would start recorded, and the executables of build and bench sets
#   bundle.json: the source identity, toolchain, and the sha256 of every file
#
# This job alone writes the Rust and Nix caches (the fork's policy): sccache and the dev shell's
# own paths, on pushes to dist/* and on a pull request's own ref, one entry per ref.
name: bundle

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      os:
        type: string
        required: true
      base-sha:
        description: "the pull request's base, for sets with `source: base`"
        type: string
        default: ""
      cache-write:
        type: boolean
        default: false
    outputs:
      sha256:
        description: sha256 of bundle.json
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read
  actions: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "0"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ inputs.platform }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 150
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify cache retention and complete CLI dispatch before setup
        run: |
          python3 -I .github/scripts/test_cache_prune.py
          python3 -I .github/scripts/test_cli_coverage.py
      - if: inputs.base-sha != ''
        run: git fetch --no-tags --depth=1 origin "${{ inputs.base-sha }}"
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          llvm: build
          shell: bench
          cache: nix sccache
          cache-save: ${{ inputs.cache-write }}
          cache-scope: bundle
          sccache-size: 3G
      - name: Release ra-jit with both owned backends
        env:
          RUSTC_WRAPPER: ${{ steps.toolchain.outputs.rustc-wrapper }}
        run: nix develop .#bench --command cargo build --locked --release -p ra-jit --bins --features llvm
      - name: Bootstrap the owned macro runtime
        run: |
          nix develop .#bench --command python3 -I harness/dist/owned_macro_server.py \
            --blaze "$GITHUB_WORKSPACE/target/release/ra-jit" \
            --work "$RUNNER_TEMP/owned-runtime" --memory-mib 8192 --timeout 1800 \
            > "$RUNNER_TEMP/owned-runtime.log" 2>&1 || { tail -50 "$RUNNER_TEMP/owned-runtime.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/owned-runtime.log"
      - name: Test and build sets
        env:
          RUSTC_WRAPPER: ${{ steps.toolchain.outputs.rustc-wrapper }}
          # Nested Cargo workspaces must also put their artifacts under the bundle's target root.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py build \
            --platform "${{ inputs.platform }}" --base-sha "${{ inputs.base-sha }}" \
            --out "$RUNNER_TEMP/bundle-sets.json"
      - id: pack
        name: Pack and digest
        run: |
          command -v zstd > /dev/null || brew install zstd
          nix develop .#bench --command python3 -I .github/scripts/bundle.py pack \
            --platform "${{ inputs.platform }}" --sets-record "$RUNNER_TEMP/bundle-sets.json" \
            --out "$RUNNER_TEMP/bundle-out"
          ls -la "$RUNNER_TEMP/bundle-out"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ inputs.platform }}
          path: ${{ runner.temp }}/bundle-out
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      # The bootstrap's audit, kept as the C2 and server checks kept it before they stopped
      # bootstrapping their own (the bundle itself is kept 3 days).
      - name: Keep the owned runtime's bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owned-runtime-evidence-${{ inputs.platform }}
          path: |
            ${{ runner.temp }}/owned-runtime.log
            ${{ runner.temp }}/owned-runtime/image-pins.json
            ${{ runner.temp }}/owned-runtime/tool-controls.json
            ${{ runner.temp }}/owned-runtime/*.watchdog.json
            ${{ runner.temp }}/owned-runtime/*audit.json
            ${{ runner.temp }}/owned-runtime/*external-execs.json
            ${{ runner.temp }}/owned-runtime/*.exec
            ${{ runner.temp }}/owned-runtime/build.log
          if-no-files-found: warn
      # Even when the run is cancelled (a newer push to the pull request): what sccache holds
      # by then is as valid as a whole build's, and without it every run after a cancelled one
      # starts cold. On PR #32 a push cancelled the build after 29 minutes and nothing was kept.
      - name: Free build products before archiving sccache
        if: ${{ always() && inputs.cache-write }}
        run: |
          du -sh target vendor/proc-macro-srv/target "$RUNNER_TEMP/owned-runtime" "$RUNNER_TEMP/bundle-out" ~/.cache/toolchain-sccache || true
          # Consumers use the uploaded bundle; the bootstrap evidence has been uploaded too.
          rm -rf target vendor/proc-macro-srv/target "$RUNNER_TEMP/owned-runtime" "$RUNNER_TEMP/bundle-out"
          df -h "$GITHUB_WORKSPACE"
      - if: ${{ always() && inputs.cache-write }}
        uses: ./.github/actions/toolchain/save
        with:
          rustc-wrapper: ${{ steps.toolchain.outputs.rustc-wrapper }}
          key: ${{ steps.toolchain.outputs.sccache-key }}
          scope: ${{ steps.toolchain.outputs.sccache-scope }}
          hit: ${{ steps.toolchain.outputs.sccache-hit }}
