# The one entry point for a pull request's checks (docs/reports/CI-fork.md):
#
#   changes  which areas the diff touches (.github/ci/areas.json)
#   build    the bundle, once per platform (bundle.yaml): release ra-jit, the owned macro runtime,
#            the prebuilt test sets and bundle.json; macOS only when an area with macOS checks runs
#   checks   each area a workflow_call workflow that verifies and consumes the bundle and never
#            compiles: bundle-check.yaml, then each area's own (serve, dist, bench)
#   ci       whether everything that ran passed
#
# Workflows called from here run in this run, so they download the bundle artifacts directly;
# the digest each consumer verifies comes from the build job's outputs, a channel of its own.
name: pr

on:
  pull_request:
    branches: [dist/main, dist/c4-keys]
  push:
    branches: ["dist/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.areas.outputs.code }}
      macos: ${{ steps.areas.outputs.macos }}
      dist: ${{ steps.areas.outputs.dist }}
      serve: ${{ steps.areas.outputs.serve }}
      bench: ${{ steps.areas.outputs.bench }}
      nix: ${{ steps.areas.outputs.nix }}
    steps:
      - uses: actions/checkout@v7
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          files=
          case "$EVENT" in
            pull_request|push)
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq 'if (.files | length) >= 300 then "" else .files[].filename end') || files=;;
          esac
          echo "$files" | python3 -I .github/scripts/changes.py | tee -a "$GITHUB_OUTPUT"

  build-linux:
    name: build linux-x64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/bundle.yaml
    with:
      platform: linux-x64
      os: ubuntu-24.04
      base-sha: ${{ github.event.pull_request.base.sha }}
      cache-write: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/dist/') }}

  build-macos:
    name: build macos-arm64
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/bundle.yaml
    with:
      platform: macos-arm64
      os: macos-15
      base-sha: ${{ github.event.pull_request.base.sha }}
      cache-write: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/dist/') }}

  bundle-linux:
    name: check linux-x64
    needs: build-linux
    uses: ./.github/workflows/bundle-check.yaml
    with:
      platform: linux-x64
      os: ubuntu-24.04
      bundle-sha256: ${{ needs.build-linux.outputs.sha256 }}

  bundle-macos:
    name: check macos-arm64
    needs: build-macos
    uses: ./.github/workflows/bundle-check.yaml
    with:
      platform: macos-arm64
      os: macos-15
      bundle-sha256: ${{ needs.build-macos.outputs.sha256 }}

  serve:
    name: serve
    needs: [changes, build-linux, bundle-linux]
    if: needs.changes.outputs.serve == 'true'
    uses: ./.github/workflows/blaze-serve-review.yaml
    with:
      bundle-linux-x64-sha256: ${{ needs.build-linux.outputs.sha256 }}

  # Reusable job names gain a caller prefix; retain the original required context.
  server:
    name: server
    needs: [changes, serve]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.serve }}
          RESULT: ${{ needs.serve.result }}
        run: |
          test "$CHANGES" = success
          if [ "$SELECTED" = true ]; then
            test "$RESULT" = success
          else
            test "$SELECTED" = false
            test "$RESULT" = skipped
          fi

  # The distributed protocol's checks, once per platform: the protocol tests (Linux) and the C2
  # lanes, each job the list of lanes it runs. Linux fans out one lane per job; macOS packs the
  # seven into four jobs, which with the bundle check is the fork's five concurrent macOS jobs.
  dist-linux:
    name: dist linux-x64
    needs: [changes, build-linux]
    if: needs.changes.outputs.dist == 'true'
    uses: ./.github/workflows/blaze-dist-review.yaml
    with:
      platform: linux-x64
      os: ubuntu-24.04
      bundle-sha256: ${{ needs.build-linux.outputs.sha256 }}
      lanes: '["basic", "workspace", "commands", "profiles-native", "nested", "saved-cranelift", "saved-llvm"]'

  dist-macos:
    name: dist macos-arm64
    needs: [changes, build-macos]
    if: needs.changes.outputs.dist == 'true'
    uses: ./.github/workflows/blaze-dist-review.yaml
    with:
      platform: macos-arm64
      os: macos-15
      bundle-sha256: ${{ needs.build-macos.outputs.sha256 }}
      lanes: '["basic", "profiles-native", "commands", "workspace nested saved-cranelift saved-llvm"]'

  # The required contexts `C2 runtime (<os>)`, as before: every C2 lane of the platform and the
  # platform's own checks (bundle-check.yaml) passed, or the dist area was not selected.
  c2-linux:
    name: C2 runtime (ubuntu-24.04)
    needs: [changes, bundle-linux, dist-linux]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.dist }}
          PLATFORM: ${{ needs.bundle-linux.result }}
          RESULT: ${{ needs.dist-linux.result }}
        run: |
          test "$CHANGES" = success
          if [ "$SELECTED" = true ]; then
            test "$PLATFORM" = success
            test "$RESULT" = success
          else
            test "$SELECTED" = false
            test "$RESULT" = skipped
          fi

  c2-macos:
    name: C2 runtime (macos-15)
    needs: [changes, bundle-macos, dist-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.dist }}
          PLATFORM: ${{ needs.bundle-macos.result }}
          RESULT: ${{ needs.dist-macos.result }}
        run: |
          test "$CHANGES" = success
          if [ "$SELECTED" = true ]; then
            test "$PLATFORM" = success
            test "$RESULT" = success
          else
            test "$SELECTED" = false
            test "$RESULT" = skipped
          fi

  bench:
    name: bench
    needs: [changes, build-linux]
    if: needs.changes.outputs.bench == 'true'
    uses: ./.github/workflows/bench.yaml
    with:
      bundle-linux-x64-sha256: ${{ needs.build-linux.outputs.sha256 }}

  ci:
    name: ci
    needs: [changes, build-linux, build-macos, bundle-linux, bundle-macos, serve, server, dist-linux, dist-macos, c2-linux, c2-macos, bench]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null
