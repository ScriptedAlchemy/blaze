# The one entry point for a pull request's checks (docs/reports/CI-fork.md):
#
#   changes  which areas the diff touches (.github/ci/areas.json)
#   build    the bundle, once per platform (bundle.yaml): release ra-jit, the owned macro runtime,
#            the prebuilt test sets and bundle.json; macOS only when an area with macOS checks runs
#   checks   each area a workflow_call workflow that verifies and consumes the bundle and never
#            compiles: bundle-check.yaml now, the areas' own as they are converted
#   ci       whether everything that ran passed
#
# Workflows called from here run in this run, so they download the bundle artifacts directly;
# the digest each consumer verifies comes from the build job's outputs, a channel of its own.
name: pr

on:
  pull_request:
    branches: [dist/main, dist/c4-keys]
  push:
    branches: ["dist/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.areas.outputs.code }}
      macos: ${{ steps.areas.outputs.macos }}
      dist: ${{ steps.areas.outputs.dist }}
      serve: ${{ steps.areas.outputs.serve }}
      bench: ${{ steps.areas.outputs.bench }}
      nix: ${{ steps.areas.outputs.nix }}
    steps:
      - uses: actions/checkout@v7
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          files=
          case "$EVENT" in
            pull_request|push)
              files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq 'if (.files | length) >= 300 then "" else .files[].filename end') || files=;;
          esac
          echo "$files" | python3 -I .github/scripts/changes.py | tee -a "$GITHUB_OUTPUT"

  build-linux:
    name: build linux-x64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/bundle.yaml
    with:
      platform: linux-x64
      os: ubuntu-24.04
      base-sha: ${{ github.event.pull_request.base.sha }}
      cache-write: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/dist/') }}

  build-macos:
    name: build macos-arm64
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/bundle.yaml
    with:
      platform: macos-arm64
      os: macos-15
      base-sha: ${{ github.event.pull_request.base.sha }}
      cache-write: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/dist/') }}

  bundle-linux:
    name: check linux-x64
    needs: build-linux
    uses: ./.github/workflows/bundle-check.yaml
    with:
      platform: linux-x64
      os: ubuntu-24.04
      bundle-sha256: ${{ needs.build-linux.outputs.sha256 }}

  bundle-macos:
    name: check macos-arm64
    needs: build-macos
    uses: ./.github/workflows/bundle-check.yaml
    with:
      platform: macos-arm64
      os: macos-15
      bundle-sha256: ${{ needs.build-macos.outputs.sha256 }}

  ci:
    name: ci
    needs: [changes, build-linux, build-macos, bundle-linux, bundle-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null
