# Reproduce Mach-O unwind and symbol lookup behavior on the target platform.
# The Python parser tests alone cannot prove that nm, the linker, splice and
# _Unwind_Find_FDE agree on the location of a patched ra-jit function.
name: Mach-O unwind regressions
on:
  pull_request:
    paths:
      - harness/nocompact.py
      - harness/test_nocompact_symbols.py
      - .github/workflows/nocompact-macos.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nocompact-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  nocompact:
    name: nocompact (${{ matrix.backend }}, macos-arm64)
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    env:
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '0'
      RA_JIT_BACKEND: ${{ matrix.backend }}
      RA_JIT_OPT: '2'
      RA_JIT_EMIT: fast
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nocompact-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build ra-jit with Cranelift and LLVM
        run: nix develop --command cargo build -p ra-jit --release --features llvm --locked
      - name: Check symbol variants
        run: python3 -m unittest discover -s harness -p test_nocompact_symbols.py -v
      - name: Verify Mach-O unwind and edited-function frames
        run: RA_JIT_BIN="$GITHUB_WORKSPACE/target/release/ra-jit" python3 harness/nocompact.py
