name: cache server regressions

on:
  pull_request:
    branches: [dist/main]
    paths:
      - crates/blaze-serve/**
      - crates/blaze-wire/**
      - crates/ra-jit-store/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/blaze-serve-review.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serve-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          components: rustfmt
      - name: Check server formatting
        run: cargo fmt -p blaze-serve -- --check
      - name: Test the actual server, HTTP routes, and publication races
        if: ${{ !cancelled() }}
        run: cargo test --locked -p blaze-serve -- --test-threads=2
