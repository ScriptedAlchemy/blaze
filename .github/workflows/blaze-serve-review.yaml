name: cache server regressions

on:
  workflow_call:
    inputs:
      bundle-linux-x64-sha256:
        type: string
        required: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: "0"

defaults:
  run:
    shell: bash

jobs:
  server-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          components: rustfmt
          llvm: build
          shell: bench
      - uses: ./.github/actions/bundle
        with:
          platform: linux-x64
          sha256: ${{ inputs.bundle-linux-x64-sha256 }}
      - name: Prove a changed test executable is rejected
        run: |
          python3 - <<'PYNEGATIVE'
          import json, os, subprocess, sys
          from pathlib import Path
          manifest = json.loads(Path(os.environ["BLAZE_BUNDLE"]).read_text())
          executable = Path(manifest["sets"]["serve-server"]["runs"][0]["exe"])
          with executable.open("r+b") as binary:
              original = binary.read(1)
              assert original, "empty server test executable"
              binary.seek(0)
              binary.write(bytes([original[0] ^ 1]))
          try:
              result = subprocess.run([sys.executable, "-I", ".github/scripts/bundle.py",
                                       "test", "serve-server", "--", "--list"],
                                      capture_output=True, text=True)
              print(result.stdout + result.stderr)
              assert result.returncode != 0, "corrupted test executable was accepted"
              assert "changed since it was unpacked" in result.stdout + result.stderr, result
              print(f"Negative control: corrupted executable rejected with exit {result.returncode}")
          finally:
              with executable.open("r+b") as binary:
                  binary.write(original)
          PYNEGATIVE
      - name: Check server formatting
        run: cargo fmt -p blaze-serve -- --check
      - name: Test the actual server, HTTP routes, and publication races
        if: ${{ !cancelled() }}
        run: nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-server -- --test-threads=2
      - name: Test remote clients and fetch recovery
        if: ${{ !cancelled() }}
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cli -- remote:: --test-threads=2
      - name: Test compiler project and replay profile integration
        if: ${{ !cancelled() }}
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-project -- --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cli -- cargo::spec:: --test-threads=2
          python3 -I harness/tracedecay_test.py
      - name: Test owned dependency resolution and Cargo lock parity
        if: ${{ !cancelled() }}
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-resolve -- --test-threads=2
          python3 crates/blaze-metadata/tests/cargo_oracle.py "$PWD/target/debug/examples/metadata"
      - name: Test cleanup control flow with debug assertions
        if: ${{ !cancelled() }}
        run: nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-codegen -- fills_normal_block --test-threads=2
      - name: Test owned compiler answers and empty-crate proofs
        if: ${{ !cancelled() }}
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-syntax -- empty_crate:: --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cli -- answers:: --test-threads=2
      - name: Verify real probe artifacts with rustc and LLVM
        if: ${{ !cancelled() }}
        run: |
          python3 -I harness/dist/empty_probe.py --blaze target/release/ra-jit --work target/empty-probe-review
      - name: Test compiler acceptance and constant evaluation
        if: ${{ !cancelled() }}
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-diagnostics -- compiler_acceptance_tests --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-hir-ide -- tests::consteval --test-threads=2
      - name: Test producer identities and lifetime boundaries
        if: ${{ !cancelled() }}
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-proc-macro -- generation_tests producer_lifetime --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cli -- env_identity cargo::producer_image content::tests unreadable_trees --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cfg -- check_cfg --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cli -- compiler_json:: dep_info:: native_inputs::units::tests cargo::own_script::tests scripts::captured::tests process::tests --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-paths -- native:: --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-project -- compiler_project --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-hir-def -- non_unicode_process_environment unicode_crate_environment --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-wire -- native::tests --test-threads=2
          python3 -I harness/dist/crossmachine.py --self-test
      - name: Test bootstrap protocol wire compatibility
        if: ${{ !cancelled() }}
        run: nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-bootstrap -- --test-threads=2
      - name: Test build-script reruns and Cargo fingerprints
        if: ${{ !cancelled() }}
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cli -- cargo::script:: --test-threads=2
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cli -- cargo::records:: --test-threads=2
      - name: Save owned probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: owned-empty-probe
          path: |
            target/empty-probe-review/results.json
            target/empty-probe-review/*/*.log
          if-no-files-found: ignore
      - name: Test affected selection, retries, and native input identities
        if: ${{ !cancelled() }}
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cli -- cargo::affected:: cargo::sandboxed:: cargo::run:: native_inputs:: --test-threads=2
      - name: Test compiler export and import identities
        if: ${{ !cancelled() }}
        run: |
          nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-codegen -- export:: --test-threads=2
      - name: Check harness dispatch without services or credentials
        if: ${{ !cancelled() }}
        run: python3 -I harness/remote.py --selftest

  saved-spec:
    name: Saved source replay
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          components: rustfmt
          llvm: build
          shell: bench
      - uses: ./.github/actions/bundle
        with:
          platform: linux-x64
          sha256: ${{ inputs.bundle-linux-x64-sha256 }}
      - name: Execute saved source with compiler subprocesses blocked
        run: |
          mkdir -p "$RUNNER_TEMP/saved-spec-evidence"
          nix develop .#bench --command python3 -I harness/dist/saved_spec.py \
            --blaze "$GITHUB_WORKSPACE/target/release/ra-jit" \
            --work "$RUNNER_TEMP/saved-spec-review" --memory-mib 8192 --timeout 1200 \
            --owned-server "$RUNNER_TEMP/owned-runtime/blaze-proc-macro-srv" \
            --backend cranelift > "$RUNNER_TEMP/saved-spec-evidence/replay.log" 2>&1
      - name: Save immutable replay evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: saved-buildspec-execution
          path: |
            ${{ runner.temp }}/saved-spec-evidence
            ${{ runner.temp }}/saved-spec-review/results.json
            ${{ runner.temp }}/saved-spec-review/*.log
            ${{ runner.temp }}/saved-spec-review/*.exec
          if-no-files-found: warn

  server:
    needs: [server-tests, saved-spec]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every server and replay check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          assert not failed, failed
          PYGATE
