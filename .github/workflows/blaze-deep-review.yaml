name: Blaze deep repair verification
on:
  push:
    branches: [repair/blaze-runtime-20261031]
    paths: [.github/workflows/blaze-deep-review.yaml, '.github/repair/**']
permissions:
  contents: write
concurrency:
  group: blaze-deep-repair
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
        with:
          components: rustfmt
          llvm: none
      - name: Verify regressions and stage exact PR candidates
        run: python3 -I .github/repair/verify-deep.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blaze-deep-review
          path: |
            ${{ runner.temp }}/blaze-deep-review.bundle
            ${{ runner.temp }}/child-*.log
            ${{ runner.temp }}/child-verified.patch
            ${{ runner.temp }}/deep-receipt.json
            ${{ runner.temp }}/*-deep-checks.log
          retention-days: 1
          if-no-files-found: warn
