name: Blaze deep repair verification
on:
  push:
    branches: [repair/blaze-runtime-20261031]
    paths: [.github/workflows/blaze-deep-review.yaml, '.github/repair/**']
permissions:
  contents: write
concurrency:
  group: blaze-deep-repair
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
        with:
          components: rustfmt
          llvm: none
      - name: Compile and exercise the real child helper before and after the fix
        shell: bash
        run: |
          set -euo pipefail
          checked="$RUNNER_TEMP/child-reviewed"
          git worktree add --detach "$checked" 2d3292ec71b37e4dd9d50c3b4c7ad4bc8ea5465a
          git -C "$checked" apply "$GITHUB_WORKSPACE/.github/repair/deep-child.patch"
          (cd "$checked"; rustfmt --edition 2024 --config skip_children=true crates/ra-jit/src/child.rs crates/ra-jit/src/cargo/spec.rs)
          export CHECKED="$checked"
          python3 - <<'PY'
          import os, pathlib, subprocess, tomllib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          root = pathlib.Path(os.environ['CHECKED'])
          source = root / 'crates/ra-jit/src/child.rs'
          fixed = source.read_bytes()
          tests = fixed[fixed.index(b'#[cfg(all(test, unix))]'):]
          original = subprocess.check_output(['git', '-C', str(root), 'show', 'HEAD:crates/ra-jit/src/child.rs'])
          probe = temp / 'child-probe'
          (probe / 'src').mkdir(parents=True)
          version = next(p['version'] for p in tomllib.loads((root / 'Cargo.lock').read_text())['package'] if p['name'] == 'libc')
          (probe / 'Cargo.toml').write_text('[package]\nname="blaze-child-probe"\nversion="0.0.0"\nedition="2024"\n[workspace]\n[dependencies]\nlibc="=' + version + '"\n')
          (probe / 'src/lib.rs').write_text('#[path = "' + str(source) + '"]\nmod child;\n')
          command = ['cargo', 'test', '--manifest-path', str(probe / 'Cargo.toml')]
          try:
              source.write_bytes(original + b'\n' + tests)
              before = subprocess.run(command + ['child::tests::drains_output_while_sending_large_input', '--', '--exact', '--nocapture'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
              (temp / 'child-before.log').write_bytes(before.stdout)
              assert before.returncode != 0 and b'child input/output deadlocked' in before.stdout, before.stdout.decode(errors='replace')
          finally:
              source.write_bytes(fixed)
          after = subprocess.run(command + ['--', '--test-threads=1'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
          (temp / 'child-after.log').write_bytes(after.stdout)
          print(after.stdout.decode(errors='replace'))
          assert after.returncode == 0, 'patched child helper regressions failed'
          PY
          (cd "$checked"; rustfmt --edition 2024 --check --config skip_children=true crates/ra-jit/src/child.rs crates/ra-jit/src/cargo/spec.rs; git diff --check)
          git -C "$checked" config user.name 'Blaze repair'
          git -C "$checked" config user.email 'noreply@openai.com'
          git -C "$checked" add crates/ra-jit/src/child.rs crates/ra-jit/src/cargo/spec.rs
          git -C "$checked" diff --cached > "$RUNNER_TEMP/child-verified.patch"
          git -C "$checked" commit -m 'Drain compiler output while streaming private project input' -m 'Send stdin on a scoped writer while wait_with_output drains stdout and stderr. Reuse the SIGPIPE-safe helper for saved replay. A real subprocess regression deadlocks before the fix and passes afterward; verbose early rejection, successful early exit and default SIGPIPE are also covered.'
          git -C "$checked" rev-parse HEAD > "$RUNNER_TEMP/child-sha"
      - name: Integrate and verify both exact PR candidates
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          shared=$(cat "$RUNNER_TEMP/child-sha")
          ci="$RUNNER_TEMP/deep-ci"
          c2="$RUNNER_TEMP/deep-c2"
          git config user.name 'Blaze repair'
          git config user.email 'noreply@openai.com'
          git worktree add --detach "$ci" 89d814aa7e7102f8285697091a89de0b5d053f7c
          git -C "$ci" merge --no-ff "$shared" -m 'Merge verified compiler pipe repair into shared-build CI'
          python3 .github/repair/apply_deep_ci.py "$ci"
          git worktree add --detach "$c2" 937c36922a87ae1360ea10ca1e54b7f7aee92a1f
          git -C "$c2" merge --no-ff "$shared" -m 'Merge verified compiler pipe repair into saved replay'
          export CI_TREE="$ci" C2_TREE="$c2"
          python3 - <<'PY'
          import os, pathlib
          marker = '      - name: Test compiler export and import identities\n'
          commands = {
              'CI_TREE': 'nix develop .#bench --command python3 -I .github/scripts/bundle.py test serve-cli -- child:: --test-threads=2',
              'C2_TREE': 'cargo test --locked -p ra-jit --bin ra-jit -- child:: --test-threads=2',
          }
          for key, command in commands.items():
              file = pathlib.Path(os.environ[key]) / '.github/workflows/blaze-serve-review.yaml'
              text = file.read_text()
              assert text.count(marker) == 1, key
              step = '      - name: Test compiler subprocess input and output\n        if: ${{ !cancelled() }}\n        run: ' + command + '\n'
              file.write_text(text.replace(marker, step + marker))
          PY
          (cd "$ci"; for test in test_changes.py test_bundle_integrity.py test_bundle_transport.py test_bench_pair.py test_bench_verdict.py; do python3 -I ".github/scripts/$test"; done; python3 -I harness/dist/test_buildspec_cleanup.py; python3 -I harness/dist/test_check_nix_workflow.py; python3 -I harness/dist/test_saved_spec_nix_rpath.py; git diff --check) 2>&1 | tee "$RUNNER_TEMP/ci-deep-checks.log"
          (cd "$c2"; python3 -I harness/dist/test_buildspec_cleanup.py; python3 -I harness/dist/test_check_nix_workflow.py; python3 -I harness/dist/test_saved_spec_nix_rpath.py; git diff --check) 2>&1 | tee "$RUNNER_TEMP/c2-deep-checks.log"
          git -C "$ci" add .github/ci/areas.json .github/scripts .github/workflows/bench.yaml .github/workflows/pr.yaml .github/workflows/blaze-serve-review.yaml
          git -C "$ci" commit -m 'Fix CI coverage, benchmark verdicts and bundle transport fidelity' -m 'Include compiler dependencies and rename origins in runtime selection. Reject incomplete or duplicate benchmark evidence and abnormal process exits. Preserve removed Cargo environment variables, dereference packed hardlinks, drain valid tar padding and verify executable mode. Exercise the helper regressions before expensive builds and wire the compiler pipe tests into consumers.'
          git -C "$c2" add .github/workflows/blaze-serve-review.yaml
          git -C "$c2" commit -m 'Run compiler pipe regressions in the saved replay gate'
          ci_sha=$(git -C "$ci" rev-parse HEAD)
          c2_sha=$(git -C "$c2" rev-parse HEAD)
          git push origin "$ci_sha:refs/heads/repair/deep-ci-$GITHUB_RUN_ID" "$c2_sha:refs/heads/repair/deep-c2-$GITHUB_RUN_ID"
          printf '{"shared":"%s","ci":"%s","c2":"%s","ci_base":"89d814aa7e7102f8285697091a89de0b5d053f7c","c2_base":"937c36922a87ae1360ea10ca1e54b7f7aee92a1f"}\n' "$shared" "$ci_sha" "$c2_sha" > "$RUNNER_TEMP/deep-receipt.json"
          git update-ref refs/heads/snapshot-ci "$ci_sha"
          git update-ref refs/heads/snapshot-c2 "$c2_sha"
          git bundle create "$RUNNER_TEMP/blaze-deep-review.bundle" refs/heads/snapshot-ci refs/heads/snapshot-c2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blaze-deep-review
          path: |
            ${{ runner.temp }}/blaze-deep-review.bundle
            ${{ runner.temp }}/child-*.log
            ${{ runner.temp }}/child-verified.patch
            ${{ runner.temp }}/deep-receipt.json
            ${{ runner.temp }}/*-deep-checks.log
          retention-days: 1
          if-no-files-found: warn
