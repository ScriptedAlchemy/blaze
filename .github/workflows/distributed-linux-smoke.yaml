# Validation-only combined draft for .github/workflows/distributed-linux-smoke.yaml
# on validation/distributed-compile-audit-linux-smoke. Both arms and the candidate
# canonical smoke are pinned to the final reviewed immutable commit/tree pairs.
# Old production plus only the shared v5 control is already pinned separately.
# Canonical recipe: the source-compiler release build in blaze.yaml plus the exact
# canonical smoke/identity recipe retained in distributed-perf-artifact-smoke.yaml
# and successful runs 46057759000 / 46058783800. No benchmark or normal CI edits.
# Scope: causal native adapter proof and exact-tree canonical release smoke.
name: Publication causal native control and canonical release smoke
on:
  push:
    branches: [validation/distributed-compile-audit-linux-smoke]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "0"
  EXPECTED_TOOLCHAIN: nightly-2026-10-27
  CAUSAL_TEST: a_stale_cache_miss_after_publication_never_compiles_a_second_tail

jobs:
  native-control:
    name: ${{ matrix.source.arm }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source:
          - arm: old-production-plus-control
            commit: b27cf1f45e912e28b0ef75edf88020d374f0b0cb
            tree: 66c9087a8acd04e7dad9d2c64c823cab4f8cea7e
          - arm: new-production-plus-control
            commit: 089b5f009ab48241a0c0e0fdfc22d9b08edf9398
            tree: 659b50805f637c8b34414173b73848deae807f6a
    env:
      BLAZE_TESTS: verify
      SOURCE_JSON: ${{ toJSON(matrix.source) }}
      SOURCE_SHA: ${{ matrix.source.commit }}
      SOURCE_TREE: ${{ matrix.source.tree }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Require immutable snapshot identities
        timeout-minutes: 1
        run: |
          set -euo pipefail
          timeout 10s mkdir "$RUNNER_TEMP/publication-causal"
          timeout -k 5s 20s python3 - <<'PY'
          from dataclasses import asdict, dataclass
          import json, os, re
          from pathlib import Path
          @dataclass(frozen=True)
          class Source:
              arm: str
              commit: str
              tree: str
          source = Source(**json.loads(os.environ["SOURCE_JSON"]))
          receipt = asdict(source) | {key: os.environ[key] for key in (
              "WORKFLOW_REF", "WORKFLOW_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")}
          (Path(os.environ["RUNNER_TEMP"]) / "publication-causal/source.expected.json").write_text(
              json.dumps(receipt, indent=2) + "\n")
          assert source.arm in {"old-production-plus-control", "new-production-plus-control"}
          assert all(re.fullmatch(r"[0-9a-f]{40}", value) for value in (source.commit, source.tree)), \
              "Replace every immutable commit/tree placeholder before publishing this workflow"
          PY
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          ref: ${{ matrix.source.commit }}
          persist-credentials: false
      - name: Verify source and pinned nightly
        timeout-minutes: 1
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/publication-causal"
          test "$(timeout 10s uname -s -m)" = "Linux aarch64"
          source_sha=$(timeout 10s git rev-parse HEAD)
          source_tree=$(timeout 10s git rev-parse 'HEAD^{tree}')
          source_status=$(timeout 10s git status --porcelain --untracked-files=all)
          toolchain_pin=$(timeout 10s cat pins/toolchain)
          test "$source_sha" = "$SOURCE_SHA"
          test "$source_tree" = "$SOURCE_TREE"
          test -z "$source_status"
          test "$toolchain_pin" = "$EXPECTED_TOOLCHAIN"
          printf '%s\n%s\n' "$source_sha" "$source_tree" > "$evidence/source.before.txt"
          timeout 10s sha256sum Cargo.lock pins/toolchain crates/blaze-dist-local/tests/agent.rs \
            > "$evidence/source-files.sha256"
          timeout 10s uname -a > "$evidence/kernel.txt"
          timeout 10s cp pins/toolchain "$evidence/toolchain-pin.txt"
      - uses: ./.github/actions/locked-memory
        timeout-minutes: 2
      - name: Record existing runner memory and swap
        timeout-minutes: 1
        run: |
          set -euo pipefail
          timeout 10s swapon --show --bytes | timeout 10s tee "$RUNNER_TEMP/publication-causal/runner-swap.txt"
          timeout 10s free -b | timeout 10s tee "$RUNNER_TEMP/publication-causal/runner-memory.txt"
      - uses: ./.github/actions/reflink
        timeout-minutes: 10
      - name: Fresh stores and short native paths on the verified reflink filesystem
        timeout-minutes: 1
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/publication-causal"
          test "$(ulimit -l)" = unlimited
          timeout 10s prlimit --pid "$$" --memlock > "$evidence/locked-memory.txt"
          timeout -k 5s 20s python3 - <<'PY' > "$evidence/fresh-store.json"
          import json, os
          from pathlib import Path
          paths = [Path(os.environ["BLAZE_HOME"]) / "v2/store", Path(os.environ["CARGO_TARGET_DIR"])]
          for path in paths:
              assert path.is_dir() and all(p.is_dir() for p in path.rglob("*")), f"nonempty fresh store: {path}"
          print(json.dumps({"fresh": True, "paths": [str(p) for p in paths]}))
          PY
          test_temp="$RUNNER_TEMP/blaze-fs/publication-tmp"
          timeout 10s mkdir "$test_temp"
          short_temp=$(timeout 10s mktemp -d /tmp/pc.XXXXXX)
          timeout 10s sudo mount --bind "$test_temp" "$short_temp"
          store_device=$(timeout 10s stat -Lc %d "$BLAZE_HOME/v2/store")
          target_device=$(timeout 10s stat -Lc %d "$CARGO_TARGET_DIR")
          temp_device=$(timeout 10s stat -Lc %d "$short_temp")
          test "$temp_device" = "$store_device"
          test "$temp_device" = "$target_device"
          printf 'TMPDIR=%s\nstore_device=%s\ntarget_device=%s\ntemp_device=%s\n' \
            "$short_temp" "$store_device" "$target_device" "$temp_device" > "$evidence/native-filesystem.txt"
          timeout 10s findmnt -T "$short_temp" >> "$evidence/native-filesystem.txt"
          echo "TMPDIR=$short_temp" >> "$GITHUB_ENV"
      - uses: ./.github/actions/toolchain
        timeout-minutes: 15
      - name: Build only the native agent integration target with pinned Cargo
        timeout-minutes: 75
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/publication-causal"
          timeout 20s cargo "+$EXPECTED_TOOLCHAIN" --version --verbose > "$evidence/cargo-version.txt"
          timeout 20s rustc "+$EXPECTED_TOOLCHAIN" --version --verbose > "$evidence/rustc-version.txt"
          # This is distributed-core's existing 4200-second command bound. A build
          # failure never counts as the expected old-production test failure.
          set +e
          timeout -k 30s 4200s cargo "+$EXPECTED_TOOLCHAIN" test --release --locked \
            -p blaze-dist-local --test agent --no-run --message-format=json-render-diagnostics \
            > "$evidence/build.jsonl" 2> "$evidence/build.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence/build.exit"
          timeout 20s cat "$evidence/build.stderr"
          test "$status" -eq 0
      - name: Run once and require the exact causal receipt
        timeout-minutes: 4
        run: |
          set -euo pipefail
          timeout -k 5s 210s python3 - <<'PY'
          import datetime, hashlib, json, os, re, subprocess
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "publication-causal"
          source = json.loads((evidence / "source.expected.json").read_text())
          case = os.environ["CAUSAL_TEST"]
          marker = "stale cache miss invoked Reader::complete"
          old = source["arm"] == "old-production-plus-control"
          sha256 = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def git(*args):
              return subprocess.check_output(["git", *args], text=True, timeout=10).strip()
          messages = [json.loads(line) for line in (evidence / "build.jsonl").read_text().splitlines() if line]
          assert [m.get("success") for m in messages if m.get("reason") == "build-finished"] == [True]
          artifacts = [m for m in messages if m.get("reason") == "compiler-artifact"
              and m.get("target", {}).get("name") == "agent"
              and m["target"].get("kind") == ["test"]
              and m.get("profile", {}).get("test") is True and m.get("executable")]
          assert len(artifacts) == 1, "Cargo must identify exactly one integration executable"
          artifact = artifacts[0]
          target_source = Path(artifact["target"]["src_path"]).resolve()
          assert target_source == (Path.cwd() / "crates/blaze-dist-local/tests/agent.rs").resolve()
          binary = Path(artifact["executable"]).resolve(strict=True)
          assert binary.is_relative_to(Path(os.environ["CARGO_TARGET_DIR"]).resolve())
          (evidence / "compiler-artifact.json").write_text(json.dumps(artifact, indent=2) + "\n")
          before = sha256(binary)
          (evidence / "binary.before.sha256").write_text(f"{before}  {binary}\n")
          command = ["timeout", "-k", "5s", "120s", str(binary), case,
              "--exact", "--format", "pretty", "--color", "never"]
          (evidence / "native-command.json").write_text(json.dumps(command, indent=2) + "\n")
          started = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with (evidence / "native.log").open("wb") as log:
              status = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=False, timeout=135).returncode
          ended = datetime.datetime.now(datetime.timezone.utc).isoformat()
          (evidence / "native.exit").write_text(f"{status}\n")
          after = sha256(binary)
          (evidence / "binary.after.sha256").write_text(f"{after}  {binary}\n")
          actual_commit, actual_tree = git("rev-parse", "HEAD"), git("rev-parse", "HEAD^{tree}")
          dirty = git("status", "--porcelain", "--untracked-files=all")
          (evidence / "source.after.txt").write_text(f"{actual_commit}\n{actual_tree}\n{dirty}")
          log = (evidence / "native.log").read_text()
          print(log, end="")
          executed = re.findall(r"^test (\S+) \.\.\. (ok|FAILED|ignored[^\n]*)$", log, re.M)
          summaries = re.findall(r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; "
              r"(\d+) ignored; (\d+) measured; (\d+) filtered out; finished in ([\d.]+)s$", log, re.M)
          expected_summary = ("FAILED", "0", "1", "0", "0") if old else ("ok", "1", "0", "0", "0")
          panic_threads = re.findall(r"^thread '([^']+)'(?: \([^\n)]*\))? panicked at ", log, re.M)
          assertion = re.search(r"assertion `left == right` failed: " + re.escape(marker)
              + r"\n[ \t]*left: 1\n[ \t]*right: 0(?:\n|$)", log)
          checks = {
              "native_exit": status == (101 if old else 0),
              "one_test_started": re.findall(r"^running (\d+) tests?$", log, re.M) == ["1"],
              "exact_test_executed": executed == [(case, "FAILED" if old else "ok")],
              "complete_suite_receipt": len(summaries) == 1 and summaries[0][:5] == expected_summary,
              "binary_unchanged": before == after,
              "source_unchanged": (actual_commit, actual_tree, dirty) == (source["commit"], source["tree"], ""),
          }
          if old:
              checks |= {
                  "exact_assertion": bool(assertion) and log.count(marker) == 1,
                  "only_expected_panic": panic_threads == [case],
                  "named_failure_block": log.count(f"---- {case} stdout ----") == 1,
                  "only_expected_failure": "\nfailures:\n" in log and
                      log.rsplit("\nfailures:\n", 1)[1].split("\ntest result:", 1)[0].strip() == case,
              }
          else:
              checks |= {"no_panic_or_old_marker": not panic_threads and marker not in log}
          receipt = {
              "source": source, "test": case, "toolchain": os.environ["EXPECTED_TOOLCHAIN"],
              "rustc_version_sha256": sha256(evidence / "rustc-version.txt"),
              "binary": str(binary), "binary_sha256_before": before, "binary_sha256_after": after,
              "command": command, "started_utc": started, "ended_utc": ended, "exit_code": status,
              "executed_tests": executed, "suite_receipts": summaries,
              "expected_old_marker": marker if old else None, "checks": checks,
              "validation_passed": all(checks.values()),
              "scope": "causal native adapter proof; no latency or full-acceptance claim",
          }
          (evidence / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          assert receipt["validation_passed"], f"Rejected causal receipt: {[k for k, ok in checks.items() if not ok]}"
          PY
      - name: Retain complete source, build and executed-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: publication-causal-${{ matrix.source.arm }}
          path: ${{ runner.temp }}/publication-causal
          if-no-files-found: error

  paired-verdict:
    name: Require both causal native outcomes
    needs: native-control
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          pattern: publication-causal-*
          path: causal-evidence
      - name: Refuse a missing, mismatched or incomplete arm
        timeout-minutes: 1
        env:
          MATRIX_RESULT: ${{ needs.native-control.result }}
        run: |
          set -euo pipefail
          timeout -k 5s 30s python3 - <<'PY'
          import json, os
          from pathlib import Path
          arms = ("old-production-plus-control", "new-production-plus-control")
          receipts = [json.loads((Path("causal-evidence") / f"publication-causal-{arm}" / "receipt.json").read_text())
              for arm in arms]
          assert os.environ["MATRIX_RESULT"] == "success"
          for arm, receipt in zip(arms, receipts, strict=True):
              assert receipt["validation_passed"] and all(receipt["checks"].values())
              assert receipt["source"]["arm"] == arm and receipt["test"] == os.environ["CAUSAL_TEST"]
              assert receipt["source"]["GITHUB_RUN_ID"] == os.environ["GITHUB_RUN_ID"]
              assert receipt["source"]["GITHUB_RUN_ATTEMPT"] == os.environ["GITHUB_RUN_ATTEMPT"]
              assert receipt["toolchain"] == os.environ["EXPECTED_TOOLCHAIN"]
          old, new = receipts
          assert old["exit_code"] == 101 and new["exit_code"] == 0
          assert old["source"]["commit"] != new["source"]["commit"]
          assert old["source"]["tree"] != new["source"]["tree"]
          assert old["rustc_version_sha256"] == new["rustc_version_sha256"]
          assert old["source"]["WORKFLOW_SHA"] == new["source"]["WORKFLOW_SHA"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Native causal control verified\n\n"
                  "The exact stale-initial-404 test failed on old production with the required Reader::complete "
                  "counter assertion (1 instead of 0), and passed on new production. Each arm executed once "
                  "on a fresh hosted ARM64 runner with the same pinned nightly and unchanged test deadlines. "
                  "This is causal native adapter evidence, not latency evidence or full acceptance.\n")
              for receipt in receipts:
                  source = receipt["source"]
                  summary.write(f"\n- {source['arm']}: commit `{source['commit']}`, tree `{source['tree']}`, "
                      f"binary SHA-256 `{receipt['binary_sha256_before']}`.\n")
          PY

  canonical-release-smoke:
    name: Exact-tree candidate canonical release smoke
    # Independent of the causal matrix; retain the source-compiler's existing job bound.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      AUDIT_SOURCE_SHA: 089b5f009ab48241a0c0e0fdfc22d9b08edf9398
      AUDIT_SOURCE_TREE: 659b50805f637c8b34414173b73848deae807f6a
    steps:
      - name: Require the final immutable candidate identity
        timeout-minutes: 1
        run: |
          set -euo pipefail
          [[ "$AUDIT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AUDIT_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          ref: ${{ env.AUDIT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        timeout-minutes: 5
        with:
          python-version: "3.13"
      - name: Record and verify the clean source, pinned nightly and host
        timeout-minutes: 2
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          timeout 10 mkdir "$evidence"
          test "$(timeout 10 uname -s -m)" = "Linux aarch64"
          source_sha=$(timeout 20 git rev-parse HEAD)
          source_tree=$(timeout 20 git rev-parse 'HEAD^{tree}')
          source_status=$(timeout 20 git status --porcelain --untracked-files=all)
          test "$source_sha" = "$AUDIT_SOURCE_SHA"
          test "$source_tree" = "$AUDIT_SOURCE_TREE"
          test -z "$source_status"
          test "$(timeout 10 cat pins/toolchain)" = "$EXPECTED_TOOLCHAIN"
          printf '%s\n%s\n' "$source_sha" "$source_tree" > "$evidence/source.txt"
          printf 'workflow_ref=%s\nworkflow_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            '${{ github.workflow_ref }}' '${{ github.workflow_sha }}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$evidence/validation.txt"
          timeout 10 cp pins/toolchain "$evidence/toolchain-pin.txt"
          timeout 10 sha256sum Cargo.lock pins/toolchain pins/llvm.json scripts/src/bin/smoke.rs \
            .github/scripts/dist_build_identity.py > "$evidence/source-files.sha256"
          timeout 10 uname -a > "$evidence/kernel.txt"
          timeout 10 lscpu > "$evidence/cpu.txt"
          timeout 10 free -b > "$evidence/memory-before.txt"
          timeout 10 swapon --show --bytes > "$evidence/swap-before.txt"
      - uses: ./.github/actions/locked-memory
        timeout-minutes: 2
      - uses: ./.github/actions/reflink
        timeout-minutes: 15
      - name: Keep smoke homes short on the verified reflink filesystem
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test_temp="$RUNNER_TEMP/blaze-fs/tmp"
          timeout 10 mkdir "$test_temp"
          short_temp=$(timeout 10 mktemp -d /tmp/bz.XXXXXX)
          timeout 10 sudo mount --bind "$test_temp" "$short_temp"
          store_device=$(timeout 10 stat -Lc %d "$BLAZE_HOME/v2/store")
          target_device=$(timeout 10 stat -Lc %d "$CARGO_TARGET_DIR")
          temp_device=$(timeout 10 stat -Lc %d "$short_temp")
          test "$temp_device" = "$store_device"
          test "$temp_device" = "$target_device"
          printf 'TMPDIR=%s\nsmoke_work=%s/smoke\nstore_device=%s\ntarget_device=%s\ntemp_device=%s\n' \
            "$short_temp" "$short_temp" "$store_device" "$target_device" "$temp_device" \
            > "$RUNNER_TEMP/canonical-evidence/native-filesystem.txt"
          timeout 10 findmnt -T "$short_temp" >> "$RUNNER_TEMP/canonical-evidence/native-filesystem.txt"
          timeout 10 prlimit --pid "$$" --memlock > "$RUNNER_TEMP/canonical-evidence/locked-memory.txt"
          test "$(ulimit -l)" = unlimited
          echo "TMPDIR=$short_temp" >> "$GITHUB_ENV"
          echo "AUDIT_SMOKE_WORK=$short_temp/smoke" >> "$GITHUB_ENV"
      - uses: ./.github/actions/toolchain
        timeout-minutes: 15
      - uses: ./.github/actions/script
        timeout-minutes: 25
        with:
          job: source-compiler
      - uses: ./.github/actions/toolchain-shelf
        timeout-minutes: 42
      - name: Install the pinned LLVM for the source compiler release tier
        timeout-minutes: 12
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/pinned-llvm"
          input=$(timeout 10 jq -nc --arg prefix "$prefix" '{command:"fetch",target:"aarch64-unknown-linux-gnu",dir:$prefix}')
          timeout -k 15 600 python3 .github/scripts/llvm.py "$input"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Build and seal the exact release CLI, launcher and retained services
        id: source_build
        timeout-minutes: 95
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          tc=$(timeout 10 cat pins/toolchain)
          timeout 20 cargo +"$tc" --version --verbose > "$evidence/cargo-version.txt"
          timeout 20 rustc +"$tc" --version --verbose > "$evidence/rustc-version.txt"
          # Same release feature set and 5400-second bound as source-compiler.
          timeout -k 30 5400 cargo +"$tc" build --release --locked --bins \
            -p blaze-cli -p blaze-launcher -p blaze-dist-local -p blaze-serve --features blaze-cli/llvm \
            2>&1 | timeout 5450 tee "$evidence/build.log"
          binaries="$RUNNER_TEMP/source-binaries"
          timeout 10 mkdir "$binaries"
          for binary in blaze blaze-launcher blaze-fact-shim blaze-dist-local blaze-serve; do
            timeout 30 install -m 755 "$CARGO_TARGET_DIR/release/$binary" "$binaries/$binary"
          done
          timeout 60 sha256sum "$binaries"/* > "$evidence/binaries.before.txt"
          seal=$(timeout 10 jq -nc --arg bin "$binaries" '{command:"seal",binaries:$bin,services:true}')
          timeout 60 python3 .github/scripts/dist_build_identity.py "$seal" \
            2>&1 | timeout 70 tee "$evidence/build-identity.log"
          timeout 10 cp "$binaries/blaze-build.json" "$evidence/blaze-build.json"
          timeout 30 sha256sum "$evidence/blaze-build.json" > "$evidence/manifest-sha256.txt"
      - name: Run and verify the canonical exact-tree hello smoke
        id: smoke
        timeout-minutes: 11
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          timeout 10 cp "$BLAZE_SCRIPTS/KEY" "$evidence/script-cache-key.txt"
          timeout 30 sha256sum "$BLAZE_SCRIPTS/smoke" > "$evidence/smoke-script-sha256.txt"
          timeout 10 cmp "$evidence/blaze-build.json" "$RUNNER_TEMP/source-binaries/blaze-build.json"
          identity=$(timeout 10 jq -nc --arg bin "$RUNNER_TEMP/source-binaries" \
            '{command:"verify",binaries:$bin,services:true}')
          timeout 60 python3 .github/scripts/dist_build_identity.py "$identity" \
            2>&1 | timeout 70 tee "$evidence/identity-before-smoke.log"
          input=$(timeout 10 jq -nc --arg blaze "$RUNNER_TEMP/source-binaries/blaze" \
            --arg work "$AUDIT_SMOKE_WORK" '{blaze:$blaze,work:$work}')
          timeout -k 20 480 "$BLAZE_SCRIPTS/smoke" "$input" \
            2>&1 | timeout 510 tee "$evidence/hello-smoke.txt"
          verify=$(timeout 10 jq -nc --rawfile quote "$evidence/hello-smoke.txt" \
            --arg tree "$AUDIT_SOURCE_TREE" '{verify:{quote:$quote,tree:$tree}}')
          timeout -k 5 30 "$BLAZE_SCRIPTS/smoke" "$verify" \
            2>&1 | timeout 40 tee "$evidence/hello-smoke-verify.txt"
          expected_binary=$(timeout 10 jq -er '.binaries.blaze' "$evidence/blaze-build.json")
          quote_binary=$(timeout 10 awk '$1 == "binary" { print $2 }' "$evidence/hello-smoke.txt")
          test "$quote_binary" = "$expected_binary"
          printf 'quote_binary_sha256=%s\noriginal_manifest_match=true\n' "$quote_binary" \
            > "$evidence/quote-identity.txt"
      - name: Verify the unchanged candidate source and sealed binaries after smoke
        if: ${{ !cancelled() && steps.source_build.outcome == 'success' && steps.smoke.outcome != 'skipped' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          timeout 10 cmp "$evidence/blaze-build.json" "$RUNNER_TEMP/source-binaries/blaze-build.json"
          identity=$(timeout 10 jq -nc --arg bin "$RUNNER_TEMP/source-binaries" \
            '{command:"verify",binaries:$bin,services:true}')
          timeout 60 python3 .github/scripts/dist_build_identity.py "$identity" \
            2>&1 | timeout 70 tee "$evidence/identity-after-smoke.log"
          test "$(timeout 20 git rev-parse HEAD)" = "$AUDIT_SOURCE_SHA"
          test "$(timeout 20 git rev-parse 'HEAD^{tree}')" = "$AUDIT_SOURCE_TREE"
          source_status=$(timeout 20 git status --porcelain --untracked-files=all)
          test -z "$source_status"
          timeout 60 sha256sum -c "$evidence/binaries.before.txt" > "$evidence/binaries.after-verify.txt"
      - name: Retain the complete sealed build handoff
        if: ${{ !cancelled() && steps.source_build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout -k 5 120 tar -czf "$RUNNER_TEMP/source-binaries.tar.gz" -C "$RUNNER_TEMP/source-binaries" .
          timeout -k 5 120 tar -czf "$RUNNER_TEMP/source-toolchain.tar.gz" -C "$HOME/.blaze/v2" toolchain
          timeout 30 sha256sum "$RUNNER_TEMP/source-binaries.tar.gz" "$RUNNER_TEMP/source-toolchain.tar.gz" \
            > "$RUNNER_TEMP/canonical-evidence/archive-sha256.txt"
      - name: Collect complete quote, smoke logs and final source state
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          timeout 10 mkdir -p "$evidence"
          if [ -n "${AUDIT_SMOKE_WORK:-}" ] && [ -d "$AUDIT_SMOKE_WORK/logs" ]; then
            timeout 30 cp -a "$AUDIT_SMOKE_WORK/logs" "$evidence/smoke-logs"
          fi
          if [ -n "${AUDIT_SMOKE_WORK:-}" ] && [ -f "$AUDIT_SMOKE_WORK/quote.txt" ]; then
            timeout 10 cp "$AUDIT_SMOKE_WORK/quote.txt" "$evidence/quote.txt"
          fi
          timeout 10 free -b > "$evidence/memory-after.txt"
          timeout 10 swapon --show --bytes > "$evidence/swap-after.txt"
          timeout 20 git status --short > "$evidence/source-after.txt"
          timeout 20 git diff HEAD --binary > "$evidence/source-after.patch"
      - name: Keep canonical quote, build and shelf evidence
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: publication-canonical-release-smoke-arm64
          path: |
            ${{ runner.temp }}/canonical-evidence
            ${{ runner.temp }}/toolchain-cut
          if-no-files-found: error
          retention-days: 7
      - name: Keep the exact candidate release build artifact
        if: ${{ !cancelled() && steps.source_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: publication-candidate-source-compiler
          path: |
            ${{ runner.temp }}/source-binaries.tar.gz
            ${{ runner.temp }}/source-toolchain.tar.gz
          if-no-files-found: error
          retention-days: 7


