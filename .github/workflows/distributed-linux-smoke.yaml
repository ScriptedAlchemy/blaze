# Validation-only workflow for validation/distributed-compile-audit-linux-smoke.
# Candidate source: 56ce85fa0d8d6fd7a528aa82e90c1b04745c170b
# Candidate tree: d8c6fc4eeef20d90f715d648dbb0359892ac1644
# The historical old-compiler source, manifest and artifact pins stay frozen.
# Canonical recipe: the source-compiler release build in blaze.yaml plus the exact
# canonical smoke/identity recipe retained in distributed-perf-artifact-smoke.yaml
# and successful runs 46057759000 / 46058783800. No benchmark or normal CI edits.
# Scope: exact-tree canonical release smoke, all four native temporary-scope controls,
# and byte-identical old/new executable Drop controls. Earlier publication/source proof is retained.
# The historical compiler is a diagnostic control only; neither qualification replaces CI.
name: Final Cell fixture, native scopes and canonical qualification
on:
  push:
    branches: [validation/distributed-compile-audit-linux-smoke]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "0"
  EXPECTED_TOOLCHAIN: nightly-2026-10-27

jobs:
  canonical-release-smoke:
    name: Exact-tree candidate canonical release smoke
    # Retain the source-compiler's existing job bound.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      AUDIT_SOURCE_SHA: 56ce85fa0d8d6fd7a528aa82e90c1b04745c170b
      AUDIT_SOURCE_TREE: d8c6fc4eeef20d90f715d648dbb0359892ac1644
    steps:
      - name: Require the final immutable candidate identity
        timeout-minutes: 1
        run: |
          set -euo pipefail
          [[ "$AUDIT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AUDIT_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          ref: ${{ env.AUDIT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        timeout-minutes: 5
        with:
          python-version: "3.13"
      - name: Record and verify the clean source, pinned nightly and host
        timeout-minutes: 2
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          timeout 10 mkdir "$evidence"
          test "$(timeout 10 uname -s -m)" = "Linux aarch64"
          source_sha=$(timeout 20 git rev-parse HEAD)
          source_tree=$(timeout 20 git rev-parse 'HEAD^{tree}')
          source_status=$(timeout 20 git status --porcelain --untracked-files=all)
          test "$source_sha" = "$AUDIT_SOURCE_SHA"
          test "$source_tree" = "$AUDIT_SOURCE_TREE"
          test -z "$source_status"
          test "$(timeout 10 cat pins/toolchain)" = "$EXPECTED_TOOLCHAIN"
          printf '%s\n%s\n' "$source_sha" "$source_tree" > "$evidence/source.txt"
          printf 'workflow_ref=%s\nworkflow_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            '${{ github.workflow_ref }}' '${{ github.workflow_sha }}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$evidence/validation.txt"
          timeout 10 cp pins/toolchain "$evidence/toolchain-pin.txt"
          timeout 10 sha256sum Cargo.lock pins/toolchain pins/llvm.json scripts/src/bin/smoke.rs \
            .github/scripts/dist_build_identity.py > "$evidence/source-files.sha256"
          timeout 10 uname -a > "$evidence/kernel.txt"
          timeout 10 lscpu > "$evidence/cpu.txt"
          timeout 10 free -b > "$evidence/memory-before.txt"
          timeout 10 swapon --show --bytes > "$evidence/swap-before.txt"
      - uses: ./.github/actions/locked-memory
        timeout-minutes: 2
      - uses: ./.github/actions/reflink
        timeout-minutes: 15
      - name: Keep smoke homes short on the verified reflink filesystem
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test_temp="$RUNNER_TEMP/blaze-fs/tmp"
          timeout 10 mkdir "$test_temp"
          short_temp=$(timeout 10 mktemp -d /tmp/bz.XXXXXX)
          timeout 10 sudo mount --bind "$test_temp" "$short_temp"
          store_device=$(timeout 10 stat -Lc %d "$BLAZE_HOME/v2/store")
          target_device=$(timeout 10 stat -Lc %d "$CARGO_TARGET_DIR")
          temp_device=$(timeout 10 stat -Lc %d "$short_temp")
          test "$temp_device" = "$store_device"
          test "$temp_device" = "$target_device"
          printf 'TMPDIR=%s\nsmoke_work=%s/smoke\nstore_device=%s\ntarget_device=%s\ntemp_device=%s\n' \
            "$short_temp" "$short_temp" "$store_device" "$target_device" "$temp_device" \
            > "$RUNNER_TEMP/canonical-evidence/native-filesystem.txt"
          timeout 10 findmnt -T "$short_temp" >> "$RUNNER_TEMP/canonical-evidence/native-filesystem.txt"
          timeout 10 prlimit --pid "$$" --memlock > "$RUNNER_TEMP/canonical-evidence/locked-memory.txt"
          test "$(ulimit -l)" = unlimited
          echo "TMPDIR=$short_temp" >> "$GITHUB_ENV"
          echo "AUDIT_SMOKE_WORK=$short_temp/smoke" >> "$GITHUB_ENV"
      - uses: ./.github/actions/toolchain
        timeout-minutes: 15
      - uses: ./.github/actions/script
        timeout-minutes: 25
        with:
          job: source-compiler
      - uses: ./.github/actions/toolchain-shelf
        timeout-minutes: 42
      - name: Install the pinned LLVM for the source compiler release tier
        timeout-minutes: 12
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/pinned-llvm"
          input=$(timeout 10 jq -nc --arg prefix "$prefix" '{command:"fetch",target:"aarch64-unknown-linux-gnu",dir:$prefix}')
          timeout -k 15 600 python3 .github/scripts/llvm.py "$input"
          echo "LLVM_SYS_231_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Build and seal the exact release CLI, launcher and retained services
        id: source_build
        timeout-minutes: 95
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          tc=$(timeout 10 cat pins/toolchain)
          timeout 20 cargo +"$tc" --version --verbose > "$evidence/cargo-version.txt"
          timeout 20 rustc +"$tc" --version --verbose > "$evidence/rustc-version.txt"
          # Same release feature set and 5400-second bound as source-compiler.
          timeout -k 30 5400 cargo +"$tc" build --release --locked --bins \
            -p blaze-cli -p blaze-launcher -p blaze-dist-local -p blaze-serve --features blaze-cli/llvm \
            2>&1 | timeout 5450 tee "$evidence/build.log"
          binaries="$RUNNER_TEMP/source-binaries"
          timeout 10 mkdir "$binaries"
          for binary in blaze blaze-launcher blaze-fact-shim blaze-dist-local blaze-serve; do
            timeout 30 install -m 755 "$CARGO_TARGET_DIR/release/$binary" "$binaries/$binary"
          done
          timeout 60 sha256sum "$binaries"/* > "$evidence/binaries.before.txt"
          seal=$(timeout 10 jq -nc --arg bin "$binaries" '{command:"seal",binaries:$bin,services:true}')
          timeout 60 python3 .github/scripts/dist_build_identity.py "$seal" \
            2>&1 | timeout 70 tee "$evidence/build-identity.log"
          timeout 10 cp "$binaries/blaze-build.json" "$evidence/blaze-build.json"
          timeout 30 sha256sum "$evidence/blaze-build.json" > "$evidence/manifest-sha256.txt"
      - name: Run and verify the canonical exact-tree hello smoke
        id: smoke
        timeout-minutes: 11
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          timeout 10 cp "$BLAZE_SCRIPTS/KEY" "$evidence/script-cache-key.txt"
          timeout 30 sha256sum "$BLAZE_SCRIPTS/smoke" > "$evidence/smoke-script-sha256.txt"
          timeout 10 cmp "$evidence/blaze-build.json" "$RUNNER_TEMP/source-binaries/blaze-build.json"
          identity=$(timeout 10 jq -nc --arg bin "$RUNNER_TEMP/source-binaries" \
            '{command:"verify",binaries:$bin,services:true}')
          timeout 60 python3 .github/scripts/dist_build_identity.py "$identity" \
            2>&1 | timeout 70 tee "$evidence/identity-before-smoke.log"
          input=$(timeout 10 jq -nc --arg blaze "$RUNNER_TEMP/source-binaries/blaze" \
            --arg work "$AUDIT_SMOKE_WORK" '{blaze:$blaze,work:$work}')
          timeout -k 20 480 "$BLAZE_SCRIPTS/smoke" "$input" \
            2>&1 | timeout 510 tee "$evidence/hello-smoke.txt"
          verify=$(timeout 10 jq -nc --rawfile quote "$evidence/hello-smoke.txt" \
            --arg tree "$AUDIT_SOURCE_TREE" '{verify:{quote:$quote,tree:$tree}}')
          timeout -k 5 30 "$BLAZE_SCRIPTS/smoke" "$verify" \
            2>&1 | timeout 40 tee "$evidence/hello-smoke-verify.txt"
          expected_binary=$(timeout 10 jq -er '.binaries.blaze' "$evidence/blaze-build.json")
          quote_binary=$(timeout 10 awk '$1 == "binary" { print $2 }' "$evidence/hello-smoke.txt")
          test "$quote_binary" = "$expected_binary"
          printf 'quote_binary_sha256=%s\noriginal_manifest_match=true\n' "$quote_binary" \
            > "$evidence/quote-identity.txt"
      - name: Execute all four native temporary-scope controls once
        id: native_scopes
        timeout-minutes: 20
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          tc=$(timeout 10 cat pins/toolchain)
          test "$tc" = "$EXPECTED_TOOLCHAIN"
          # One unfiltered Cargo test invocation; retain the normal harness concurrency.
          set +e
          timeout -k 30 900 cargo +"$tc" test --release --locked -p blaze-ladder \
            --test front2_if_temporaries --message-format=json \
            2>&1 | timeout -k 5 950 tee "$evidence/native-temporary-scopes.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence/native-temporary-scopes.exit"
          timeout -k 5 60 python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "canonical-evidence"
          log = (evidence / "native-temporary-scopes.log").read_text()
          status = int((evidence / "native-temporary-scopes.exit").read_text())
          expected_tests = [
              "an_if_conditions_temporaries_die_by_edition",
              "lazy_boolean::lazy_boolean_operand_borrows_end_before_the_next_operand",
              "lazy_boolean::lazy_boolean_operand_scopes_preserve_genuinely_live_borrows",
              "lazy_boolean::lazy_boolean_operand_destructors_run_at_their_scope_boundaries",
          ]
          messages = []
          for line in log.splitlines():
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict):
                  messages.append(value)
          artifacts = [
              row for row in messages
              if row.get("reason") == "compiler-artifact"
              and row.get("target", {}).get("name") == "front2_if_temporaries"
              and row.get("target", {}).get("kind") == ["test"]
              and row.get("profile", {}).get("test") is True
              and row.get("executable")
          ]
          tests = re.findall(r"^test ([^\r\n]+?) \.\.\. (ok|FAILED|ignored[^\r\n]*)$", log, re.MULTILINE)
          summaries = re.findall(
              r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; "
              r"(\d+) measured; (\d+) filtered out; finished in [^\r\n]+$",
              log, re.MULTILINE,
          )
          source = (evidence / "source.txt").read_text().splitlines()
          checks = {
              "command_exit_zero": status == 0,
              "one_successful_cargo_build": [
                  row.get("success") for row in messages if row.get("reason") == "build-finished"
              ] == [True],
              "one_integration_executable": len(artifacts) == 1,
              "one_four_test_launch": re.findall(r"^running (\d+) tests$", log, re.MULTILINE) == ["4"],
              "exact_four_executed_tests": len(tests) == 4
                  and sorted(name for name, _ in tests) == sorted(expected_tests)
                  and all(outcome == "ok" for _, outcome in tests),
              "exact_four_test_summary": summaries == [("ok", "4", "0", "0", "0", "0")],
              "exact_source": source == [os.environ["AUDIT_SOURCE_SHA"], os.environ["AUDIT_SOURCE_TREE"]],
          }
          binary = None
          if len(artifacts) == 1:
              row = artifacts[0]
              executable = Path(row["executable"]).resolve(strict=True)
              target = Path(os.environ["CARGO_TARGET_DIR"]).resolve(strict=True)
              source_path = Path(row["target"]["src_path"]).resolve(strict=True)
              checks["executable_is_in_release_target"] = executable.is_relative_to(target / "release")
              checks["exact_target_source"] = source_path == (
                  Path.cwd() / "crates/blaze-ladder/tests/front2_if_temporaries.rs"
              ).resolve(strict=True)
              with executable.open("rb") as stream:
                  executable_sha256 = hashlib.file_digest(stream, "sha256").hexdigest()
              binary = {
                  "path": str(executable),
                  "sha256_after_test": executable_sha256,
                  "cargo_artifact": row,
              }
          paths = [
              "crates/blaze-ladder/tests/front2_if_temporaries.rs",
              "crates/blaze-ladder/tests/front2_if_temporaries/lazy_boolean.rs",
              "crates/blaze-cli/tests/ladder/front2/x-drop-13-lazy-booleans/src/case.rs",
          ]
          source_files = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
          checks["exact_shared_cell_case"] = source_files[paths[-1]] == (
              "b1d7a6e9d39e4e6acb90394197f4d7a049fc44f81157e6833558c96b57a03e03"
          )
          receipt = {
              "scope": "Four actual native temporary-scope controls; not a substitute for full CI.",
              "source": {"commit": source[0], "tree": source[1]},
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "toolchain": os.environ["EXPECTED_TOOLCHAIN"],
              "command": [
                  "cargo", "+" + os.environ["EXPECTED_TOOLCHAIN"], "test", "--release", "--locked",
                  "-p", "blaze-ladder", "--test", "front2_if_temporaries", "--message-format=json",
              ],
              "command_status": status, "command_budget_seconds": 900,
              "tests": tests, "summaries": summaries, "binary": binary,
              "source_files_sha256": source_files, "checks": checks,
              "validation_passed": all(checks.values()),
          }
          (evidence / "native-temporary-scopes.receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n"
          )
          if not receipt["validation_passed"]:
              raise SystemExit("Rejected native temporary-scope receipt: " + ", ".join(
                  name for name, passed in checks.items() if not passed
              ))
          print(json.dumps({
              "native_temporary_scopes": "passed", "ran": 4, "passed": 4,
              "source": receipt["source"], "binary_sha256_after_test": binary["sha256_after_test"],
          }))
          PY
      - name: Verify the unchanged candidate source and sealed binaries after smoke
        if: ${{ !cancelled() && steps.source_build.outcome == 'success' && steps.smoke.outcome != 'skipped' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          timeout 10 cmp "$evidence/blaze-build.json" "$RUNNER_TEMP/source-binaries/blaze-build.json"
          identity=$(timeout 10 jq -nc --arg bin "$RUNNER_TEMP/source-binaries" \
            '{command:"verify",binaries:$bin,services:true}')
          timeout 60 python3 .github/scripts/dist_build_identity.py "$identity" \
            2>&1 | timeout 70 tee "$evidence/identity-after-smoke.log"
          test "$(timeout 20 git rev-parse HEAD)" = "$AUDIT_SOURCE_SHA"
          test "$(timeout 20 git rev-parse 'HEAD^{tree}')" = "$AUDIT_SOURCE_TREE"
          source_status=$(timeout 20 git status --porcelain --untracked-files=all)
          test -z "$source_status"
          timeout 60 sha256sum -c "$evidence/binaries.before.txt" > "$evidence/binaries.after-verify.txt"
      - name: Retain the complete sealed build handoff
        if: ${{ !cancelled() && steps.source_build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout -k 5 120 tar -czf "$RUNNER_TEMP/source-binaries.tar.gz" -C "$RUNNER_TEMP/source-binaries" .
          timeout -k 5 120 tar -czf "$RUNNER_TEMP/source-toolchain.tar.gz" -C "$HOME/.blaze/v2" toolchain
          timeout 30 sha256sum "$RUNNER_TEMP/source-binaries.tar.gz" "$RUNNER_TEMP/source-toolchain.tar.gz" \
            > "$RUNNER_TEMP/canonical-evidence/archive-sha256.txt"
      - name: Collect complete quote, smoke logs and final source state
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-evidence"
          timeout 10 mkdir -p "$evidence"
          if [ -n "${AUDIT_SMOKE_WORK:-}" ] && [ -d "$AUDIT_SMOKE_WORK/logs" ]; then
            timeout 30 cp -a "$AUDIT_SMOKE_WORK/logs" "$evidence/smoke-logs"
          fi
          if [ -n "${AUDIT_SMOKE_WORK:-}" ] && [ -f "$AUDIT_SMOKE_WORK/quote.txt" ]; then
            timeout 10 cp "$AUDIT_SMOKE_WORK/quote.txt" "$evidence/quote.txt"
          fi
          timeout 10 free -b > "$evidence/memory-after.txt"
          timeout 10 swapon --show --bytes > "$evidence/swap-after.txt"
          timeout 20 git status --short > "$evidence/source-after.txt"
          timeout 20 git diff HEAD --binary > "$evidence/source-after.patch"
      - name: Keep canonical quote, build and shelf evidence
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: publication-canonical-release-smoke-arm64
          path: |
            ${{ runner.temp }}/canonical-evidence
            ${{ runner.temp }}/toolchain-cut
          if-no-files-found: error
          retention-days: 7
      - name: Keep the exact candidate release build artifact
        if: ${{ !cancelled() && steps.source_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: publication-candidate-source-compiler
          path: |
            ${{ runner.temp }}/source-binaries.tar.gz
            ${{ runner.temp }}/source-toolchain.tar.gz
          if-no-files-found: error
          retention-days: 7

  lazy-boolean-drop-candidate:
    name: Lazy Boolean executable Drop control (candidate)
    needs: canonical-release-smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      AUDIT_SOURCE_SHA: 56ce85fa0d8d6fd7a528aa82e90c1b04745c170b
      AUDIT_SOURCE_TREE: d8c6fc4eeef20d90f715d648dbb0359892ac1644
      FIXTURE_SOURCE_SHA: 56ce85fa0d8d6fd7a528aa82e90c1b04745c170b
      FIXTURE_SOURCE_TREE: d8c6fc4eeef20d90f715d648dbb0359892ac1644
      FIXTURE_PATH: crates/blaze-cli/tests/ladder/front2/x-drop-13-lazy-booleans
      FIXTURE_TREE: 4b03b33fce6afbd30b482474d3eccfee291b4d71
      FIXTURE_CASE_SHA256: b1d7a6e9d39e4e6acb90394197f4d7a049fc44f81157e6833558c96b57a03e03
      DROP_TEST: lazy_boolean_operand_drop_order
      DROP_ARM: candidate
      BLAZE_CORES: '2'
      BLAZE_DAEMON_MEMORY_GB: '2'
      BLAZE_TESTS: verify
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
    - uses: actions/checkout@v7
      timeout-minutes: 5
      with:
        ref: ${{ env.FIXTURE_SOURCE_SHA }}
        persist-credentials: false
    - uses: ./.github/actions/locked-memory
      timeout-minutes: 2
    - uses: ./.github/actions/reflink
      timeout-minutes: 15
    - uses: ./.github/actions/apt
      timeout-minutes: 15
      with:
        packages: strace bubblewrap
    - uses: ./.github/actions/toolchain
      timeout-minutes: 15
      with:
        components: rust-src
        targets: wasm32-wasip1
    - name: User namespaces for source test sandboxes
      timeout-minutes: 1
      run: |
        set -euo pipefail
        if [ "$(timeout 10s cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
          timeout 10s sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - name: Copy the exact tracked candidate fixture outside both compiler checkouts
      timeout-minutes: 2
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/lazy-drop-evidence"
        project="$RUNNER_TEMP/blaze-fs/lazy-boolean-fixture"
        timeout 10s mkdir "$evidence" "$project"
        test "$(timeout 10s uname -s -m)" = "Linux aarch64"
        test "$(timeout 20s git rev-parse HEAD)" = "$FIXTURE_SOURCE_SHA"
        test "$(timeout 20s git rev-parse 'HEAD^{tree}')" = "$FIXTURE_SOURCE_TREE"
        test -z "$(timeout 20s git status --porcelain --untracked-files=all)"
        test "$(timeout 10s git rev-parse "HEAD:$FIXTURE_PATH")" = "$FIXTURE_TREE"
        timeout 20s git ls-tree -r "HEAD:$FIXTURE_PATH" > "$evidence/fixture.git-tree.txt"
        timeout 20s git archive --format=tar "HEAD:$FIXTURE_PATH" > "$evidence/fixture.tar"
        timeout 20s tar -xf "$evidence/fixture.tar" -C "$project"
        timeout -k 5s 20s python3 - <<'PY'
        import hashlib, json, os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        evidence, project = root / "lazy-drop-evidence", root / "blaze-fs/lazy-boolean-fixture"
        files = {}
        for path in project.rglob("*"):
            assert not path.is_symlink(), f"fixture contains a symlink: {path}"
            if path.is_file():
                files[str(path.relative_to(project))] = hashlib.sha256(path.read_bytes()).hexdigest()
        assert set(files) == {"Cargo.toml", "expected", "src/main.rs", "src/case.rs"}
        assert files["src/case.rs"] == os.environ["FIXTURE_CASE_SHA256"]
        record = {
            "source": {"commit": os.environ["FIXTURE_SOURCE_SHA"], "tree": os.environ["FIXTURE_SOURCE_TREE"]},
            "path": os.environ["FIXTURE_PATH"], "fixture_tree": os.environ["FIXTURE_TREE"],
            "case_sha256": files["src/case.rs"], "file_sha256": files,
            "test": os.environ["DROP_TEST"], "project": str(project),
            "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "workflow_sha": os.environ["WORKFLOW_SHA"],
        }
        (evidence / "fixture.json").write_text(json.dumps(record, indent=2) + "\n")
        PY
        timeout 10s cp -a "$project" "$evidence/fixture-source"
        timeout 10s uname -a > "$evidence/kernel.txt"
        timeout 10s lscpu > "$evidence/cpu.txt"
    - name: Verify and record the compiler's pristine source checkout
      timeout-minutes: 2
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/lazy-drop-evidence"
        source_sha=$(timeout 20s git rev-parse HEAD)
        source_tree=$(timeout 20s git rev-parse 'HEAD^{tree}')
        source_status=$(timeout 20s git status --porcelain --untracked-files=all)
        test "$source_sha" = "$AUDIT_SOURCE_SHA"
        test "$source_tree" = "$AUDIT_SOURCE_TREE"
        test -z "$source_status"
        test "$(timeout 10s cat pins/toolchain)" = "$EXPECTED_TOOLCHAIN"
        printf '%s\n%s\n' "$source_sha" "$source_tree" > "$evidence/source.before.txt"
        timeout 10s sha256sum .github/scripts/dist_build_identity.py harness/v2/exec_observer.py \
          harness/v2/exec_observer_child.py > "$evidence/gate-source.sha256"
        printf 'arm=%s\nsource_sha=%s\nsource_tree=%s\n' "$DROP_ARM" "$source_sha" "$source_tree" > "$evidence/compiler-source.txt"
    - uses: actions/download-artifact@v8
      timeout-minutes: 10
      with:
        name: publication-candidate-source-compiler
        path: ${{ runner.temp }}/source-package
    - uses: actions/download-artifact@v8
      timeout-minutes: 10
      with:
        name: publication-canonical-release-smoke-arm64
        path: ${{ runner.temp }}/canonical-origin
    - name: Verify and retain the original sealed source compiler handoff
      id: handoff
      timeout-minutes: 10
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/lazy-drop-evidence"
        origin="$RUNNER_TEMP/canonical-origin/canonical-evidence"
        timeout 10s mkdir "$evidence/canonical-origin"
        for file in blaze-build.json manifest-sha256.txt archive-sha256.txt source.txt validation.txt \
          hello-smoke.txt hello-smoke-verify.txt quote-identity.txt; do
          timeout 10s cp "$origin/$file" "$evidence/canonical-origin/$file"
        done
        timeout -k 5s 120s python3 - <<'PY'
        import hashlib, json, os, re
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        evidence, package = root / "lazy-drop-evidence", root / "source-package"
        origin = evidence / "canonical-origin"
        expected = {}
        for line in (origin / "archive-sha256.txt").read_text().splitlines():
            digest, path = line.split(maxsplit=1)
            name = Path(path).name
            assert re.fullmatch(r"[0-9a-f]{64}", digest) and name not in expected
            expected[name] = digest
        assert set(expected) == {"source-binaries.tar.gz", "source-toolchain.tar.gz"}
        actual = {}
        for name in expected:
            with (package / name).open("rb") as archive:
                actual[name] = hashlib.file_digest(archive, "sha256").hexdigest()
        assert actual == expected, "downloaded archive differs from the same-run sealed handoff"
        source = (origin / "source.txt").read_text().splitlines()
        assert source == [os.environ["AUDIT_SOURCE_SHA"], os.environ["AUDIT_SOURCE_TREE"]]
        manifest_bytes = (origin / "blaze-build.json").read_bytes()
        manifest_sha256 = hashlib.sha256(manifest_bytes).hexdigest()
        assert (origin / "manifest-sha256.txt").read_text().split()[0] == manifest_sha256
        manifest = json.loads(manifest_bytes)
        assert manifest["source"] == {"commit": source[0], "tree": source[1]}
        validation = dict(line.split("=", 1) for line in (origin / "validation.txt").read_text().splitlines())
        assert validation["run_id"] == os.environ["GITHUB_RUN_ID"]
        assert validation["run_attempt"] == os.environ["GITHUB_RUN_ATTEMPT"]
        (evidence / "handoff-archives.json").write_text(json.dumps({
            "source": manifest["source"], "archive_sha256": actual,
            "manifest_sha256": manifest_sha256, "run_id": validation["run_id"],
            "run_attempt": validation["run_attempt"], "verified": True,
        }, indent=2) + "\n")
        PY
        timeout 10s mkdir "$RUNNER_TEMP/source-binaries" "$RUNNER_TEMP/source-shelf"
        timeout 10s mkdir -p "$HOME/.blaze/v2"
        timeout -k 5s 120s tar -xzf "$RUNNER_TEMP/source-package/source-binaries.tar.gz" -C "$RUNNER_TEMP/source-binaries"
        timeout -k 5s 120s tar -xzf "$RUNNER_TEMP/source-package/source-toolchain.tar.gz" -C "$HOME/.blaze/v2"
        # Keep the observer's shelf isolated from setup's HOME, as normal acceptance does.
        timeout -k 5s 120s tar -xzf "$RUNNER_TEMP/source-package/source-toolchain.tar.gz" -C "$RUNNER_TEMP/source-shelf"
        timeout 10s cmp "$origin/blaze-build.json" "$RUNNER_TEMP/source-binaries/blaze-build.json"
        timeout 10s cp "$RUNNER_TEMP/source-binaries/blaze-build.json" "$evidence/blaze-build.original.json"
        identity=$(timeout 10s jq -nc --arg bin "$RUNNER_TEMP/source-binaries" \
          '{command:"verify",binaries:$bin,services:true}')
        timeout 60s python3 .github/scripts/dist_build_identity.py "$identity" \
          2>&1 | timeout 70s tee "$evidence/identity-before-fixture.log"
        timeout 60s sha256sum "$RUNNER_TEMP/source-binaries"/* > "$evidence/binaries.before.sha256"
        test ! -e "$RUNNER_TEMP/blaze-fs/lazy-boolean-drop-home"
        test ! -L "$RUNNER_TEMP/blaze-fs/lazy-boolean-drop-home"
        test ! -e "$evidence/exec"
        test ! -L "$evidence/exec"
    - name: Execute the sole named test once and retain the actual observer exit
      id: observed
      if: ${{ !cancelled() && steps.handoff.outcome == 'success' }}
      timeout-minutes: 60
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/lazy-drop-evidence"
        timeout 60s python3 .github/scripts/dist_build_identity.py "{\"command\":\"verify\",\"binaries\":\"$RUNNER_TEMP/source-binaries\",\"services\":true}"
        timeout 10s jq -n --arg blaze "$RUNNER_TEMP/source-binaries/blaze" \
          --arg cwd "$RUNNER_TEMP/blaze-fs/lazy-boolean-fixture" \
          --arg home "$RUNNER_TEMP/blaze-fs/lazy-boolean-drop-home" \
          --arg out "$evidence/exec" --arg shelf "$RUNNER_TEMP/source-shelf/toolchain" --arg test "$DROP_TEST" \
          '{blaze:$blaze,cwd:$cwd,home:$home,out:$out,shelf:$shelf,command_seconds:900,reap_seconds:30,commands:[{name:"lazy-boolean-drop-order",args:["test","--view","json","--","--run-all","--format","json","--exact",$test]}]}' \
          > "$evidence/exec-input.json"
        # Same 900-second source-command and 3300-second outer bounds as focused fixtures.
        # The old arm is a required negative control: only the following receipt may accept its failure.
        set +e
        timeout -k 30 3300 python3 harness/v2/exec_observer.py "$evidence/exec-input.json" \
          > "$evidence/observer.stdout" 2> "$evidence/observer.stderr"
        status=$?
        set -e
        printf '%s\n' "$status" > "$evidence/observer.exit"
        timeout 20s cat "$evidence/observer.stdout" "$evidence/observer.stderr"
    - name: Verify unchanged compiler source and sealed executables after the fixture
      id: unchanged
      if: ${{ !cancelled() && steps.handoff.outcome == 'success' && steps.observed.outcome != 'skipped' }}
      timeout-minutes: 3
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/lazy-drop-evidence"
        source_sha=$(timeout 20s git rev-parse HEAD)
        source_tree=$(timeout 20s git rev-parse 'HEAD^{tree}')
        source_status=$(timeout 20s git status --porcelain --untracked-files=all)
        printf '%s\n%s\n%s' "$source_sha" "$source_tree" "$source_status" > "$evidence/source.after.txt"
        timeout 10s cp "$RUNNER_TEMP/source-binaries/blaze-build.json" "$evidence/blaze-build.after.json"
        timeout 60s sha256sum "$RUNNER_TEMP/source-binaries"/* > "$evidence/binaries.after.sha256"
        timeout 10s cmp "$evidence/blaze-build.original.json" "$evidence/blaze-build.after.json"
        timeout 60s sha256sum -c "$evidence/binaries.before.sha256" > "$evidence/binaries.after-verify.txt"
        test "$source_sha" = "$AUDIT_SOURCE_SHA"
        test "$source_tree" = "$AUDIT_SOURCE_TREE"
        test -z "$source_status"
        timeout 10s cmp "$evidence/source.before.txt" "$evidence/source.after.txt"
        identity=$(timeout 10s jq -nc --arg bin "$RUNNER_TEMP/source-binaries" \
          '{command:"verify",binaries:$bin,services:true}')
        timeout 60s python3 .github/scripts/dist_build_identity.py "$identity" \
          2>&1 | timeout 70s tee "$evidence/identity-after-fixture.log"
    - name: Require exactly one actual test outcome and the precise old/new result
      id: receipt
      if: ${{ !cancelled() && steps.observed.outcome == 'success' && steps.unchanged.outcome == 'success' }}
      timeout-minutes: 2
      run: |
        set -euo pipefail
        timeout -k 5s 30s python3 - <<'PY'
        import hashlib, json, os, re
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        evidence, project = root / "lazy-drop-evidence", root / "blaze-fs/lazy-boolean-fixture"
        out = evidence / "exec"
        fixture = json.loads((evidence / "fixture.json").read_text())
        manifest = json.loads((evidence / "blaze-build.original.json").read_text())
        given = json.loads((out / "input.json").read_text())
        result = json.loads((out / "result.json").read_text())
        supervisor = json.loads((out / "supervisor.json").read_text())
        status = int((evidence / "observer.exit").read_text())
        old = os.environ["DROP_ARM"] == "old-compiler"
        expected_status = 1 if old else 0
        scope = "linux-command-descendants-through-exit"
        name = "lazy-boolean-drop-order"
        args = ["test", "--view", "json", "--", "--run-all", "--format", "json", "--exact", os.environ["DROP_TEST"]]
        commands = supervisor.get("commands")
        if (status != expected_status or result.get("schema") != 2 or result.get("scope") != scope
                or result.get("command_status") != expected_status or result.get("returncode") != expected_status
                or result.get("passed") is not (not old)
                or result.get("environment", {}).get("BLAZE_NO_DAEMON") != "1"
                or supervisor.get("schema") != 2 or supervisor.get("scope") != scope
                or supervisor.get("complete") is not True or "stop" in supervisor
                or not isinstance(commands, list) or len(commands) != 1
                or set(commands[0]) != {"name", "pid", "returncode", "timed_out"}
                or commands[0]["name"] != name or type(commands[0]["pid"]) is not int or commands[0]["pid"] <= 0
                or commands[0]["returncode"] != expected_status or commands[0]["timed_out"] is not False
                or result.get("commands") != commands or not isinstance(result.get("trace"), dict)
                or given.get("commands") != [{"name": name, "args": args}]
                or given.get("command_seconds") != 900 or given.get("reap_seconds") != 30
                or Path(given["cwd"]) != project):
            raise SystemExit("missing exact named-test launch, exit and complete descendant evidence")
        if old and result.get("error") != "selected Blaze command failed with status 1":
            raise SystemExit("old compiler failed for an unrelated observer reason")
        if not old and "error" in result:
            raise SystemExit("candidate observer reported an error")
        if result.get("compiler") != {key: manifest["binaries"][key] for key in ("blaze", "blaze-launcher", "blaze-fact-shim")}:
            raise SystemExit("observed compiler differs from the original sealed manifest")
        rows = [json.loads(line) for line in (out / (name + ".log")).read_text().splitlines() if line.strip()]
        summaries = [row for row in rows if row.get("event") == "summary"]
        tests = [row for row in rows if row.get("event") == "test"]
        failed = [row for row in rows if row.get("event") == "failed"]
        if len(summaries) != 1 or len(tests) != 1:
            raise SystemExit("fixture did not produce exactly one test and one summary")
        summary, test = summaries[0], tests[0]
        path = test.get("path")
        # A single target uses its bare test path; package/target prefixes are only
        # added by test_drive::run when more than one suite is selected.
        if (path != os.environ["DROP_TEST"] or re.fullmatch(r"[0-9a-f]{64}", test.get("test") or "") is None
                or summary.get("result") != ("failed" if old else "ok") or summary.get("ran") != 1
                or summary.get("passed") != (0 if old else 1) or summary.get("failed") != (1 if old else 0)
                or any(summary.get(key, 0) != 0 for key in ("reused", "ignored", "benches_not_run", "filtered_out", "flaky", "not_built"))
                or test.get("outcome") != ("failed" if old else "passed") or test.get("ran_because") != "run_all"
                or test.get("basis") is not None or test.get("failure") != ("panicked" if old else None)):
            raise SystemExit("selected fixture test was not actually executed with the required outcome")
        expected_message = r"assertion `left == right` failed\n[ \t]*left: 1\n[ \t]*right: 0"
        if old:
            if (len(failed) != 1 or failed[0].get("test") != test.get("test") or failed[0].get("path") != path
                    or failed[0].get("ended") != "panicked" or failed[0].get("signal") is not None
                    or failed[0].get("after_ns") is not None or failed[0].get("refused") is not None
                    or failed[0].get("output_cut") != 0
                    or re.fullmatch(expected_message, failed[0].get("message") or "") is None
                    or (failed[0].get("output") or "").count("assertion `left == right` failed") != 1):
                raise SystemExit("old compiler did not reach the exact case::check assertion (1 instead of 0)")
        elif failed:
            raise SystemExit("candidate fixture contains an unexpected failure record")
        for name, digest in fixture["file_sha256"].items():
            if hashlib.sha256((project / name).read_bytes()).hexdigest() != digest:
                raise SystemExit(f"fixture source changed during execution: {name}")
        receipt = {
            "scope": "causal executable temporary-drop semantics; not performance or full-CI evidence",
            "arm": os.environ["DROP_ARM"], "fixture": fixture, "test": os.environ["DROP_TEST"],
            "source": manifest["source"], "compiler": result["compiler"],
            "manifest_sha256": hashlib.sha256((evidence / "blaze-build.original.json").read_bytes()).hexdigest(),
            "handoff": json.loads((evidence / "handoff-archives.json").read_text()),
            "command_args": args, "observer_status": status, "source_summary": summary,
            "test_record": test, "failure_record": failed[0] if old else None,
            "unchanged_identity": True, "validation_passed": True,
        }
        (evidence / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
        print(json.dumps({"arm": receipt["arm"], "test": receipt["test"], "validation_passed": True, "observer_status": status}))
        PY
    - name: Collect final source state even when qualification fails
      if: always()
      timeout-minutes: 2
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/lazy-drop-evidence"
        timeout 10s mkdir -p "$evidence"
        timeout 20s git status --porcelain --untracked-files=all > "$evidence/source.final.status"
        timeout 20s git diff HEAD --binary > "$evidence/source.final.patch"
        timeout 10s free -b > "$evidence/memory-after.txt"
    - name: Retain the complete original executable control evidence
      if: always()
      uses: actions/upload-artifact@v7
      timeout-minutes: 10
      with:
        name: publication-lazy-boolean-candidate
        path: ${{ runner.temp }}/lazy-drop-evidence
        if-no-files-found: error
        retention-days: 7
  lazy-boolean-drop-old-compiler:
