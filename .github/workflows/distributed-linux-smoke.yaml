# Validation-only: replace .github/workflows/distributed-linux-smoke.yaml on
# validation/distributed-compile-audit-linux-smoke. No compiler or test execution.
name: Source protocol evidence relay
on:
  push:
    branches:
      - validation/distributed-compile-audit-linux-smoke
permissions:
  actions: read
concurrency:
  group: source-protocol-evidence-relay-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  relay:
    name: Relay ${{ matrix.evidence.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        evidence:
          - label: baseline-original
            artifact: "15232658530"
            name: source-protocol-baseline-original
            bytes: "596541992"
            sha256: "5dbecdae871cbe105f0bfedef95bc3f97628a2b7df9495da5bb07fc5e8353e4f"
          - label: candidate-original
            artifact: "15232289580"
            name: source-protocol-candidate-original
            bytes: "599668911"
            sha256: "a5d0dd846e0c1f9c8c79c7f385bd0a828d118a66ab513b9b7d1492912315cefa"
          - label: baseline-serialized
            artifact: "15232473946"
            name: source-protocol-baseline-serialized
            bytes: "596514306"
            sha256: "0c81e43f24dff4fd43b9e13a0a723eb06b88c434f3a5efa58acd88d71d7b00e2"
          - label: candidate-serialized
            artifact: "15233690022"
            name: source-protocol-candidate-serialized
            bytes: "596766336"
            sha256: "dab9133837d79f0becf984d25ebab0515a15daa683f4cc48794e2a2e7cfdb8a2"
    env:
      RELAY_SOURCE_RUN: "46070408800"
      RELAY_SOURCE_HEAD: "13bc85b5351b197b797ab1ccdd5838b095173487"
      RELAY_SOURCE_BRANCH: validation/distributed-compile-audit-linux-smoke
      RELAY_LABEL: ${{ matrix.evidence.label }}
      RELAY_ARTIFACT_ID: ${{ matrix.evidence.artifact }}
      RELAY_ARTIFACT_NAME: ${{ matrix.evidence.name }}
      RELAY_ARTIFACT_BYTES: ${{ matrix.evidence.bytes }}
      RELAY_ARTIFACT_SHA256: ${{ matrix.evidence.sha256 }}
    steps:
      - name: Verify and retain the original run and artifact identities
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          timeout -k 5 90 python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "relay-details"
          metadata = root / "relay"
          metadata.mkdir(parents=True)
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "ScriptedAlchemy/blaze":
              raise SystemExit("unexpected relay repository")
          source_run = int(os.environ["RELAY_SOURCE_RUN"])
          artifact_id = int(os.environ["RELAY_ARTIFACT_ID"])
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          def get(path, filename):
              request = urllib.request.Request("https://api.github.com/repos/" + repo + path,
                                               headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read(4 * 1024 * 1024 + 1)
              if len(data) > 4 * 1024 * 1024:
                  raise SystemExit("metadata response exceeds 4 MiB")
              (metadata / filename).write_bytes(data)
              return json.loads(data)

          run = get(f"/actions/runs/{source_run}", "original-run.json")
          artifact = get(f"/actions/artifacts/{artifact_id}", "original-artifact.json")
          expected_digest = "sha256:" + os.environ["RELAY_ARTIFACT_SHA256"]
          checks = {
              "run_id": run["id"] == source_run,
              "run_head": run["head_sha"] == os.environ["RELAY_SOURCE_HEAD"],
              "run_branch": run["head_branch"] == os.environ["RELAY_SOURCE_BRANCH"],
              "run_terminal": run["status"] == "completed",
              "artifact_id": artifact["id"] == artifact_id,
              "artifact_name": artifact["name"] == os.environ["RELAY_ARTIFACT_NAME"],
              "artifact_size": artifact["size_in_bytes"] == int(os.environ["RELAY_ARTIFACT_BYTES"]),
              "artifact_digest": artifact["digest"] == expected_digest,
              "artifact_live": artifact["expired"] is False,
              "artifact_run": artifact["workflow_run"]["id"] == source_run,
              "artifact_head": artifact["workflow_run"]["head_sha"] == os.environ["RELAY_SOURCE_HEAD"],
          }
          handoff = {"schema": 1, "repository": repo, "label": os.environ["RELAY_LABEL"],
                     "source_run": source_run, "source_head": os.environ["RELAY_SOURCE_HEAD"],
                     "source_artifact": artifact_id, "source_artifact_digest": expected_digest,
                     "source_artifact_bytes": int(os.environ["RELAY_ARTIFACT_BYTES"]),
                     "relay_run": os.environ["GITHUB_RUN_ID"], "relay_head": os.environ["GITHUB_SHA"],
                     "checks": checks,
                     "purpose": "Evidence-only repackaging; no compiler or test execution."}
          (metadata / "handoff.json").write_text(json.dumps(handoff, indent=2) + "\n")
          if not all(checks.values()):
              raise SystemExit("original identity mismatch: " + repr(checks))
          print(json.dumps({"source_artifact": artifact_id, "digest": expected_digest,
                            "bytes": artifact["size_in_bytes"], "checks": "passed"}))
          PY
      - name: Download the immutable original artifact with digest enforcement
        id: original
        uses: actions/download-artifact@v8
        timeout-minutes: 15
        with:
          artifact-ids: ${{ env.RELAY_ARTIFACT_ID }}
          run-id: ${{ env.RELAY_SOURCE_RUN }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/relay-original
      - name: Retain raw evidence and split the exact compressed state bytes
        id: split
        timeout-minutes: 12
        run: |
          set -euo pipefail
          timeout -k 5 660 python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"])
          source = temporary / "relay-original"
          details = temporary / "relay-details"
          metadata = details / "relay"
          original = details / "original"
          original.mkdir()
          chunk_root = temporary / "relay-chunks"
          chunk_root.mkdir()
          state_name = "sequence/generated-state.tar.gz"
          state = source / state_name
          chunk_bytes = 256 * 1024 * 1024
          manifest = {"schema": 1, "label": os.environ["RELAY_LABEL"],
                      "source_artifact_id": int(os.environ["RELAY_ARTIFACT_ID"]),
                      "source_artifact_sha256": os.environ["RELAY_ARTIFACT_SHA256"],
                      "download_verification": "actions/download-artifact@v8, digest-mismatch:error",
                      "state_path_in_original": state_name, "chunk_limit_bytes": chunk_bytes,
                      "chunk_slots": 3, "chunks": [], "complete": False,
                      "scope": "Exact surviving-state archive bytes; no decompression or test execution. "
                               "Original archive completeness limitations remain unchanged."}
          rows = []
          try:
              for path in sorted(source.rglob("*")):
                  relative = path.relative_to(source)
                  if path.is_symlink():
                      raise RuntimeError("unexpected symlink in downloaded artifact: " + str(relative))
                  if path.is_dir():
                      (original / relative).mkdir(exist_ok=True)
                      continue
                  if not path.is_file():
                      raise RuntimeError("unexpected file kind: " + str(relative))
                  if relative.as_posix() == state_name:
                      continue
                  target = original / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
                  digest = hashlib.sha256()
                  with target.open("rb") as stream:
                      for data in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(data)
                  rows.append({"path": relative.as_posix(), "bytes": target.stat().st_size,
                               "sha256": digest.hexdigest()})
              with (metadata / "original-files.jsonl").open("w") as output:
                  for row in rows:
                      output.write(json.dumps(row, sort_keys=True) + "\n")
              if not state.is_file() or state.is_symlink():
                  raise RuntimeError("missing exact sequence state archive")
              state_bytes = state.stat().st_size
              if not 0 < state_bytes <= 3 * chunk_bytes:
                  raise RuntimeError(f"state archive requires more than three 256 MiB slots: {state_bytes}")
              recorded = json.loads((source / "sequence/generated-state.json").read_text())
              whole = hashlib.sha256()
              with state.open("rb") as stream:
                  for index in range(3):
                      if stream.tell() == state_bytes:
                          break
                      filename = f"generated-state.tar.gz.part{index:03d}"
                      directory = chunk_root / f"part-{index:03d}"
                      directory.mkdir()
                      part = directory / filename
                      digest = hashlib.sha256()
                      count = 0
                      with part.open("xb") as output:
                          while count < chunk_bytes:
                              data = stream.read(min(1024 * 1024, chunk_bytes - count))
                              if not data:
                                  break
                              output.write(data)
                              digest.update(data)
                              whole.update(data)
                              count += len(data)
                      manifest["chunks"].append({"index": index, "filename": filename,
                                                 "bytes": count, "sha256": digest.hexdigest(),
                                                 "artifact_name": "protocol-relay-" + os.environ["RELAY_LABEL"]
                                                                  + f"-state-{index:03d}"})
                  if stream.read(1):
                      raise RuntimeError("unconsumed state bytes after the bounded split")
              manifest["state_bytes"] = state_bytes
              manifest["state_sha256"] = whole.hexdigest()
              if sum(part["bytes"] for part in manifest["chunks"]) != state_bytes:
                  raise RuntimeError("split length mismatch")
              if recorded["archive_bytes"] != state_bytes or recorded["archive_sha256"] != whole.hexdigest():
                  raise RuntimeError("state bytes differ from the original generated-state receipt")
              manifest["complete"] = True
              manifest["reconstruction"] = (
                  "Verify each downloaded part's bytes and SHA-256, concatenate parts by ascending index, "
                  "then verify state_bytes and state_sha256 before inspecting the archive. "
                  "The reconstructed file is the exact original sequence/generated-state.tar.gz; "
                  "it is not the original GitHub ZIP.")
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
                  output.write(f"chunks={len(manifest['chunks'])}\n")
              print(json.dumps({"label": os.environ["RELAY_LABEL"], "state_bytes": state_bytes,
                                "state_sha256": whole.hexdigest(), "chunks": len(manifest["chunks"]),
                                "raw_files": len(rows), "raw_bytes": sum(row["bytes"] for row in rows)}))
          except BaseException as error:
              manifest["error"] = str(error)
              raise
          finally:
              (metadata / "reconstruction.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Package bounded raw logs, maps and original metadata
        if: always()
        timeout-minutes: 10
        run: |
          set -euo pipefail
          timeout -k 5 540 python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"])
          details = temporary / "relay-details"
          if not details.is_dir():
              raise SystemExit("no relay identity evidence was created")
          destination = temporary / "relay-raw-package"
          destination.mkdir()
          archive = destination / "raw-details.tar.gz"
          with tarfile.open(archive, "w:gz", compresslevel=1) as output:
              output.add(details, arcname="details", recursive=True)
          size = archive.stat().st_size
          # One bounded file per GitHub artifact leaves ample ZIP-envelope headroom.
          if size > 384 * 1024 * 1024:
              archive.unlink()
              raise SystemExit(f"raw-details package exceeds the 384 MiB evidence cap: {size}")
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              for data in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(data)
          reconstruction = details / "relay/reconstruction.json"
          complete = reconstruction.is_file() and json.loads(reconstruction.read_text()).get("complete") is True
          receipt = {"schema": 1, "filename": archive.name, "bytes": size,
                     "sha256": digest.hexdigest(), "source_artifact_id": int(os.environ["RELAY_ARTIFACT_ID"]),
                     "source_artifact_sha256": os.environ["RELAY_ARTIFACT_SHA256"],
                     "relay_complete": complete,
                     "contains": "Original entries copied into details/original, excluding sequence/generated-state.tar.gz, "
                                 "plus separate relay identity and reconstruction metadata. "
                                 "The reconstruction complete flag and original-files inventory distinguish complete "
                                 "repackaging from partial evidence retained after a failed relay.",
                     "state_archive": "Download the separately named state chunks listed in details/relay/reconstruction.json."}
          (destination / "raw-details.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          PY
      - name: Upload raw diagnostic details
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: protocol-relay-${{ matrix.evidence.label }}-details
          path: ${{ runner.temp }}/relay-raw-package
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
      - name: Upload exact state bytes, part 000
        if: ${{ always() && steps.split.outcome == 'success' && fromJSON(steps.split.outputs.chunks || '0') >= 1 }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: protocol-relay-${{ matrix.evidence.label }}-state-000
          path: ${{ runner.temp }}/relay-chunks/part-000
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload exact state bytes, part 001
        if: ${{ always() && steps.split.outcome == 'success' && fromJSON(steps.split.outputs.chunks || '0') >= 2 }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: protocol-relay-${{ matrix.evidence.label }}-state-001
          path: ${{ runner.temp }}/relay-chunks/part-001
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload exact state bytes, part 002
        if: ${{ always() && steps.split.outcome == 'success' && fromJSON(steps.split.outputs.chunks || '0') >= 3 }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: protocol-relay-${{ matrix.evidence.label }}-state-002
          path: ${{ runner.temp }}/relay-chunks/part-002
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
