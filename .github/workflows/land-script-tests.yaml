name: Landing script repository regressions
on:
  pull_request:
    paths:
      - .github/scripts/land.py
      - .github/scripts/test_land.py
      - .github/workflows/land-script-tests.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify repository selection and scoped GitHub requests
        run: python3 -m unittest discover -s .github/scripts -p test_land.py -v
