name: Retire superseded holistic proof
on:
  push:
    branches: [verify/holistic-cache-20261031]
    paths: [.github/workflows/holistic-cleanup.yaml]
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Cancel only the redundant one-off proof, not any pull request run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=41253141721
          data=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
          test "$(jq -r .head_branch <<< "$data")" = verify/holistic-cache-20261031
          test "$(jq -r .head_sha <<< "$data")" = 38281e06e2ef93aed1aefe76679f60de4e011299
          test "$(jq -r .event <<< "$data")" = push
          status=$(jq -r .status <<< "$data")
          if [ "$status" != completed ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel"
          fi
          echo "Only the named temporary proof was retired; PR acceptance runs and frozen #34 are untouched."
