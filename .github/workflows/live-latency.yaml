# Save-to-running latency of live edits on macOS arm64, step by step (harness/live_latency.py).
# Runs on a push to a live-latency* branch, by hand, and every night on main. A main run
# proposes its measurements in a pull request, never pushes to protected main. Once merged,
# docs/benchmarks/history/macos-arm64-live.jsonl feeds the site's /bench chart. The run
# checks medians against prior history and reports out-of-band regressions.
name: live edit latency
on:
  push:
    branches: ["live-latency*"]
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      modes:
        description: "cargo, socket, burst, replay, restart, space separated"
        default: "socket burst replay"
      edits:
        description: edits timed per mode
        default: "10"
      rounds:
        description: rounds of replay's typing
        default: "1"

concurrency:
  group: live-latency-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

permissions:
  contents: read

jobs:
  latency:
    name: live edit latency, ${{ matrix.program }} (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        program: [probe, life, bevy, egui]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install 1.99.0 --profile minimal -c rust-src && rustup default 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: live-debug
      - run: cargo build --release -p ra-jit
      - name: time edits of a running program
        env:
          LATENCY_EDITS: ${{ inputs.edits || '10' }}
          LATENCY_ROUNDS: ${{ inputs.rounds || '1' }}
          # The file has what it ran on (commit, run, host, battery) for benchhistory.py live.
          LATENCY_JSON: ${{ runner.temp }}/latency.json
          RA_JIT_BENCH_MACHINE: GitHub macos-26 runner
          RA_JIT_IDLE_SECS: "0"
        run: RA_JIT_BIN="$GITHUB_WORKSPACE/target/release/ra-jit" python3 harness/live_latency.py --program ${{ matrix.program }} ${{ inputs.modes || 'socket burst replay' }}
      - name: what the workers said
        if: always()
        run: |
          for log in "$HOME"/.cache/ra-jit/workers/*/log "$HOME"/.cache/ra-jit/spares/*/log; do
            [ -f "$log" ] || continue
            echo "::group::$log (filtered)"
            grep -E "request:|timeline-us|apply-us|splice|steps:|asked:|edit-to-binary|link:|live:|panicked|error" "$log" | cut -c1-400 | tail -300 || true
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: latency-${{ matrix.program }}
          path: |
            ${{ runner.temp }}/latency.json
            ~/.cache/ra-jit/daemon.log
            ~/.cache/ra-jit/workers/*/log
            ~/.cache/ra-jit/spares/*/log
          if-no-files-found: warn

  history:
    name: history and regressions
    needs: latency
    # The programs that did run are recorded even when another failed.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      # Use the same bot identity for gh PR creation as for checkout/push.
      # The GITHUB_TOKEN fallback can leave new pull-request checks awaiting approval.
      GH_TOKEN: ${{ secrets.RA_JIT_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Use the existing bot token when available; publishing never targets main directly.
          token: ${{ secrets.RA_JIT_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: latency-*
          path: ${{ runner.temp }}/latency
      - name: History and regressions
        id: history
        run: |
          mapfile -t files < <(find "$RUNNER_TEMP/latency" -name latency.json)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no program wrote its latency"; exit 1; }
          python3 harness/benchhistory.py live "${files[@]}"
          # One runner's medians differ by up to twice between two rounds of the same binary
          # (#77): a number is judged once three runs before it show the runners' spread.
          if python3 harness/benchhistory.py check docs/benchmarks/history/macos-arm64-live.jsonl --least 3 --report "$RUNNER_TEMP/regressions.md"; then
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/regressions.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Propose benchmark history for merge
        run: bash .github/scripts/publish_live_history.sh
      - name: Open or update the regression issue
        if: steps.history.outputs.regressed == 'true'
        run: |
          available=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)
          if [ "$available" = true ]; then
            gh label create bench-regression --color B60205 --description "A benchmark median moved past its noise band" --force
            open=$(gh issue list --label bench-regression --state open --json number --jq '.[0].number // empty')
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file "$RUNNER_TEMP/regressions.md"
            else
              gh issue create --title "Live-edit latency regression at ${GITHUB_SHA::10}" --label bench-regression \
                --body-file "$RUNNER_TEMP/regressions.md"
            fi
          elif [ "$available" = false ]; then
            echo "::warning::Issues disabled for $GITHUB_REPOSITORY; regression details remain in the run summary"
          else
            echo "::warning::Unexpected Issues availability: $available; regression details remain in the run summary"
          fi
          echo "::error::live-edit latency regressed beyond its noise band: see the run summary"
          exit 1
