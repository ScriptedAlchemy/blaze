# Optional benchmark platforms run on standard GitHub-hosted images.
# Select platforms with BENCH_RUNNERS; results retain their actual host metadata.
name: bench-readme
on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "docs/**", "site/**"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write the README even when every number is within noise"
        type: boolean
        default: false
      full:
        description: "Also run each project's test suite, as the nightly run does"
        type: boolean
        default: false

# One run at a time on the machines. A push that comes during a run waits, and a newer push
# replaces it while it waits, so the queue never grows past one.
concurrency:
  group: bench-readme
  cancel-in-progress: false

# The workflow's own token only reads. The jobs on the benchmark machines get nothing more: a
# machine that builds what a pull request's code says has no business holding a write token. The
# publish job, on a GitHub-hosted runner, takes the writes it commits and opens the regression
# issue with.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # blaze's whole machine: no one sits at a CI runner (docs/cargo.md, "Cores and priority").
  BLAZE_CORES: all

jobs:
  platforms:
    name: selected benchmark platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          BENCH_RUNNERS: ${{ vars.BENCH_RUNNERS }}
          BENCH_RUNNER: ${{ vars.BENCH_RUNNER }}
        run: python3 harness/benchplatforms.py matrix

  bench:
    name: bench (real projects, ${{ matrix.name }})
    needs: platforms
    if: >-
      needs.platforms.outputs.any == 'true' &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.label }}
    permissions:
      contents: read
    timeout-minutes: 360
    env:
      BENCH_MACHINE: GitHub-hosted ${{ matrix.name }} (${{ matrix.label }})
      CARGO_TERM_COLOR: never
      # The nightly run, and a run by hand that asks, runs the projects' test suites too.
      FULL: ${{ github.event_name == 'schedule' || inputs.full || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/blaze
        with:
          job: bench-readme
          llvm: 'true'
          reflink: ${{ runner.os == 'Linux' && 'true' || 'false' }}
      # The native dependencies come from this shell; the selected Blaze builds the compiler.
      - uses: ./.github/actions/nix
      - name: Build blaze
        run: |
          bench_root=/tmp
          if [ "$RUNNER_OS" = Linux ]; then bench_root="$RUNNER_TEMP/blaze-fs"; fi
          export BENCH_HOME="$bench_root/bb-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$BENCH_HOME"
          echo "BENCH_HOME=$BENCH_HOME" >> "$GITHUB_ENV"
          echo "TMPDIR=$bench_root" >> "$GITHUB_ENV"
          stage0="$(command -v blaze)"
          CARGO_TARGET_DIR="$BENCH_HOME/compiler" nix develop .#bench -c "$stage0" build -p blaze-engine --release --locked
          "$stage0" stop
      - name: Bench
        id: bench
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          jq -n --arg blaze "$BENCH_HOME/compiler/release/blaze-engine" --arg work "$BENCH_HOME/work" \
            --arg sources "$BENCH_HOME/projects" --arg out "$RUNNER_TEMP/results/bench.json" \
            --arg commit "$GITHUB_SHA" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson tests "$FULL" --arg machine "$BENCH_MACHINE" \
            '{action:"run", blaze:$blaze, work:$work, sources:$sources, out:$out, commit:$commit, run_url:$run_url,
              projects:["ripgrep","fd","bat","hyperfine","just","axum","nushell","helix","bevy","biome"],
              backends:["cranelift","llvm"], runs:5, cold_runs:5, tests:$tests, machine:$machine}' > "$RUNNER_TEMP/bench-input.json"
          nix develop .#bench -c env -u CARGO_INCREMENTAL -u RUSTC_WRAPPER python3 harness/bench.py "$RUNNER_TEMP/bench-input.json" \
            || { status=$?; [ "$status" = 3 ] || exit "$status"; echo "wrong=true" >> "$GITHUB_OUTPUT"; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.slug }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
      - name: Fail on a wrong result
        if: steps.bench.outputs.wrong == 'true'
        run: |
          echo "::error::a Blaze build, program output, or test suite failed its oracle: see the Bench step and the tests table"
          exit 1

  # Every platform's results into the README, docs/benchmarks.md and the history, in one commit:
  # the platforms run at once, and one writer keeps their commits from racing.
  publish:
    name: README, history and regressions
    needs: [platforms, bench]
    if: >-
      always() && needs.platforms.outputs.any == 'true' &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      # To start the site's deploy after the history commit: a push by GITHUB_TOKEN starts no workflow.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The ruleset on main refuses a push from the workflow's own token: this one is allowed
          # past it (docs/harness.md, "CI").
          token: ${{ secrets.BLAZE_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/results
      - name: README and docs/benchmarks.md
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          # A result refused (a program that said something else) leaves its platform's numbers as they were.
          for result in "$RUNNER_TEMP"/results/bench-*/bench.json; do
            [ -f "$result" ] || continue
            echo "::group::$result"
            jq -n --arg result "$result" --argjson force "$FORCE" \
              '{action:"publish",result:$result,force:$force}' | python3 harness/benchreport.py - \
              || echo "::warning::$result was not published"
            echo "::endgroup::"
          done
      - name: History and regressions
        id: history
        run: |
          regressed=false
          : > "$RUNNER_TEMP/regressions.md"
          for result in "$RUNNER_TEMP"/results/bench-*/bench.json; do
            [ -f "$result" ] || continue
            slug=$(basename "$(dirname "$result")"); slug=${slug#bench-}
            jq -n --arg result "$result" --arg history "docs/benchmarks/history/$slug.jsonl" \
              '{action:"build",result:$result,history:$history}' | python3 harness/benchhistory.py -
            jq -n --arg history "docs/benchmarks/history/$slug.jsonl" --arg report "$RUNNER_TEMP/regressions-$slug.md" \
              '{action:"check",history:$history,report:$report}' | python3 harness/benchhistory.py - || regressed=true
            cat "$RUNNER_TEMP/regressions-$slug.md" >> "$RUNNER_TEMP/regressions.md"
          done
          echo "regressed=$regressed" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/regressions.md" >> "$GITHUB_STEP_SUMMARY"
      # The README's and docs/benchmarks.md's trend charts, from the history just appended to.
      - uses: ./.github/actions/nix
      - name: Trends
        run: python3 harness/benchcharts.py '{}'
      # Main may have moved during the run: bench_commit.py puts the commit on top, draws the
      # trends again from the history as it is then, and tries again.
      - name: Commit to main
        run: |
          python3 .github/scripts/bench_commit.py "$(printf '{"message": "bench: numbers for %s [skip ci]", "paths": ["README.md", "docs/benchmarks.md", "docs/benchmarks/"], "site": true}' "${GITHUB_SHA::10}")"
      - name: Open or update the regression issue
        if: steps.history.outputs.regressed == 'true'
        run: |
          gh label create bench-regression --color B60205 --description "A benchmark median moved past its noise band" --force
          open=$(gh issue list --label bench-regression --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/regressions.md"
          else
            gh issue create --title "Benchmark regression at ${GITHUB_SHA::10}" --label bench-regression \
              --body-file "$RUNNER_TEMP/regressions.md"
          fi
          echo "::error::a benchmark regressed beyond its noise band: see the run summary"
          exit 1
