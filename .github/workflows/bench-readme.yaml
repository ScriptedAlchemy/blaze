# Optional benchmark platforms run on standard GitHub-hosted images.
# Select platforms with BENCH_RUNNERS; results retain their actual host metadata.
name: bench-readme
on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "CHANGELOG.md", "docs/**", "site/**"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write the README even when every number is within noise"
        type: boolean
        default: false
      full:
        description: "Also time the other setups (cg_clif, mold, wild, -Zthreads, cargo check) and run the test suites, as the nightly run does"
        type: boolean
        default: false

# One run at a time on the machines. A push that comes during a run waits, and a newer push
# replaces it while it waits, so the queue never grows past one.
concurrency:
  group: bench-readme
  cancel-in-progress: false

# The workflow's own token only reads. The jobs on the benchmark machines get nothing more: a
# machine that builds what a pull request's code says has no business holding a write token. The
# publish job, on a GitHub-hosted runner, takes the writes it commits and opens the regression
# issue with.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  platforms:
    name: selected benchmark platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          BENCH_RUNNERS: ${{ vars.BENCH_RUNNERS }}
          BENCH_RUNNER: ${{ vars.BENCH_RUNNER }}
        run: python3 harness/benchplatforms.py matrix

  bench:
    name: bench (real projects, ${{ matrix.name }})
    needs: platforms
    if: >-
      needs.platforms.outputs.any == 'true' &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.label }}
    permissions:
      contents: read
    timeout-minutes: 360
    env:
      # Share benchmark state between steps within this hosted job.
      BENCH_HOME: ${{ github.workspace }}/../bench-state
      # macOS: the daemon's socket path has to fit in 104 bytes, so the work is under /tmp.
      BENCH_WORK: ${{ matrix.work }}
      CARGO_TERM_COLOR: never
      # The nightly run, and a run by hand that asks, compares with the other setups too.
      FULL: ${{ github.event_name == 'schedule' || inputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The Cranelift tier is measured with ra-jit as it is installed and released, without
      # the `llvm` feature: on Linux a binary that links libLLVM spends about 6 ms loading it
      # each time it starts, which every `cargo ra-jit` does.
      - name: Build ra-jit (as released, and with the llvm feature)
        run: |
          mkdir -p "$BENCH_HOME"
          CARGO_TARGET_DIR="$BENCH_HOME/target" nix develop .#bench -c cargo build -p ra-jit --release
          CARGO_TARGET_DIR="$BENCH_HOME/target-llvm" nix develop .#bench -c cargo build -p ra-jit --release --features llvm
      - name: Bench
        id: bench
        run: |
          export RA_JIT_BIN="$BENCH_HOME/target/release/ra-jit" RA_JIT_LLVM_BIN="$BENCH_HOME/target-llvm/release/ra-jit"
          export RA_JIT_PROJECTS="$BENCH_HOME/projects"
          work=${BENCH_WORK:-$BENCH_HOME/work}
          rm -rf "$work" "$BENCH_HOME/reference"
          mkdir -p "$RUNNER_TEMP/results"
          full=()
          [ "$FULL" = true ] && full=(--setups all --setups-on "ripgrep,nushell" --tests)
          nix develop .#bench -c env -u CARGO_INCREMENTAL -u RUSTC_WRAPPER python3 harness/bench.py \
            ripgrep fd bat hyperfine just axum nushell helix bevy biome --runs 5 --cold-runs 5 "${full[@]}" \
            --work "$work" --reference "$BENCH_HOME/reference" --out "$RUNNER_TEMP/results/bench.json" \
            || { status=$?; [ "$status" = 3 ] || exit "$status"; echo "wrong=true" >> "$GITHUB_OUTPUT"; }
      # How fast the built programs run: harness/runbench.py, ra-jit's LLVM against
      # `cargo build --release`, into the runtime table.
      - name: Runtime bench
        continue-on-error: true
        run: |
          export RA_JIT_BIN="$BENCH_HOME/target-llvm/release/ra-jit" APPS_DIR="$BENCH_HOME/apps"
          nix develop .#bench -c env -u CARGO_INCREMENTAL -u RUSTC_WRAPPER python3 harness/bench.py --runtime \
            --runs 5 --out "$RUNNER_TEMP/results/runtime.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.slug }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
      - name: Fail on a wrong result
        if: steps.bench.outputs.wrong == 'true'
        run: |
          echo "::error::under ra-jit a program or a test suite ended otherwise than under cargo: see the Bench step and the tests table"
          exit 1

  # Every platform's results into the README, docs/benchmarks.md and the history, in one commit:
  # the platforms run at once, and one writer keeps their commits from racing.
  publish:
    name: README, history and regressions
    needs: [platforms, bench]
    if: >-
      always() && needs.platforms.outputs.any == 'true' &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      # To start the site's deploy after the history commit: a push by GITHUB_TOKEN starts no workflow.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The ruleset on main refuses a push from the workflow's own token: this one is allowed
          # past it (docs/harness.md, "CI").
          token: ${{ secrets.RA_JIT_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/results
      - name: README and docs/benchmarks.md
        run: |
          # A result refused (a program that said something else) leaves its platform's numbers as they were.
          for result in "$RUNNER_TEMP"/results/bench-*/bench.json "$RUNNER_TEMP"/results/bench-*/runtime.json; do
            [ -f "$result" ] || continue
            echo "::group::$result"
            python3 harness/benchreport.py "$result" ${{ inputs.force && '--force' || '' }} || echo "::warning::$result was not published"
            echo "::endgroup::"
          done
      - name: History and regressions
        id: history
        run: |
          regressed=false
          : > "$RUNNER_TEMP/regressions.md"
          for result in "$RUNNER_TEMP"/results/bench-*/bench.json; do
            [ -f "$result" ] || continue
            slug=$(basename "$(dirname "$result")"); slug=${slug#bench-}
            python3 harness/benchhistory.py build "$result" --history "docs/benchmarks/history/$slug.jsonl"
            python3 harness/benchhistory.py check "docs/benchmarks/history/$slug.jsonl" --report "$RUNNER_TEMP/regressions-$slug.md" || regressed=true
            cat "$RUNNER_TEMP/regressions-$slug.md" >> "$RUNNER_TEMP/regressions.md"
          done
          echo "regressed=$regressed" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/regressions.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to main
        run: |
          git add README.md docs/benchmarks.md docs/benchmarks/
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "bench: numbers for ${GITHUB_SHA::10} [skip ci]"
          # Main may have moved during the run: put the commit on top and try again.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::the bench commit does not apply to main"; exit 1; }
            if git push -q origin HEAD:main; then
              gh workflow run site.yaml --ref main
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Open or update the regression issue
        if: steps.history.outputs.regressed == 'true'
        run: |
          gh label create bench-regression --color B60205 --description "A benchmark median moved past its noise band" --force
          open=$(gh issue list --label bench-regression --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/regressions.md"
          else
            gh issue create --title "Benchmark regression at ${GITHUB_SHA::10}" --label bench-regression \
              --body-file "$RUNNER_TEMP/regressions.md"
          fi
          echo "::error::a benchmark regressed beyond its noise band: see the run summary"
          exit 1
