# The bundle's own check, and the smallest consumer of it (docs/reports/CI-fork.md): it takes
# the bundle as every check does, verifies it, checks that the owned macro runtime is the one
# bootstrapped by this bundle's ra-jit, and runs the C2 contract tests from it.
name: bundle check

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      os:
        type: string
        required: true
      bundle-sha256:
        type: string
        required: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: "0"

defaults:
  run:
    shell: bash

jobs:
  check:
    name: bundle (${{ inputs.platform }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The Nix store paths the binaries link against; the cache is the build job's, read only.
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
          shell: bench
          cache: nix
          cache-save: false
      - uses: ./.github/actions/bundle
        with:
          platform: ${{ inputs.platform }}
          sha256: ${{ inputs.bundle-sha256 }}
      - name: The owned macro runtime is this ra-jit's
        run: |
          python3 -I -c '
          import json, sys
          sys.path.insert(0, "harness/dist")
          from owned_macro_server import runtime_record
          record = runtime_record(sys.argv[1], sys.argv[2])
          print(json.dumps(record, indent=1))
          assert record["bootstrap_compiler_matches"], "the runtime was bootstrapped by another ra-jit"
          ' "$RUNNER_TEMP/owned-runtime/blaze-proc-macro-srv" "$GITHUB_WORKSPACE/target/release/ra-jit"
      - name: Native platform and immutable input contracts
        run: nix develop .#bench --command python3 -I .github/scripts/bundle.py test c2-contracts -- --test-threads=2
