name: Holistic cache invariants proof
on:
  push:
    branches: [verify/holistic-cache-20261031]
    paths: [.github/workflows/holistic-cache-proof.yaml]
permissions:
  contents: write
concurrency:
  group: holistic-cache-proof
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      BASE: b13ad6a7f178b4e4918d744fb058fb03bfd9a02c
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Decode the exact reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/holistic-proof"
          python3 - <<'PY'
          import base64,hashlib,json,os,zlib
          from pathlib import Path
          tail = ''
          payload=zlib.decompress(base64.b64decode(Path('.github/holistic-repairs.b64').read_text()[:6042]+tail,validate=True))
          assert hashlib.sha256(payload).hexdigest()=='0de5ade555a182b6177bf98d7a317aaa1d973b13f289ad6068de58acf091a91d'
          out=Path(os.environ['RUNNER_TEMP'])/'holistic-proof'
          for name,text in json.loads(payload).items(): (out/Path(name).name).write_text(text)
          PY
          git checkout --detach "$BASE"
      - uses: ./.github/actions/toolchain
        with: {components: rustfmt, llvm: build}
      - name: Prove source identity failures before and after
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/holistic-proof"
          cp "$out/source_identity_test.py" harness/source_identity_test.py
          rustc --edition=2024 crates/ra-jit/build.rs -o "$out/identity-before"
          set +e
          BLAZE_BUILD_SCRIPT="$out/identity-before" python3 -I harness/source_identity_test.py -v > "$out/identity-before.log" 2>&1
          status=$?
          set -e
          test "$status" = 1
          grep -q 'FAIL: test_directory_symlink_referents_are_hashed' "$out/identity-before.log"
          grep -q 'FAIL: test_unreadable_source_is_not_ignored' "$out/identity-before.log"
          grep -q 'FAIL: test_backslash_filename_is_not_a_directory_separator' "$out/identity-before.log"
          git apply "$out/identity.patch"
          rustfmt --edition 2024 crates/ra-jit/build.rs
          rustc --edition=2024 crates/ra-jit/build.rs -o "$out/identity-after"
          BLAZE_BUILD_SCRIPT="$out/identity-after" python3 -I harness/source_identity_test.py -v 2>&1 | tee "$out/identity-after.log"
      - name: Prove publication race on the original keeper
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/holistic-proof"
          git apply "$out/publication.patch"
          git show "$BASE:crates/ra-jit/src/remote/keeper.rs" > crates/ra-jit/src/remote/keeper.rs
          rustfmt --edition 2024 crates/ra-jit/src/remote/keeper/recovery_tests.rs
          set +e
          nix develop --command cargo test --locked --release -p ra-jit --bin ra-jit remote::keeper::recovery_tests::publishing_cannot_acknowledge_a_peers_unpulled_pack -- --exact --nocapture > "$out/publication-before.log" 2>&1
          status=$?
          set -e
          test "$status" = 101
          grep -q 'a write is not an installed lookup' "$out/publication-before.log"
      - name: Validate repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/holistic-proof"
          git apply --include=crates/ra-jit/src/remote/keeper.rs "$out/publication.patch"
          rustfmt --edition 2024 crates/ra-jit/src/remote/keeper.rs crates/ra-jit/src/remote/keeper/recovery_tests.rs
          nix develop --command cargo test --locked --release -p ra-jit --bin ra-jit remote:: -- --test-threads=2 2>&1 | tee "$out/remote-after.log"
          python3 harness/rustcsites.py | tee "$out/compiler-sites.log"
          cargo fmt --all -- --check
          git diff --check
          git diff > "$out/verified.patch"
      - name: Publish verified source-only review branches
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/holistic-proof"
          git config user.name 'Blaze repair'
          git config user.email 'noreply@openai.com'
          git add crates/ra-jit/src/remote/keeper.rs crates/ra-jit/src/remote/keeper/recovery_tests.rs
          git commit -m 'Do not acknowledge remote cache reads when publishing local work'
          git branch review/holistic-remote-publication
          git push origin HEAD:refs/heads/review/holistic-remote-publication
          git add crates/ra-jit/build.rs harness/source_identity_test.py
          git commit -m 'Reject incomplete compiler source identities and hash directory aliases'
          git branch review/holistic-source-identity
          git push origin HEAD:refs/heads/review/holistic-source-identity
          git log -2 --format='%H %s' > "$out/commits.txt"
          git bundle create "$out/validated.bundle" review/holistic-remote-publication review/holistic-source-identity "^$BASE"
          git status --porcelain > "$out/status.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: holistic-cache-proof
          path: |
            ${{ runner.temp }}/holistic-proof/*.log
            ${{ runner.temp }}/holistic-proof/*.patch
            ${{ runner.temp }}/holistic-proof/*.txt
            ${{ runner.temp }}/holistic-proof/*.bundle
          retention-days: 7
          if-no-files-found: error
