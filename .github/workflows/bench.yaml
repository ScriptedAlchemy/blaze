name: bench
on:
  push:
    branches: ["main"]
    paths-ignore: ["site/**", "**.md", "harness/**"]
  pull_request:
    paths-ignore: ["site/**", "**.md", "harness/**"]
  workflow_dispatch:

concurrency:
  # As ra-jit.yaml: a pull request's newer push cancels its run, every push to main finishes.
  group: bench-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # Seconds each benchmark runs for, and the slowdown in percent below which it is noise.
  TIME: 3
  NOISE: 10

defaults:
  run:
    # With pipefail, so that a build or a comparison that fails is not hidden by the pipe.
    shell: bash

jobs:
  tango:
    name: tango
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # sccache serves both builds below: the base's crates, built again for each push to a pull
      # request, come from the cache, and each crate is still what rustc makes of its inputs, so
      # the pair stays the same compiler, flags and machine.
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          cache: sccache
      # The base first, in the same checkout, so that the change's build reuses whatever of
      # it the change did not touch. A base without the benchmarks has nothing to pair with.
      - name: Build the base
        if: github.event_name == 'pull_request'
        env:
          RUSTC_WRAPPER: ${{ steps.toolchain.outputs.rustc-wrapper }}
        run: |
          git checkout -q --detach ${{ github.event.pull_request.base.sha }}
          if [ -d crates/ra-jit-bench ]; then
            cargo bench -p ra-jit-bench --bench store --no-run --message-format=json \
              | jq -r 'select(.executable != null and .target.name == "store") | .executable' \
              | xargs -I{} cp {} "$RUNNER_TEMP/bench-base"
          fi
          git checkout -q --detach ${{ github.sha }}
      - name: Build the change
        env:
          RUSTC_WRAPPER: ${{ steps.toolchain.outputs.rustc-wrapper }}
        run: |
          cargo bench -p ra-jit-bench --bench store --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "store") | .executable' \
            | xargs -I{} cp {} "$RUNNER_TEMP/bench-head"
      - name: Record benchmark context
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/tango"
          {
            git rev-parse HEAD "$BASE_SHA"
            rustc -vV
            cargo --version
            uname -a
            lscpu
            sha256sum "$RUNNER_TEMP"/bench-*
            "$SCCACHE_PATH" --show-stats
          } > "$RUNNER_TEMP/tango/context.txt"
      - name: Compare with the base
        if: github.event_name == 'pull_request'
        run: |
          [ -x "$RUNNER_TEMP/bench-base" ] || { echo "The base has no benchmarks: nothing to compare."; exit 0; }
          attempt=0
          compare() {
            attempt=$((attempt + 1))
            "$RUNNER_TEMP/bench-head" --color never compare "$RUNNER_TEMP/bench-base" \
              -t "$TIME" --noise-threshold "$NOISE" -o -v \
              --dump "$RUNNER_TEMP/tango/compare-$attempt" | tee -a "$RUNNER_TEMP/bench.txt"
          }
          { echo '### tango: change against base'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          compare || { echo "A slowdown over ${NOISE}%: measuring again" | tee -a "$RUNNER_TEMP/bench.txt"; compare || status=$?; }
          { cat "$RUNNER_TEMP/bench.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = 0 ] || echo "::error::both benchmark comparisons report a slowdown over ${NOISE}%"
          exit "$status"
      # On main, and on a pull request whose base has no benchmarks.
      - name: Times
        run: |
          [ ! -x "$RUNNER_TEMP/bench-base" ] || exit 0
          "$RUNNER_TEMP/bench-head" --color never solo -t "$TIME" | tee "$RUNNER_TEMP/bench.txt"
          { echo '### tango'; echo '```'; cat "$RUNNER_TEMP/bench.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep paired benchmark evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: tango-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tango
            ${{ runner.temp }}/bench.txt
          retention-days: 7
