name: bench
on:
  push:
    branches: ["main"]
    paths-ignore: ["site/**", "**.md", "harness/**"]
  pull_request:
    paths-ignore: ["site/**", "**.md", "harness/**"]
  workflow_dispatch:

concurrency:
  # As ra-jit.yaml: a pull request's newer push cancels its run, every push to main finishes.
  group: bench-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # Seconds each benchmark runs for, and the slowdown in percent below which it is noise.
  TIME: 3
  NOISE: 10

defaults:
  run:
    # With pipefail, so that a build or a comparison that fails is not hidden by the pipe.
    shell: bash

jobs:
  tango:
    name: tango
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      # Both builds place every function and loop head on the same alignment. The benchmark
      # links hir-ty-codegen, so a change there moves the addresses of the store's code the
      # benchmarks measure without touching it, and on x86 a hot loop that lands differently
      # runs tens of percent slower: `store/has_miss` was +47% on four runs of a change that
      # left ra-jit-store alone, and flat in a paired run on another machine. With the
      # alignment pinned, a difference is the code's.
      - run: echo 'RUSTFLAGS=-C llvm-args=-align-all-functions=6 -C llvm-args=-align-all-nofallthru-blocks=5' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-aligned
      # The base first, in the same checkout, so that the change's build reuses whatever of
      # it the change did not touch. A base without the benchmarks has nothing to pair with.
      - name: Build the base
        if: github.event_name == 'pull_request'
        run: |
          git checkout -q --detach ${{ github.event.pull_request.base.sha }}
          if [ -d crates/ra-jit-bench ]; then
            cargo bench -p ra-jit-bench --bench store --no-run --message-format=json \
              | jq -r 'select(.executable != null and .target.name == "store") | .executable' \
              | xargs -I{} cp {} "$RUNNER_TEMP/bench-base"
          fi
          git checkout -q --detach ${{ github.sha }}
      - name: Build the change
        run: |
          cargo bench -p ra-jit-bench --bench store --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "store") | .executable' \
            | xargs -I{} cp {} "$RUNNER_TEMP/bench-head"
      - name: Record benchmark context
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/tango"
          {
            git rev-parse HEAD "$BASE_SHA"
            rustc -vV
            cargo --version
            uname -a
            lscpu
            sha256sum "$RUNNER_TEMP"/bench-*
          } > "$RUNNER_TEMP/tango/context.txt"
      - name: Compare with the base
        if: github.event_name == 'pull_request'
        run: |
          [ -x "$RUNNER_TEMP/bench-base" ] || { echo "The base has no benchmarks: nothing to compare."; exit 0; }
          attempt=0
          compare() {
            attempt=$((attempt + 1))
            "$RUNNER_TEMP/bench-head" --color never compare "$RUNNER_TEMP/bench-base" \
              -t "$TIME" --noise-threshold "$NOISE" -o -v \
              --dump "$RUNNER_TEMP/tango/compare-$attempt" | tee -a "$RUNNER_TEMP/bench.txt"
          }
          # The base against itself: what the runner alone makes of the same code. A slowdown
          # the change shows twice is judged only where this stays under the threshold; a runner
          # that moves the same binary by more than that cannot tell the change's effect apart.
          control() {
            "$RUNNER_TEMP/bench-base" --color never compare "$RUNNER_TEMP/bench-base" \
              -t "$TIME" --noise-threshold "$NOISE" -o -v \
              --dump "$RUNNER_TEMP/tango/control" | tee -a "$RUNNER_TEMP/bench.txt"
          }
          { echo '### tango: change against base'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          compare || { echo "A slowdown over ${NOISE}%: measuring again" | tee -a "$RUNNER_TEMP/bench.txt"; compare || status=$?; }
          if [ "$status" != 0 ]; then
            echo "The base against itself, to tell the runner's noise from the change's:" | tee -a "$RUNNER_TEMP/bench.txt"
            if ! control; then
              echo "::warning::the runner is too noisy to judge: the base against itself moved over ${NOISE}%; the comparison is not judged (its tables are in the summary)"
              status=0
            fi
          fi
          { cat "$RUNNER_TEMP/bench.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = 0 ] || echo "::error::both benchmark comparisons report a slowdown over ${NOISE}% while the base against itself stays under"
          exit "$status"
      # On main, and on a pull request whose base has no benchmarks.
      - name: Times
        run: |
          [ ! -x "$RUNNER_TEMP/bench-base" ] || exit 0
          "$RUNNER_TEMP/bench-head" --color never solo -t "$TIME" | tee "$RUNNER_TEMP/bench.txt"
          { echo '### tango'; echo '```'; cat "$RUNNER_TEMP/bench.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep paired benchmark evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: tango-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tango
            ${{ runner.temp }}/bench.txt
          retention-days: 7
