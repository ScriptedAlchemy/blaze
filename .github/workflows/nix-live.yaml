# What is new since the fork: the flake (per-unit nix builds of the daemon and the demo), the
# unit graphs behind them, the Game of Life demo, and live edits (ra-jit-live). It takes about
# 40 minutes, so it runs nightly, by hand, and on a change to the flake, nix/ or the
# dependencies (which the unit graphs are generated from); the
# fast tier of ra-jit.yaml has live edits on every change (live_e2e.py, tiers.py). A failed
# nightly opens an issue, or adds to the one still open.
#
#   unit graphs   nix/units/*.json are what `nix/unit_graph.py` generates from Cargo.lock now
#   nix           `nix build` of the daemon, the demo and the per-unit builds, and the flake's apps
#   nix (darwin)  the flake evaluates and builds its cheapest outputs on aarch64-darwin
#   demo          demo/life builds and its window opens (xvfb) and stays up
#   live edits    macOS arm64: edit a running program's function, ra-jit-live applies the patch
#
# The binary cache (FlakeHub) is an optimization, never a gate. FlakeHub wants a flake
# registered with FlakeHub and an OIDC token this repository does not grant, so it is off
# unless the repository variable ENABLE_FLAKEHUB_CACHE is "true"; without it Nix substitutes
# from the signed public cache.nixos.org the installer configures. A cache step that fails
# must not fail a job, so it alone carries `continue-on-error`. Everything the cache would
# speed up -- evaluation, unit-graph regeneration, the Linux and Darwin builds -- runs either
# way. `harness/dist/check_nix_workflow.py` runs as a step in `unit-graphs` and fails when an
# expected gate is missing or made conditional, so deleting a gate is not a way to pass.
# No job adds `id-token: write`: the cache is not worth granting identity.
name: nix and live
on:
  push:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/nix-live.yaml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/nix-live.yaml"
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-live-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: "0"

jobs:
  unit-graphs:
    name: nix unit graphs are current
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Fails when a gate is deleted or made conditional, and when the checker stops catching
      # that (harness/dist/check_nix_workflow.py, test_check_nix_workflow.py).
      - name: the cache is optional and every required command is present
        run: |
          python3 harness/dist/check_nix_workflow.py
          python3 -B harness/dist/test_check_nix_workflow.py
      # unit_graph.py runs cargo from the flake's dev shell (the pinned toolchain).
      - uses: DeterminateSystems/nix-installer-action@v23
      # GitHub ref scoping prevents a PR cache from being read by main or another PR.
      # A fallback restores inputs only: every Nix gate below still executes.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-live-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-live-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock') }}-
          gc-max-store-size: 6G
      - uses: DeterminateSystems/flakehub-cache-action@v3
        # Off unless the repository opts in (header): an unregistered fork's cache cannot
        # authenticate, and that must never fail a job. The Nix commands below run regardless.
        if: vars.ENABLE_FLAKEHUB_CACHE == 'true'
        continue-on-error: true
      - run: python3 nix/unit_graph.py
      - name: nix/units is what unit_graph.py writes
        run: |
          git diff --stat -- nix/units
          git diff --exit-code -- nix/units || { echo "::error::nix/units is stale: run nix/unit_graph.py and commit the result"; exit 1; }

  nix:
    name: nix build (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # GitHub ref scoping prevents a PR cache from being read by main or another PR.
      # A fallback restores inputs only: every Nix gate below still executes.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-live-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-live-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock') }}-
          gc-max-store-size: 6G
      - uses: DeterminateSystems/flakehub-cache-action@v3
        # Off unless the repository opts in (header): an unregistered fork's cache cannot
        # authenticate, and that must never fail a job. The Nix commands below run regardless.
        if: vars.ENABLE_FLAKEHUB_CACHE == 'true'
        continue-on-error: true
      - name: flake evaluates
        run: echo "deliberately broken gate for CI negative control"
      # The daemon as a package, the demo as a package, and the per-unit builds both are made of.
      - name: nix build
        run: nix build --print-build-logs --no-link .#daemon .#run .#life .#daemon-units .#life-bin
      - name: nix run .#blaze
        run: |
          nix run .#blaze -- --help
          nix run .#blaze -- --version || true
          nix run .#ra-jit -- --version || true
      - name: the binaries run each other from next to themselves
        run: |
          for attr in daemon daemon-units; do
            out=$(nix build --no-link --print-out-paths .#$attr)
            for bin in cargo-blaze ra-jit cargo-ra-jit ra-jit-rustc ra-jit-rustc-first; do test -x "$out/bin/$bin"; done
          done

  nix-darwin:
    name: nix build (aarch64-darwin)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # GitHub ref scoping prevents a PR cache from being read by main or another PR.
      # A fallback restores inputs only: every Nix gate below still executes.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-live-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-live-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock') }}-
          gc-max-store-size: 6G
      - uses: DeterminateSystems/flakehub-cache-action@v3
        # Off unless the repository opts in (header): an unregistered fork's cache cannot
        # authenticate, and that must never fail a job. The Nix commands below run regardless.
        if: vars.ENABLE_FLAKEHUB_CACHE == 'true'
        continue-on-error: true
      - name: outputs evaluate
        run: |
          for attr in daemon run life daemon-units life-bin; do
            nix eval --raw ".#packages.aarch64-darwin.$attr.drvPath"; echo
          done
      - name: nix build (the daemon, per cargo unit)
        run: nix build --print-build-logs --no-link .#daemon-units .#run

  demo:
    name: demo/life and ra-jit-live (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            demo/life -> target
      # ra-jit-live is a stub where live edits are not supported, and says so.
      - run: cargo test --release -p ra-jit-live
      - run: cargo build --locked
        working-directory: demo/life
      - name: window opens and stays up
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libwayland-client0
          export LIBGL_ALWAYS_SOFTWARE=1
          status=0
          timeout 15 xvfb-run -a --server-args="-screen 0 1280x800x24" demo/life/target/debug/life > life.log 2>&1 || status=$?
          cat life.log
          # timeout's own 124: the window was still up when it was stopped.
          test "$status" = 124 || { echo "::error::the window exited ($status) before it was stopped"; exit 1; }
          ! grep -E -i "panicked|Err\(" life.log

  live-edits:
    name: live edits (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    # Not required: it runs a daemon, a program and a patch between them on a hosted macOS VM,
    # which has been the least steady thing in the repository. Whatever it says is still shown.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      # Where it is real code: the whole of macos.rs and the patch format.
      - run: cargo test --release -p ra-jit-live
      - run: cargo build --release -p ra-jit
      - name: edit a running program
        run: RA_JIT_BIN="$GITHUB_WORKSPACE/target/release/ra-jit" python3 harness/live_e2e.py
      - name: crash reports
        if: failure()
        run: |
          for report in "$HOME"/Library/Logs/DiagnosticReports/*; do
            case "$report" in *ra-jit*|*liveprobe*) echo "::group::$report"; head -c 20000 "$report"; echo; echo "::endgroup::";; esac
          done
      - name: the demo builds on macOS
        run: cargo build --locked
        working-directory: demo/life

  nightly:
    name: nightly issue
    needs: [unit-graphs, nix, nix-darwin, demo, live-edits]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue
