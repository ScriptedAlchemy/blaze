name: Concurrent holder fencing proof
on:
  push:
    branches: [verify/concurrent-repairs-20261101]
    paths: [.github/workflows/concurrent-holder-proof.yaml]
permissions:
  contents: write
jobs:
  holder:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Use the exact reviewed holder head
        shell: bash
        run: git checkout --detach 8cf8a9c79679741e84434eb6bc740cc2447b0c17
      - name: Pinned compiler and formatter
        run: |
          rustup toolchain install 1.99.0 --profile minimal -c rustfmt
          rustup default 1.99.0
      - name: Apply the formatter and test the complete distributed state machines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/holder-proof"
          cargo fmt -p blaze-dist
          cargo test --locked -p blaze-dist -p blaze-dist-local -p blaze-wire 2>&1 | tee "$RUNNER_TEMP/holder-proof/tests.log"
          cargo fmt --all -- --check
          git diff --check
          git diff > "$RUNNER_TEMP/holder-proof/format.patch"
      - name: Publish only the verified formatting repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = crates/blaze-dist/tests/holder.rs
          git config user.name 'Blaze repair'
          git config user.email 'noreply@openai.com'
          git add crates/blaze-dist/tests/holder.rs
          git commit -m 'Apply pinned rustfmt to the passing holder fencing regressions'
          git push --force-with-lease=refs/heads/review/holistic-heartbeat-fencing:8cf8a9c79679741e84434eb6bc740cc2447b0c17 origin HEAD:refs/heads/review/holistic-heartbeat-fencing
          git log -1 --format='%H %s' > "$RUNNER_TEMP/holder-proof/commit.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: concurrent-holder-proof
          path: ${{ runner.temp }}/holder-proof
          retention-days: 7
          if-no-files-found: error
