# Nix with flakes on GitHub-hosted runners.
name: nix
description: Nix with flakes on a GitHub-hosted runner
inputs:
  cache:
    description: keep what Nix builds in the Actions cache, on a hosted runner (magic-nix-cache)
    default: "false"
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@v23
    - if: inputs.cache == 'true'
      uses: DeterminateSystems/magic-nix-cache-action@v15
      with:
        use-flakehub: false
        use-gha-cache: true
