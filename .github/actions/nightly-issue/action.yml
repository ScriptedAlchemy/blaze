# A failed nightly run, as an issue: the jobs that failed and a link to the run. While the issue
# of a workflow is open, each later failed night is a comment on it instead of another issue.
# The job that uses it needs `issues: write`.
#
# A job cancelled before any runner took it (no runner name: the hosted pool had no machine for
# it) is listed apart, as capacity rather than a failure, with a note that the gates waiting on
# it fail with it. A repository with issues turned off (the fork) gets the same report in the
# job summary and a warning, and the job passes: there is nowhere to file it, and failing would
# only turn one red mark into two.
name: nightly issue
description: Open or add to the issue of a failed nightly run
inputs:
  title:
    description: the issue's title; one title keeps one issue open across runs
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TITLE: ${{ inputs.title }}
      run: |
        title="${TITLE:-Nightly $GITHUB_WORKFLOW failed}"
        jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
          --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
                | [(if .conclusion == "cancelled" and ((.runner_name // "") == "") then "unplaced" else .conclusion end), .name, .html_url] | @tsv')
        failed= unplaced=
        while IFS=$'\t' read -r kind name url; do
          [ -n "$kind" ] || continue
          if [ "$kind" = unplaced ]; then
            unplaced+="- [$name]($url): cancelled before any runner took it"$'\n'
          else
            failed+="- [$name]($url): $kind"$'\n'
          fi
        done <<< "$jobs"
        note=
        if [ -n "$unplaced" ]; then
          note=$(printf '%s\n\n%s\n' \
            "Runner capacity: these jobs never ran, so they say nothing about the code. A gate that waits on one of them (\`C2 runtime\`, \`ci\`) fails with it." \
            "$unplaced")
        fi
        body=$(printf '%s at %s (%s):\n\n%s\n\n%s\n' "$RUN" "${GITHUB_SHA:0:10}" "$(date -u +%F)" \
          "${failed:-no job failed by name; see the run}" "$note")
        if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != true ]; then
          printf '## %s\n\n%s\n' "$title" "$body" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=$title::issues are turned off in $GITHUB_REPOSITORY; the report is in the job summary"
          exit 0
        fi
        number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
          --jq "map(select(.title == \"$title\")) | first | .number // empty")
        if [ -n "$number" ]; then
          gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
        else
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
        fi
