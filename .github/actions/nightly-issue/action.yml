# A failed nightly run, as an issue: the jobs that failed and a link to the run. While the issue
# of a workflow is open, each later failed night is a comment on it instead of another issue.
# The job that uses it needs `issues: write`.
name: nightly issue
description: Open or add to the issue of a failed nightly run
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="Nightly $GITHUB_WORKFLOW failed"
        failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
          --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "- [\(.name)](\(.html_url)): \(.conclusion)"')
        body=$(printf '%s at %s (%s):\n\n%s\n' "$RUN" "${GITHUB_SHA:0:10}" "$(date -u +%F)" "${failed:-no job failed by name; see the run}")
        {
          printf '### %s\n\n' "$title"
          printf '%s\n' "$body"
        } >> "$GITHUB_STEP_SUMMARY"
        has_issues=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)
        if [ "$has_issues" = false ]; then
          echo "Issues are disabled; failure details are in this run's summary."
          exit 0
        fi
        if [ "$has_issues" != true ]; then
          echo "Cannot determine whether $GITHUB_REPOSITORY supports issues: $has_issues" >&2
          exit 1
        fi
        number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
          --jq "map(select(.title == \"$title\")) | first | .number // empty")
        if [ -n "$number" ]; then
          gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
        else
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
        fi
