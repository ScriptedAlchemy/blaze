# The fixtures of the distributed program (docs/distributed.md), pinned by commit.
#
# `python3 harness/dist/fetch.py` puts each one in `~/work/<name>` at its pinned commit, and
# `python3 harness/dist/fetch.py --list` prints them. `harness/tracedecay.py --td ~/work/<name>`
# builds it. A fixture is either
#
#   kind = "repo"     a git repository, cloned and checked out at `rev` (a full commit id)
#   kind = "project"  a cargo project fetch.py writes from `files`; nothing to download
#
# `rev` is a full commit id, never a branch or a tag: a tag can move and a branch does. `tag` is
# written beside it for people, and is not used to fetch.
#
# The repositories of `ripgrep` and `nushell` are the ones `harness/bench.py` pins, at the same
# commits, so a number measured here is measured on the same source as the numbers there.

[[fixture]]
name = "hello"
kind = "project"
about = "the hello-world project P0.1's audit and P0-A's positive fixture run on: one binary, one unit test, one doctest"
package = "hello"
program = "hello"
program_args = []

# A library, a binary that prints `hello, world`, a unit test and a doctest, so that P0-A's
# build, test-binary and doctest scenarios all have something to build. No dependency, so nothing
# is downloaded.
[fixture.files]
"Cargo.toml" = """
[package]
name = "hello"
version = "0.1.0"
edition = "2021"

[lib]
name = "hello"
path = "src/lib.rs"

[[bin]]
name = "hello"
path = "src/main.rs"

[dependencies]
"""
"Cargo.lock" = """
# This file is automatically @generated by Cargo.
# It is not intended for manual editing.
version = 4

[[package]]
name = "hello"
version = "0.1.0"
"""
"src/lib.rs" = """
//! The library `hello`'s binary uses.

/// Adds one.
///
/// ```
/// assert_eq!(hello::increment(1), 2);
/// ```
pub fn increment(n: u32) -> u32 {
    n + 1
}

#[cfg(test)]
mod tests {
    #[test]
    fn increments() {
        assert_eq!(super::increment(41), 42);
    }
}
"""
"src/main.rs" = """
fn main() {
    println!("hello, world");
}
"""

