# The smoke's member on the blaze edition. It names nothing of its standard library: the
# toolchain gives every crate of the edition bstd as `std` (docs/v2/plan/design/toolchain.md,
# "What each unit is given"), so a manifest line naming bstd is the finding
# `toolchain-crate-named` (the same page, "The finding"): the line shadows the toolchain's
# bstd and can silently be another version. So every round's smoke compiles the toolchain's
# bstd under blaze, and a change to a blaze-core enum that bstd matches on with no catch-all
# (`Effect`, `Done`) fails the round it lands in, not the first blaze-edition test someone runs
# later (2026-11-12: `Effect::Prewarm`, `Effect::Barrier`, `Done::Ordered` and `Done::Prewarmed`
# broke bstd unseen, since cargo never builds it).
[package]
name = "smoke-edition"
version = "0.1.0"
edition = "blaze-2026.11"
